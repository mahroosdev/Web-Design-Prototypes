<html lang="en">
<head><meta charset="UTF-8">
<meta name="description" content="Learning Platform — part of a professional web developer portfolio with 50+ projects.">

<title>Learning Platform</title><style>*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#020617 0%,#0f172a 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;min-height:100vh;padding:40px 20px;overflow-x:hidden}
.container{max-width:1000px;margin:0 auto}
h1{background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:36px;margin-bottom:8px}
.subtitle{color:#94a3b8;margin-bottom:28px;font-size:15px}
.back-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;color:#38bdf8;text-decoration:none;font-weight:600;font-size:14px;padding:8px 14px;border:1px solid rgba(56,189,248,.3);border-radius:8px;transition:.2s}
.back-link:hover{background:rgba(56,189,248,.1)}
.card{background:rgba(30,41,59,.8);backdrop-filter:blur(10px);padding:24px;border-radius:16px;border:1px solid rgba(56,189,248,.2);margin-bottom:20px}
.btn{padding:10px 22px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;transition:.2s;background:linear-gradient(90deg,#38bdf8,#22c55e);color:#000}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(56,189,248,.35)}
.btn-outline{background:transparent;border:1px solid rgba(56,189,248,.4);color:#38bdf8}
.btn-red{background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff}
input,textarea,select{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
input::placeholder,textarea::placeholder{color:#64748b}
label{display:block;font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.3)}
.badge-green{background:rgba(34,197,94,.15);color:#22c55e;border-color:rgba(34,197,94,.3)}
.badge-red{background:rgba(239,68,68,.15);color:#ef4444;border-color:rgba(239,68,68,.3)}
.badge-yellow{background:rgba(234,179,8,.15);color:#eab308;border-color:rgba(234,179,8,.3)}
.stat-box{background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.15);border-radius:12px;padding:20px;text-align:center}
.stat-num{font-size:32px;font-weight:800;background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:12px;color:#64748b;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
hr{border:none;border-top:1px solid rgba(56,189,248,.1);margin:20px 0}
@media(max-width:768px){body{padding:15px 12px}h1{font-size:26px}.grid2,.grid3,.grid4{grid-template-columns:1fr}.card{padding:16px 14px}}
.course-card{background:rgba(30,41,59,.8);border:1px solid rgba(56,189,248,.15);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:.2s}
.course-card:hover,.course-card.active{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.06)}
.course-icon{font-size:28px;margin-bottom:8px;display:block}
.course-title{font-weight:800;font-size:15px;margin-bottom:4px}
.course-meta{font-size:12px;color:#64748b;margin-bottom:8px}
.progress-bar{height:6px;background:rgba(56,189,248,.1);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e);border-radius:3px;transition:width .5s}
.lesson-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;transition:.2s;margin-bottom:4px}
.lesson-item:hover{background:rgba(56,189,248,.08)}
.lesson-item.done{opacity:.7}
.lesson-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.cat-btn{padding:5px 12px;border:1px solid rgba(56,189,248,.3);background:transparent;color:#64748b;border-radius:20px;cursor:pointer;font-size:11px;font-weight:700;transition:.2s}
.cat-btn.active{background:rgba(56,189,248,.2);color:#38bdf8;border-color:#38bdf8}
.ach-item{background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.15);border-radius:10px;padding:12px;text-align:center}
.streak-dot{width:14px;height:14px;border-radius:3px;flex-shrink:0}
/* ── UNIVERSAL UPGRADE: Theme, Animations, Toast ── */
:root{
  --bg:#020617;--bg2:#0f172a;--card:rgba(30,41,59,.85);--border:rgba(56,189,248,.22);
  --accent:#38bdf8;--accent2:#22c55e;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;
}


/* Toast notifications */
.u-toast-container{position:fixed;bottom:24px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.u-toast{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  animation:uToastIn .3s ease;display:flex;align-items:center;gap:8px;
}
.u-toast.success{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.u-toast.error{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.u-toast.info{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
@keyframes uToastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes uToastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* Entrance animations */
@keyframes uFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes uFadeIn{from{opacity:0}to{opacity:1}}
@keyframes uPulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.4)}70%{box-shadow:0 0 0 8px rgba(56,189,248,0)}}
.u-fade-up{animation:uFadeUp .45s ease both}
.u-fade-in{animation:uFadeIn .4s ease both}
.u-pulse{animation:uPulse 2s infinite}

/* Button hover lift */
.btn:hover,[class*="btn"]:not([class*="btn-"]):hover{transform:translateY(-2px)!important}

/* Smooth card hover */
.card:hover,[class*="card"]:hover{
  border-color:var(--accent)!important;
  box-shadow:0 6px 28px rgba(56,189,248,.12)!important;
  transition:all .25s ease!important;
}

/* Loading skeleton */
.u-skeleton{
  background:linear-gradient(90deg,rgba(56,189,248,.06) 25%,rgba(56,189,248,.12) 50%,rgba(56,189,248,.06) 75%);
  background-size:200% 100%;animation:uSkeleton 1.4s infinite;border-radius:6px;
}
@keyframes uSkeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Progress bar component */
.u-progress{height:5px;background:rgba(56,189,248,.12);border-radius:3px;overflow:hidden;margin:8px 0}
.u-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s ease}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.55)}

/* Mobile responsive upgrades */
@media(max-width:600px){
  
  .u-toast-container{right:10px;bottom:80px;max-width:calc(100vw - 20px)}
}

<body><div class="container">
<a href="../index.html" class="back-link" onclick="window.close(); return false;">← Back to Portfolio</a>

<h1>🎓 LearnHub</h1>
<p class="subtitle">Professional online learning platform with courses & progress tracking</p>
<div class="grid2" style="align-items:start">
  <div>
    <div class="card">
      <div class="flex" style="margin-bottom:14px">
        <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#22c55e);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">👨‍💻</div>
        <div><div style="font-weight:800;font-size:16px">Alex Johnson</div><div style="font-size:13px;color:#64748b">Full-Stack Developer</div><div class="badge badge-green" style="margin-top:4px">Pro Member</div></div>
      </div>
      <div class="grid3" style="gap:10px">
        <div class="stat-box"><div class="stat-num" id="totalCourses" style="font-size:22px">0</div><div class="stat-label">Enrolled</div></div>
        <div class="stat-box"><div class="stat-num" id="completedCourses" style="font-size:22px">0</div><div class="stat-label">Completed</div></div>
        <div class="stat-box"><div class="stat-num" id="totalXP" style="font-size:22px">0</div><div class="stat-label">XP</div></div>
      </div>
    </div>
    <div class="card">
      <h3 style="color:#38bdf8;margin-bottom:14px">My Courses</h3>
      <input id="courseSearch" placeholder="Search courses..." oninput="renderCourses()" style="margin-bottom:12px">
      <div class="flex" style="gap:6px;flex-wrap:wrap;margin-bottom:12px" id="catFilters"></div>
      <div id="courseList"></div>
    </div>
  </div>
  <div>
    <div id="courseDetail" class="card">
      <div style="text-align:center;padding:30px;color:#64748b">
        <div style="font-size:48px;margin-bottom:12px">🎓</div>
        <div>Select a course to start learning</div>
      </div>
    </div>
    <div class="card">
      <h3 style="color:#38bdf8;margin-bottom:14px">🏆 Achievements</h3>
      <div id="achievements" class="grid4" style="gap:10px"></div>
    </div>
    <div class="card">
      <h3 style="color:#38bdf8;margin-bottom:14px">Learning Streak</h3>
      <div id="streakCalendar" style="display:flex;gap:4px;flex-wrap:wrap"></div>
      <div style="font-size:13px;color:#64748b;margin-top:10px">🔥 <span id="streakDays">12</span> day streak! Keep it up!</div>
    </div>
  </div>
</div>
</div><script>
const courses=[
  {id:1,title:'React & Next.js Masterclass',cat:'Frontend',icon:'⚛️',color:'#38bdf8',level:'Intermediate',duration:'24h',xp:500,progress:65,lessons:[{title:'React Fundamentals Review',dur:'45m',done:true},{title:'Hooks Deep Dive',dur:'60m',done:true},{title:'Context & State Management',dur:'50m',done:true},{title:'Next.js App Router',dur:'55m',done:false},{title:'Server Components',dur:'60m',done:false},{title:'Deployment & CI/CD',dur:'45m',done:false}]},
  {id:2,title:'Node.js & Express API',cat:'Backend',icon:'🟢',color:'#22c55e',level:'Intermediate',duration:'18h',xp:400,progress:30,lessons:[{title:'REST API Design Principles',dur:'40m',done:true},{title:'Express Middleware',dur:'35m',done:false},{title:'Authentication with JWT',dur:'50m',done:false},{title:'Database Integration',dur:'60m',done:false},{title:'Testing with Jest',dur:'45m',done:false}]},
  {id:3,title:'TypeScript Fundamentals',cat:'Languages',icon:'💙',color:'#3b82f6',level:'Beginner',duration:'12h',xp:300,progress:100,lessons:[{title:'Types & Interfaces',dur:'40m',done:true},{title:'Generics',dur:'45m',done:true},{title:'Decorators',dur:'35m',done:true},{title:'Utility Types',dur:'40m',done:true}]},
  {id:4,title:'System Design Interview Prep',cat:'Career',icon:'🏗️',color:'#f59e0b',level:'Advanced',duration:'30h',xp:600,progress:10,lessons:[{title:'Scalability Basics',dur:'60m',done:true},{title:'Database Design',dur:'70m',done:false},{title:'Caching Strategies',dur:'55m',done:false},{title:'Microservices',dur:'75m',done:false},{title:'Real-world Case Studies',dur:'90m',done:false}]},
  {id:5,title:'CSS & Tailwind Mastery',cat:'Frontend',icon:'🎨',color:'#a855f7',level:'Beginner',duration:'10h',xp:250,progress:80,lessons:[{title:'Flexbox & Grid',dur:'50m',done:true},{title:'Animations & Transitions',dur:'40m',done:true},{title:'Tailwind Utility Classes',dur:'45m',done:true},{title:'Component Design',dur:'50m',done:false}]},
];

const achievements=[
  {icon:'🎯',name:'First Course',unlocked:true},{icon:'🔥',name:'7-Day Streak',unlocked:true},{icon:'⚡',name:'Speed Learner',unlocked:true},{icon:'🏆',name:'Course Master',unlocked:false},
  {icon:'💎',name:'Pro Member',unlocked:true},{icon:'🌟',name:'Top Student',unlocked:false},{icon:'🚀',name:'Fast Tracker',unlocked:true},{icon:'📚',name:'Bookworm',unlocked:false},
];

let enrolled=[1,2,3,4,5],activeId=null,catFilter=null;
const cats=['All','Frontend','Backend','Languages','Career'];

function renderCatFilters(){
  document.getElementById('catFilters').innerHTML=cats.map(c=>`<button class="cat-btn ${(!catFilter&&c==='All')||catFilter===c?'active':''}" onclick="setcat('${c}')">${c}</button>`).join('');
}
function setcat(c){catFilter=c==='All'?null:c;renderCatFilters();renderCourses();}

function renderCourses(){
  const q=document.getElementById('courseSearch').value.toLowerCase();
  const list=courses.filter(c=>{
    const mq=!q||c.title.toLowerCase().includes(q);
    const mc=!catFilter||c.cat===catFilter;
    return mq&&mc;
  });
  document.getElementById('courseList').innerHTML=list.map(c=>`
    <div class="course-card ${c.id===activeId?'active':''}" onclick="openCourse(${c.id})">
      <div class="flex" style="margin-bottom:8px">
        <span class="course-icon" style="margin-bottom:0;font-size:24px">${c.icon}</span>
        <div style="flex:1;min-width:0"><div class="course-title">${c.title}</div><div class="course-meta">${c.level} · ${c.duration} · ${c.xp} XP</div></div>
        <span class="badge" style="flex-shrink:0">${c.cat}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${c.progress}%"></div></div>
      <div style="font-size:12px;color:#64748b;margin-top:4px;text-align:right">${c.progress}% complete</div>
    </div>`).join('');
  updateStats();
}

function openCourse(id){
  activeId=id;
  const c=courses.find(c=>c.id===id);
  const done=c.lessons.filter(l=>l.done).length;
  document.getElementById('courseDetail').innerHTML=`
    <div class="flex" style="gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <span style="font-size:36px">${c.icon}</span>
      <div><h3 style="font-size:18px;font-weight:800;margin-bottom:4px">${c.title}</h3><div style="font-size:13px;color:#64748b">${c.level} · ${c.duration} · ${c.xp} XP</div></div>
      <span class="badge" style="margin-left:auto">${c.cat}</span>
    </div>
    <div class="flex" style="justify-content:space-between;margin-bottom:6px;font-size:13px">
      <span style="color:#64748b">Progress</span>
      <span style="font-weight:700;color:#38bdf8">${c.progress}% · ${done}/${c.lessons.length} lessons</span>
    </div>
    <div class="progress-bar" style="height:10px;margin-bottom:20px"><div class="progress-fill" style="width:${c.progress}%"></div></div>
    <h4 style="color:#38bdf8;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Curriculum</h4>
    ${c.lessons.map((l,i)=>`
      <div class="lesson-item ${l.done?'done':''}" onclick="toggleLesson(${c.id},${i})">
        <div class="lesson-num" style="background:${l.done?'rgba(34,197,94,.2)':'rgba(56,189,248,.1)'};color:${l.done?'#22c55e':'#38bdf8'}">${l.done?'✓':i+1}</div>
        <div style="flex:1"><div style="font-weight:600;font-size:14px;color:${l.done?'#64748b':'#e2e8f0'}">${l.title}</div></div>
        <span style="font-size:12px;color:#64748b">${l.dur}</span>
      </div>`).join('')}
    <button class="btn" onclick="continueLesson(${c.id})" style="width:100%;margin-top:16px">${c.progress===100?'Review Course':'Continue Learning →'}</button>`;
  renderCourses();
}

function toggleLesson(cid,idx){
  const c=courses.find(c=>c.id===cid);
  c.lessons[idx].done=!c.lessons[idx].done;
  const done=c.lessons.filter(l=>l.done).length;
  c.progress=Math.round(done/c.lessons.length*100);
  openCourse(cid);updateStats();
}
function continueLesson(cid){
  const c=courses.find(c=>c.id===cid);
  const next=c.lessons.find(l=>!l.done);
  if(next){toggleLesson(cid,c.lessons.indexOf(next));}
}

function updateStats(){
  document.getElementById('totalCourses').textContent=enrolled.length;
  document.getElementById('completedCourses').textContent=courses.filter(c=>c.progress===100).length;
  document.getElementById('totalXP').textContent=courses.reduce((sum,c)=>sum+Math.round(c.xp*c.progress/100),0);
}

function renderAchievements(){
  document.getElementById('achievements').innerHTML=achievements.map(a=>`
    <div class="ach-item" style="${a.unlocked?'':'opacity:.35;filter:grayscale(1)'}">
      <div style="font-size:24px;margin-bottom:4px">${a.icon}</div>
      <div style="font-size:11px;font-weight:700;color:${a.unlocked?'#38bdf8':'#64748b'}">${a.name}</div>
    </div>`).join('');
}

function renderStreak(){
  const days=28,today=new Date();
  document.getElementById('streakCalendar').innerHTML=Array.from({length:days},(_,i)=>{
    const active=i>=(days-12)&&Math.random()>.2;
    const d=new Date(today);d.setDate(d.getDate()-(days-1-i));
    return `<div class="streak-dot" style="background:${active?'rgba(34,197,94,.7)':'rgba(56,189,248,.1)'}" title="${d.toLocaleDateString()}"></div>`;
  }).join('');
}

renderCatFilters();renderCourses();renderAchievements();renderStreak();openCourse(1);
</script><script>
// ── UNIVERSAL UPGRADE: Theme, localStorage, Toast, Animations ──
(function(){
'use strict';

// ── 2. TOAST SYSTEM ──────────────────────────────────────────────
var toastContainer = null;
function getToastContainer(){
  if(!toastContainer || !document.body.contains(toastContainer)){
    toastContainer = document.createElement('div');
    toastContainer.className = 'u-toast-container';
    document.body.appendChild(toastContainer);
  }
  return toastContainer;
}

window.uToast = function(msg, type, duration){
  type = type || 'info';
  duration = duration || 2800;
  var icons = {success:'✅', error:'❌', info:'💡', warning:'⚠️'};
  var c = getToastContainer();
  var t = document.createElement('div');
  t.className = 'u-toast ' + type;
  t.innerHTML = '<span>' + (icons[type]||'💡') + '</span><span>' + msg + '</span>';
  c.appendChild(t);
  setTimeout(function(){
    t.style.animation = 'uToastOut .3s ease forwards';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration);
};

// ── 3. LOCALSTORAGE HELPERS ──────────────────────────────────────
var APP_KEY = 'uapp_' + location.pathname.split('/').pop().replace('.html','');
window.uSave = function(key, val){
  try { localStorage.setItem(APP_KEY + '_' + key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
};
window.uLoad = function(key, def){
  try {
    var v = localStorage.getItem(APP_KEY + '_' + key);
    return v !== null ? JSON.parse(v) : def;
  } catch(e){ return def; }
};
window.uClear = function(key){
  try { localStorage.removeItem(APP_KEY + '_' + key); } catch(e){}
};

// ── 4. ENTRANCE ANIMATIONS ───────────────────────────────────────
function animateEntrance(){
  var cards = document.querySelectorAll('.card, [class*="card"]');
  cards.forEach(function(el, i){
    el.style.opacity = '0';
    el.style.transform = 'translateY(18px)';
    setTimeout(function(){
      el.style.transition = 'opacity .4s ease, transform .4s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, i * 60);
  });
}

// ── 5. SMOOTH COUNTER ANIMATION ──────────────────────────────────
window.uAnimCount = function(el, target, duration, prefix, suffix){
  prefix = prefix || '';
  suffix = suffix || '';
  duration = duration || 1200;
  var start = 0;
  var step = target / (duration / 16);
  var iv = setInterval(function(){
    start = Math.min(start + step, target);
    el.textContent = prefix + Math.round(start).toLocaleString() + suffix;
    if(start >= target) clearInterval(iv);
  }, 16);
};

// ── 6. EXPORT HELPER ─────────────────────────────────────────────
window.uExportJSON = function(data, filename){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.json';
  a.click();
  uToast('Data exported!', 'success');
};
window.uExportCSV = function(rows, filename){
  var csv = rows.map(function(r){ return r.join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.csv';
  a.click();
  uToast('CSV exported!', 'success');
};

// ── 8. INIT ──────────────────────────────────────────────────────
function init(){
  setTimeout(animateEntrance, 100);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
<script>
(function(){
  // ── Study Timer (Pomodoro) ──
  var timerSeconds = 25*60, timerInterval = null, timerRunning = false;
  var pomSessions = typeof uLoad !== 'undefined' ? uLoad('pomodoro_sessions', 0) : 0;

  function injectStudyTimer(){
    if(document.getElementById('uStudyTimer')) return;
    var container = document.querySelector('.grid2')?.parentNode || document.querySelector('.container');
    if(!container) return;
    var panel = document.createElement('div');
    panel.id = 'uStudyTimer';
    panel.className = 'card u-fade-up';
    panel.style.marginTop = '20px';
    panel.innerHTML =
      '<div style="font-weight:700;color:#38bdf8;margin-bottom:14px;font-size:15px">⏱ Pomodoro Study Timer</div>' +
      '<div style="text-align:center">' +
      '<div id="uTimerDisplay" style="font-size:52px;font-weight:900;font-family:monospace;background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px">25:00</div>' +
      '<div style="display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap">' +
      '<button onclick="setPomTimer(25)" style="padding:6px 14px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700">25 min</button>' +
      '<button onclick="setPomTimer(15)" style="padding:6px 14px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700">15 min</button>' +
      '<button onclick="setPomTimer(5)" style="padding:6px 14px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700">5 min break</button>' +
      '</div>' +
      '<div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px">' +
      '<button id="uTimerBtn" onclick="togglePomTimer()" style="padding:10px 24px;background:linear-gradient(90deg,#38bdf8,#22c55e);border:none;color:#000;border-radius:10px;cursor:pointer;font-weight:800;font-size:15px">▶ Start</button>' +
      '<button onclick="resetPomTimer()" style="padding:10px 20px;background:transparent;border:1px solid rgba(56,189,248,.4);color:#38bdf8;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px">↺ Reset</button>' +
      '</div>' +
      '<div style="height:5px;background:rgba(56,189,248,.1);border-radius:3px;overflow:hidden;margin-bottom:10px"><div id="uTimerBar" style="height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e);border-radius:3px;width:100%;transition:width 1s linear"></div></div>' +
      '<div style="font-size:13px;color:#64748b">Sessions completed: <span id="uPomCount" style="color:#38bdf8;font-weight:700">'+pomSessions+'</span></div>' +
      '</div>';
    container.appendChild(panel);
  }

  var pomMax = 25*60;
  window.setPomTimer = function(mins){ resetPomTimer(); pomMax = mins*60; timerSeconds = pomMax; updateTimerDisplay(); };
  window.togglePomTimer = function(){
    timerRunning = !timerRunning;
    var btn = document.getElementById('uTimerBtn');
    if(btn) btn.textContent = timerRunning ? '⏸ Pause' : '▶ Start';
    if(timerRunning){
      timerInterval = setInterval(function(){
        timerSeconds = Math.max(0, timerSeconds - 1);
        updateTimerDisplay();
        if(timerSeconds <= 0){
          clearInterval(timerInterval); timerRunning = false;
          if(btn) btn.textContent = '▶ Start';
          pomSessions++;
          if(typeof uSave !== 'undefined') uSave('pomodoro_sessions', pomSessions);
          var sc = document.getElementById('uPomCount');
          if(sc) sc.textContent = pomSessions;
          if(typeof uToast !== 'undefined') uToast('🍅 Pomodoro complete! Take a break.', 'success', 4000);
        }
      }, 1000);
    } else {
      clearInterval(timerInterval);
    }
  };
  window.resetPomTimer = function(){
    clearInterval(timerInterval); timerRunning = false; timerSeconds = pomMax;
    var btn = document.getElementById('uTimerBtn');
    if(btn) btn.textContent = '▶ Start';
    updateTimerDisplay();
  };
  function updateTimerDisplay(){
    var el = document.getElementById('uTimerDisplay');
    var bar = document.getElementById('uTimerBar');
    if(el) el.textContent = String(Math.floor(timerSeconds/60)).padStart(2,'0') + ':' + String(timerSeconds%60).padStart(2,'0');
    if(bar) bar.style.width = (timerSeconds/pomMax*100) + '%';
  }

  // ── Certificate generator ──
  window.generateCertificate = function(courseTitle){
    var name = typeof uLoad !== 'undefined' ? (uLoad('learner_name','') || 'Developer') : 'Developer';
    var w = window.open('','_blank');
    if(!w) return;
    w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Certificate</title></head><body style="margin:0;background:#f0f9ff;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Georgia,serif"><div style="background:#fff;border:8px solid #38bdf8;border-radius:16px;padding:60px;text-align:center;max-width:620px;box-shadow:0 20px 60px rgba(56,189,248,.2)"><div style="font-size:64px;margin-bottom:16px">🎓</div><div style="font-size:14px;color:#64748b;text-transform:uppercase;letter-spacing:3px;margin-bottom:8px">Certificate of Completion</div><h1 style="color:#1e40af;font-size:36px;margin-bottom:16px">'+name+'</h1><p style="font-size:18px;color:#475569;margin-bottom:8px">has successfully completed</p><h2 style="color:#0f172a;font-size:26px;margin:16px 0;border:2px solid #38bdf8;border-radius:8px;padding:12px">'+courseTitle+'</h2><div style="font-size:40px;margin:20px 0">✨</div><p style="color:#64748b;font-size:14px">Awarded '+new Date().toLocaleDateString('en-US',{year:"numeric",month:"long",day:"numeric"})+'</p><button onclick="window.print()" style="margin-top:20px;padding:10px 24px;background:linear-gradient(90deg,#38bdf8,#22c55e);border:none;color:#000;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px">🖨 Print Certificate</button></div></body></html>');
    w.document.close();
  };

  // Learner name input
  function injectNameInput(){
    if(document.getElementById('uLearnerName')) return;
    var profileCard = document.querySelector('.card:first-child');
    if(!profileCard) return;
    var nameDiv = document.createElement('div');
    nameDiv.style.cssText = 'margin-top:12px;display:flex;gap:8px;align-items:center';
    nameDiv.innerHTML =
      '<input id="uLearnerName" placeholder="Your name for certificates..." value="'+(typeof uLoad!=='undefined'?uLoad('learner_name',''):'')+'" style="flex:1;font-size:13px">' +
      '<button onclick="var n=document.getElementById(\'uLearnerName\').value.trim();if(n&&typeof uSave!==\'undefined\'){uSave(\'learner_name\',n);if(typeof uToast!==\'undefined\')uToast(\'Name saved: \'+n,\'success\');}" style="padding:8px 14px;background:linear-gradient(90deg,#38bdf8,#22c55e);border:none;color:#000;border-radius:8px;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap">Save Name</button>';
    profileCard.appendChild(nameDiv);
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ injectStudyTimer(); injectNameInput(); });
  } else {
    injectStudyTimer(); injectNameInput();
  }
})();
</script>
</body></html>
