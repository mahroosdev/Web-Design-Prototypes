<html lang="en">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #020617 0%, #0f172a 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: white; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #38bdf8; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .back-link:hover { color: #4ade80 !important; }
        h1 { margin-bottom: 10px; background: linear-gradient(90deg, #38bdf8, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 36px; }
        .subtitle { color: #cbd5e1; margin-bottom: 30px; }
        .content { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); padding: 40px; border-radius: 15px; border: 1px solid rgba(56, 189, 248, 0.2); }
        input[type="text"], textarea { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); color: white; border-radius: 6px; padding: 10px; }
        input[type="text"]::placeholder, textarea::placeholder { color: rgba(203, 213, 225, 0.6); }
        button { cursor: pointer; font-weight: 700; }
        .button { display: inline-block; padding: 10px 20px; background: linear-gradient(90deg, #38bdf8, #22c55e); border: none; border-radius: 8px; color: black; text-decoration: none; margin-top: 10px; }
    
        /* Production Features */
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(400px); opacity: 0; } }
        .production-spinner { width: 16px; height: 16px; border: 2px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; }
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
        .app-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-icon { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .btn-icon:hover { background: rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.5); }
    
        /* ===== UNIVERSAL MOBILE RESPONSIVE FIX ===== */
        * { box-sizing: border-box !important; }
        body { overflow-x: hidden !important; }
        
        @media (max-width: 768px) {
            body { padding: 15px 12px !important; }
            .container, [class*="container"], [class*="wrapper"] {
                max-width: 100% !important;
                width: 100% !important;
                padding-left: 12px !important;
                padding-right: 12px !important;
            }
            h1 { font-size: clamp(22px, 6vw, 36px) !important; }
            h2 { font-size: clamp(18px, 5vw, 28px) !important; }
            h3 { font-size: clamp(15px, 4vw, 22px) !important; }
            
            /* Grids → single column */
            [class*="grid"]:not([class*="col-"]) {
                grid-template-columns: 1fr !important;
            }
            /* Flex rows → wrap */
            [class*="header"], [class*="nav"], [class*="toolbar"], [class*="actions"] {
                flex-wrap: wrap !important;
                gap: 8px !important;
            }
            /* Cards and panels */
            [class*="card"], [class*="panel"], [class*="content"], [class*="box"] {
                padding: 16px 14px !important;
            }
            /* Tables → scroll */
            table { display: block !important; overflow-x: auto !important; white-space: nowrap !important; }
            /* Inputs and buttons */
            input, select, textarea { font-size: 16px !important; max-width: 100% !important; }
            button { min-height: 40px !important; }
            /* Sidebar layouts → stack */
            [class*="sidebar"], [class*="side-bar"] {
                width: 100% !important;
                position: relative !important;
                height: auto !important;
            }
            /* Images */
            img { max-width: 100% !important; height: auto !important; }
            /* Canvas */
            canvas { max-width: 100% !important; }
            /* Fixed widths → fluid */
            [style*="width: 1200px"], [style*="width:1200px"],
            [style*="width: 900px"], [style*="width:900px"],
            [style*="width: 800px"], [style*="width:800px"],
            [style*="width: 700px"], [style*="width:700px"],
            [style*="width: 600px"], [style*="width:600px"] {
                width: 100% !important;
                max-width: 100% !important;
            }
        }
        
        @media (max-width: 480px) {
            body { padding: 10px 10px !important; }
            h1 { font-size: clamp(20px, 7vw, 28px) !important; }
            [class*="card"], [class*="panel"] { padding: 12px 10px !important; border-radius: 10px !important; }
            [class*="grid"] { gap: 10px !important; }
            button, .btn, .button { padding: 10px 14px !important; font-size: 13px !important; }
        }
        /* ===== END MOBILE FIX ===== */
        
/* ── UNIVERSAL UPGRADE: Theme, Animations, Toast ── */
:root{
  --bg:#020617;--bg2:#0f172a;--card:rgba(30,41,59,.85);--border:rgba(56,189,248,.22);
  --accent:#38bdf8;--accent2:#22c55e;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;
}


/* Toast notifications */
.u-toast-container{position:fixed;bottom:24px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.u-toast{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  animation:uToastIn .3s ease;display:flex;align-items:center;gap:8px;
}
.u-toast.success{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.u-toast.error{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.u-toast.info{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
@keyframes uToastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes uToastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* Entrance animations */
@keyframes uFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes uFadeIn{from{opacity:0}to{opacity:1}}
@keyframes uPulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.4)}70%{box-shadow:0 0 0 8px rgba(56,189,248,0)}}
.u-fade-up{animation:uFadeUp .45s ease both}
.u-fade-in{animation:uFadeIn .4s ease both}
.u-pulse{animation:uPulse 2s infinite}

/* Button hover lift */
.btn:hover,[class*="btn"]:not([class*="btn-"]):hover{transform:translateY(-2px)!important}

/* Smooth card hover */
.card:hover,[class*="card"]:hover{
  border-color:var(--accent)!important;
  box-shadow:0 6px 28px rgba(56,189,248,.12)!important;
  transition:all .25s ease!important;
}

/* Loading skeleton */
.u-skeleton{
  background:linear-gradient(90deg,rgba(56,189,248,.06) 25%,rgba(56,189,248,.12) 50%,rgba(56,189,248,.06) 75%);
  background-size:200% 100%;animation:uSkeleton 1.4s infinite;border-radius:6px;
}
@keyframes uSkeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Progress bar component */
.u-progress{height:5px;background:rgba(56,189,248,.12);border-radius:3px;overflow:hidden;margin:8px 0}
.u-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s ease}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.55)}

/* Mobile responsive upgrades */
@media(max-width:600px){
  
  .u-toast-container{right:10px;bottom:80px;max-width:calc(100vw - 20px)}
}

</style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link" onclick="window.close(); return false;">← Back to Portfolio</a>
        <h1>✓ Task Manager</h1>
        <p class="subtitle">Smart to-do app with save feature</p>
        
        <div class="content">
            <h2>Task Manager</h2>
            <input type="text" id="taskInput" placeholder="Add a new task..." style="padding:10px; width:100%; margin-bottom:10px; border-radius:6px; border:1px solid rgba(56,189,248,0.3); background:rgba(56,189,248,0.05); color:white;">
            <button onclick="addTask()" style="padding:10px 20px; background:linear-gradient(90deg,#38bdf8,#22c55e); border:none; border-radius:6px; color:black; font-weight:700; cursor:pointer;">Add Task</button>
            <div style="margin-top:20px;">
                <ul id="taskList" style="list-style:none; padding:0;">
                </ul>
            </div>
        </div>
        <script>
        const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            tasks.forEach((t, i) => {
                const li = document.createElement('li');
                li.style = 'background:rgba(56,189,248,0.1); padding:10px; margin:10px 0; border-radius:6px; display:flex; justify-content:space-between; align-items:center;';
                
                const span = document.createElement('span');
                span.style = 'color:white;';
                span.textContent = t;
                
                const btn = document.createElement('button');
                btn.style = 'background:#f97316; border:none; padding:5px 10px; border-radius:4px; color:white; cursor:pointer;';
                btn.textContent = 'Delete';
                btn.onclick = () => deleteTask(i);
                
                li.appendChild(span);
                li.appendChild(btn);
                list.appendChild(li);
            });
        }
        function addTask() {
            const input = document.getElementById('taskInput');
            if (input.value.trim()) {
                tasks.push(input.value);
                localStorage.setItem('tasks', JSON.stringify(tasks));
                input.value = '';
                renderTasks();
            }
        }
        function deleteTask(i) {
            tasks.splice(i, 1);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }
        renderTasks();
        </script>
    
    </div>
    <script>
        function closeWindow(e){if(e)e.stopPropagation();
            try { window.close(); } catch (e) {}
            try {
                if (window.opener) {
                    window.opener.postMessage({ type: 'requestClose', url: window.location.href }, '*');
                    setTimeout(function(){ window.location.href = '../index.html'; }, 300);
                    return;
                }
            } catch (e) {}
            window.location.href = '../index.html';
        }
    </script>
    <script>
(function(){
  try{
    if (window._errorReporterInjected) return;
    window._errorReporterInjected = true;
    function postPayload(payload){
      try{
        if (window.opener && !window.opener.closed){
          window.opener.postMessage({type: 'runtimeError', url: window.location.href, payload: payload}, '*');
        }
      }catch(e){}
    }
    window.addEventListener('error', function(e){
      postPayload({message: e.message, source: e.filename || e.fileName, lineno: e.lineno || e.lineNumber, colno: e.colno || e.columnNumber, stack: e.error && e.error.stack});
    });
    window.addEventListener('unhandledrejection', function(evt){
      var reason = evt.reason; try{ postPayload({message: 'unhandledrejection', reason: String(reason), stack: reason && reason.stack}); }catch(e){}
    });
    const _origConsoleError = console.error.bind(console);
    console.error = function(){
      try{ postPayload({message: 'console.error', args: Array.from(arguments).map(a=>{try{return JSON.stringify(a);}catch(e){return String(a)}})});  }catch(e){}
      _origConsoleError.apply(console, arguments);
    };
  }catch(e){}
})();
    </script>

    <script src="../scripts/production-lib.js" defer></script>
    <script>
        // Project-specific initialization
        const projectPersistence = new window.ProductionLib.PersistenceManager('02-todolist');
        
        // Global error handling
        window.addEventListener('error', (e) => {
            window.ProductionLib.ProductionErrorHandler.handle(e.error, 'Global');
        });

        // Close window utility with proper messaging
        function closeWindow(event) {
            if (event) try { event.preventDefault(); } catch(e) {}
            try { window.close(); } catch (e) {}
            try {
                if (window.opener) {
                    window.opener.postMessage({ type: 'requestClose', url: window.location.href }, '*');
                    setTimeout(() => { window.location.href = '../index.html'; }, 300);
                    return;
                }
            } catch (e) {}
            window.location.href = '../index.html';
        }

        // Keyboard shortcuts help
        document.addEventListener('keydown', (e) => {
            if (e.key === '?' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                e.preventDefault();
                if (window.keyboardShortcuts) {
                    window.keyboardShortcuts.showHelp();
                }
            }
        });

    // ==================== PRODUCTION FEATURES ====================
    // Replace renderTasks to show UI actions with notifications
    const oldRenderTasks = renderTasks;
    window.renderTasks = function() {
        oldRenderTasks();
        // Enhanced delete with confirmation and notification
    };
    
    // Enhanced addTask with notifications
    const oldAddTask = addTask;
    window.addTask = function() {
        const input = document.getElementById('taskInput');
        if (input.value.trim()) {
            tasks.push({text: input.value, completed: false, created: Date.now()});
            projectPersistence.set('tasks', tasks);
            projectPersistence.appendHistory('taskHistory', {action: 'add', task: input.value, timestamp: Date.now()});
            window.notificationSystem?.success?.('Task added! 📝');
            input.value = '';
            renderTasks();
        } else {
            window.notificationSystem?.warning?.('Task cannot be empty');
        }
    };
    
    // Enhanced deleteTask with notifications
    const oldDeleteTask = deleteTask;
    window.deleteTask = function(i) {
        const deletedTask = tasks[i];
        oldDeleteTask(i);
        projectPersistence.set('tasks', tasks);
        projectPersistence.appendHistory('taskHistory', {action: 'delete', task: deletedTask, timestamp: Date.now()});
        window.notificationSystem?.success?.('Task deleted ✓');
    };
    
    // Undo last action
    function undoLastAction() {
        const history = projectPersistence.get('taskHistory', []);
        if (history.length > 0) {
            history.pop();
            projectPersistence.set('taskHistory', history);
            window.notificationSystem?.info?.('Last action undone');
            renderTasks();
        }
    }
    
    // Export tasks
    function exportTasks() {
        const data = {tasks, exportedAt: new Date().toISOString(), count: tasks.length};
        window.ProductionLib.DataExporter.exportJSON(data, 'tasks');
        window.notificationSystem?.success?.('Tasks exported ✓');
    }
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter' && document.getElementById('taskInput') === document.activeElement) {
            e.preventDefault();
            addTask();
        }
    });
    // ==================== END PRODUCTION FEATURES ====================

        </script>
    <script>
// ── UNIVERSAL UPGRADE: Theme, localStorage, Toast, Animations ──
(function(){
'use strict';

// ── 2. TOAST SYSTEM ──────────────────────────────────────────────
var toastContainer = null;
function getToastContainer(){
  if(!toastContainer || !document.body.contains(toastContainer)){
    toastContainer = document.createElement('div');
    toastContainer.className = 'u-toast-container';
    document.body.appendChild(toastContainer);
  }
  return toastContainer;
}

window.uToast = function(msg, type, duration){
  type = type || 'info';
  duration = duration || 2800;
  var icons = {success:'✅', error:'❌', info:'💡', warning:'⚠️'};
  var c = getToastContainer();
  var t = document.createElement('div');
  t.className = 'u-toast ' + type;
  t.innerHTML = '<span>' + (icons[type]||'💡') + '</span><span>' + msg + '</span>';
  c.appendChild(t);
  setTimeout(function(){
    t.style.animation = 'uToastOut .3s ease forwards';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration);
};

// ── 3. LOCALSTORAGE HELPERS ──────────────────────────────────────
var APP_KEY = 'uapp_' + location.pathname.split('/').pop().replace('.html','');
window.uSave = function(key, val){
  try { localStorage.setItem(APP_KEY + '_' + key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
};
window.uLoad = function(key, def){
  try {
    var v = localStorage.getItem(APP_KEY + '_' + key);
    return v !== null ? JSON.parse(v) : def;
  } catch(e){ return def; }
};
window.uClear = function(key){
  try { localStorage.removeItem(APP_KEY + '_' + key); } catch(e){}
};

// ── 4. ENTRANCE ANIMATIONS ───────────────────────────────────────
function animateEntrance(){
  var cards = document.querySelectorAll('.card, [class*="card"]');
  cards.forEach(function(el, i){
    el.style.opacity = '0';
    el.style.transform = 'translateY(18px)';
    setTimeout(function(){
      el.style.transition = 'opacity .4s ease, transform .4s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, i * 60);
  });
}

// ── 5. SMOOTH COUNTER ANIMATION ──────────────────────────────────
window.uAnimCount = function(el, target, duration, prefix, suffix){
  prefix = prefix || '';
  suffix = suffix || '';
  duration = duration || 1200;
  var start = 0;
  var step = target / (duration / 16);
  var iv = setInterval(function(){
    start = Math.min(start + step, target);
    el.textContent = prefix + Math.round(start).toLocaleString() + suffix;
    if(start >= target) clearInterval(iv);
  }, 16);
};

// ── 6. EXPORT HELPER ─────────────────────────────────────────────
window.uExportJSON = function(data, filename){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.json';
  a.click();
  uToast('Data exported!', 'success');
};
window.uExportCSV = function(rows, filename){
  var csv = rows.map(function(r){ return r.join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.csv';
  a.click();
  uToast('CSV exported!', 'success');
};

// ── 8. INIT ──────────────────────────────────────────────────────
function init(){
  setTimeout(animateEntrance, 100);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
<script>
(function(){
  // Wrap add/delete to persist
  var origAdd = window.addTodo || window.addTask || window.add;
  var origDel = window.deleteTodo || window.deleteTask || window.remove;
  
  function saveTodos(){
    var items = [];
    document.querySelectorAll('.todo-item, .task-item, li').forEach(function(li){
      var text = li.querySelector('span,label,p');
      if(text) items.push({text: text.textContent.trim(), done: li.classList.contains('completed')||li.classList.contains('done')});
    });
    uSave('todos', items);
  }
  
  // Auto-save on any checkbox change
  document.addEventListener('change', function(e){
    if(e.target.type === 'checkbox') { setTimeout(saveTodos, 50); }
  });
  document.addEventListener('click', function(e){
    if(e.target.closest('.todo-item,.task-item') || e.target.closest('[onclick*="delete"],[onclick*="remove"],[onclick*="complete"]')){
      setTimeout(saveTodos, 100);
    }
  });
  
  // Add export button
  var header = document.querySelector('h1,h2,.header,.title');
  if(header && !document.getElementById('todoExportBtn')){
    var btn = document.createElement('button');
    btn.id = 'todoExportBtn';
    btn.textContent = '⬇ Export';
    btn.style.cssText = 'float:right;padding:5px 12px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700';
    btn.onclick = function(){
      var items = [];
      document.querySelectorAll('.todo-item,.task-item,li').forEach(function(li){
        var t = li.querySelector('span,label,p');
        if(t) items.push({text:t.textContent.trim(), done:li.classList.contains('completed')});
      });
      uExportJSON(items, 'todos');
    };
    header.appendChild(btn);
  }
  
  uToast('Todos auto-save enabled ✅', 'success', 2000);
})();
</script>
