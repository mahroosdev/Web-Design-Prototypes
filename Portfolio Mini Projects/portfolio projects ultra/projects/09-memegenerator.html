:root{
  --bg:#020617;--bg2:#0f172a;--card:rgba(30,41,59,.85);--border:rgba(56,189,248,.22);
  --accent:#38bdf8;--accent2:#22c55e;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;

/* Toast notifications */
.u-toast-container{position:fixed;bottom:24px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.u-toast{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  animation:uToastIn .3s ease;display:flex;align-items:center;gap:8px;
}
.u-toast.success{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.u-toast.error{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.u-toast.info{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
@keyframes uToastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes uToastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* Entrance animations */
@keyframes uFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes uFadeIn{from{opacity:0}to{opacity:1}}
@keyframes uPulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.4)}70%{box-shadow:0 0 0 8px rgba(56,189,248,0)}}
.u-fade-up{animation:uFadeUp .45s ease both}
.u-fade-in{animation:uFadeIn .4s ease both}
.u-pulse{animation:uPulse 2s infinite}

/* Button hover lift */
.btn:hover,[class*="btn"]:not([class*="btn-"]):hover{transform:translateY(-2px)!important}

/* Smooth card hover */
.card:hover,[class*="card"]:hover{

/* Loading skeleton */

}
@keyframes uSkeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Mobile responsive upgrades */
@media(max-width:600px){

}

    <script>
        // Project-specific initialization
        const projectPersistence = new window.ProductionLib.PersistenceManager('09-memegenerator');
        
        // Global error handling
        window.addEventListener('error', (e) => {
            window.ProductionLib.ProductionErrorHandler.handle(e.error, 'Global');
        });

        // Close window utility with proper messaging
        function closeWindow(event) {
            if (event) try { event.preventDefault(); } catch(e) {}
            try { window.close(); } catch (e) {}
            try {
                if (window.opener) {
                    window.opener.postMessage({ type: 'requestClose', url: window.location.href }, '*');
                    setTimeout(() => { window.location.href = '../index.html'; }, 300);
                    return;
                }
            } catch (e) {}
            window.location.href = '../index.html';
        }

        // Keyboard shortcuts help
        document.addEventListener('keydown', (e) => {
            if (e.key === '?' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                e.preventDefault();
                if (window.keyboardShortcuts) {
                    window.keyboardShortcuts.showHelp();
                }
            }
        });

    // ==================== UNIVERSAL PRODUCTION FEATURES ====================
    // Add export button
    function addUniversalControls() {
        let controls = document.getElementById('universal-controls');
        if (!controls) {
            controls = document.createElement('div');
            controls.id = 'universal-controls';
            controls.style = 'display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;';
            
            let exportBtn = document.createElement('button');
            exportBtn.textContent = '📤 Export Data';
            exportBtn.className = 'btn-icon';
            exportBtn.style = 'background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.3);color:#38bdf8;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;';
            exportBtn.onclick = exportProjectData;
            controls.appendChild(exportBtn);
            
            let helpBtn = document.createElement('button');
            helpBtn.textContent = '? Help';
            helpBtn.className = 'btn-icon';
            helpBtn.style = 'background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.3);color:#38bdf8;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;';
            helpBtn.onclick = () => {
                window.notificationSystem?.info?.('Press ? for keyboard shortcuts');
                if(window.ProductionLib?.KeyboardShortcuts?.showHelp) {
                    window.ProductionLib.KeyboardShortcuts.showHelp();
                }
            };
            controls.appendChild(helpBtn);
            
            // Try to insert at top of content
            const content = document.querySelector('.content') || 
                           document.querySelector('main') ||
                           document.querySelector('.container');
            if (content) {
                content.insertAdjacentElement('afterbegin', controls);
            }
        }
    }
    
    // Export project data
    function exportProjectData() {
        try {
            const allData = {};
            // Collect all project data from persistence
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.includes(projectIdToUse || '')) {
                    allData[key] = localStorage.getItem(key);
                }
            }
            
            const data = {
                projectName: document.title,
                exportedAt: new Date().toISOString(),
                data: allData,
                url: window.location.href
            };
            
            window.ProductionLib?.DataExporter?.exportJSON?.(data, 'project-export');
            window.notificationSystem?.success?.('Data exported ✓');
        } catch (e) {
            window.notificationSystem?.error?.('Export failed');
            console.error('Export error:', e);
        }
    }
    
    // Wrap key user actions with notifications
    function wrapActionWithNotification(element, actionName, notificationText) {
        if (!element) return;
        const originalOnclick = element.onclick;
        element.onclick = function(e) {
            const result = originalOnclick?.call(this, e);
            if (result !== false) {
                window.notificationSystem?.success?.(notificationText || actionName + ' completed');
                projectPersistence?.set?.('lastAction', {action: actionName, timestamp: Date.now()});
            }
            return result;
        };
    }
    
    // Track user interactions
    function trackInteraction(eventName, details) {
        const interactions = projectPersistence?.get?.('interactions', []) || [];
        interactions.push({event: eventName, timestamp: Date.now(), details});
        if (interactions.length > 100) interactions.shift(); // Keep last 100
        projectPersistence?.set?.('interactions', interactions);
    }
    
    // Generic error handling wrapper
    function safeExecute(fn, actionName) {
        try {
            return fn();
        } catch (e) {
            window.notificationSystem?.error?.(actionName + ' failed: ' + e.message);
            window.ProductionLib?.ProductionErrorHandler?.handle?.(e, actionName);
            trackInteraction('error', {action: actionName, error: e.message});
            return null;
        }
    }
    
    // Auto-save handler
    function setupAutoSave() {
        window.addEventListener('beforeunload', () => {
            projectPersistence?.set?.('lastSession', {
                timestamp: Date.now(),
                url: window.location.href
            });
        });
    }
    
    // Initialize all universal features
    addUniversalControls();
    setupAutoSave();
    
    // Keyboard shortcut for export (Ctrl+E)
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'e') {
            e.preventDefault();
            exportProjectData();
        }
    });
    // ==================== END UNIVERSAL FEATURES ====================

    
    // ==================== CREATIVE FEATURES ====================
    function setupCreativeFeatures() {
        // Undo/Redo system
        window.undoStack = [];
        window.redoStack = [];
        
        window.recordState = function(state) {
            window.undoStack.push(state);
            if (window.undoStack.length > 50) window.undoStack.shift();
            window.redoStack = [];
            projectPersistence.set('undoStack', window.undoStack);
            projectPersistence.set('redoStack', []);
        };
        
        window.undo = function() {
            if (window.undoStack.length > 0) {
                const current = window.undoStack.pop();
                window.redoStack.push(current);
                projectPersistence.set('undoStack', window.undoStack);
                projectPersistence.set('redoStack', window.redoStack);
                window.notificationSystem?.info?.('Undone');
                return window.undoStack[window.undoStack.length - 1];
            }
        };
        
        window.redo = function() {
            if (window.redoStack.length > 0) {
                const current = window.redoStack.pop();
                window.undoStack.push(current);
                projectPersistence.set('undoStack', window.undoStack);
                projectPersistence.set('redoStack', window.redoStack);
                window.notificationSystem?.info?.('Redone');
                return current;
            }
        };
        
        // Keyboard shortcuts for undo/redo
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'z') {
                e.preventDefault();
                undo();
            } else if (e.ctrlKey && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) {
                e.preventDefault();
                redo();
            }
        });
        
        // Save presets
        window.savePreset = function(name, data) {
            const presets = projectPersistence.get('presets', []);
            presets.push({name, data, timestamp: Date.now()});
            projectPersistence.set('presets', presets);
            window.notificationSystem?.success?.('Preset saved: ' + name);
        };
        
        window.loadPreset = function(name) {
            const presets = projectPersistence.get('presets', []);
            const preset = presets.find(p => p.name === name);
            if (preset) {
                window.notificationSystem?.success?.('Preset loaded: ' + name);
                return preset.data;
            }
        };
    }
    setupCreativeFeatures();
    // ==================== END CREATIVE FEATURES ====================

        </script>
    <script>
// ── UNIVERSAL UPGRADE: Theme, localStorage, Toast, Animations ──
(function(){
'use strict';

// ── 2. TOAST SYSTEM ──────────────────────────────────────────────
var toastContainer = null;
function getToastContainer(){
  if(!toastContainer || !document.body.contains(toastContainer)){
    toastContainer = document.createElement('div');
    toastContainer.className = 'u-toast-container';
    document.body.appendChild(toastContainer);
  }
  return toastContainer;
}

window.uToast = function(msg, type, duration){
  type = type || 'info';
  duration = duration || 2800;
  var icons = {success:'✅', error:'❌', info:'💡', warning:'⚠️'};
  var c = getToastContainer();
  var t = document.createElement('div');
  t.className = 'u-toast ' + type;
  t.innerHTML = '<span>' + (icons[type]||'💡') + '</span><span>' + msg + '</span>';
  c.appendChild(t);
  setTimeout(function(){
    t.style.animation = 'uToastOut .3s ease forwards';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration);
};

// ── 3. LOCALSTORAGE HELPERS ──────────────────────────────────────
var APP_KEY = 'uapp_' + location.pathname.split('/').pop().replace('.html','');
window.uSave = function(key, val){
  try { localStorage.setItem(APP_KEY + '_' + key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
};
window.uLoad = function(key, def){
  try {
    var v = localStorage.getItem(APP_KEY + '_' + key);
    return v !== null ? JSON.parse(v) : def;
  } catch(e){ return def; }
};
window.uClear = function(key){
  try { localStorage.removeItem(APP_KEY + '_' + key); } catch(e){}
};

// ── 4. ENTRANCE ANIMATIONS ───────────────────────────────────────
function animateEntrance(){
  var cards = document.querySelectorAll('.card, [class*="card"]');
  cards.forEach(function(el, i){
    el.style.opacity = '0';
    el.style.transform = 'translateY(18px)';
    setTimeout(function(){
      el.style.transition = 'opacity .4s ease, transform .4s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, i * 60);
  });
}

// ── 5. SMOOTH COUNTER ANIMATION ──────────────────────────────────
window.uAnimCount = function(el, target, duration, prefix, suffix){
  prefix = prefix || '';
  suffix = suffix || '';
  duration = duration || 1200;
  var start = 0;
  var step = target / (duration / 16);
  var iv = setInterval(function(){
    start = Math.min(start + step, target);
    el.textContent = prefix + Math.round(start).toLocaleString() + suffix;
    if(start >= target) clearInterval(iv);
  }, 16);
};

// ── 6. EXPORT HELPER ─────────────────────────────────────────────
window.uExportJSON = function(data, filename){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.json';
  a.click();
  uToast('Data exported!', 'success');
};
window.uExportCSV = function(rows, filename){
  var csv = rows.map(function(r){ return r.join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.csv';
  a.click();
  uToast('CSV exported!', 'success');
};

// ── 8. INIT ──────────────────────────────────────────────────────
function init(){
  setTimeout(animateEntrance, 100);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>

    panel.style.marginTop = '20px';
    panel.innerHTML = '<div style="display:flex;justify-content:space-between;margin-bottom:12px;align-items:center">' +
      '<div style="font-weight:700;color:#38bdf8">🖼 Saved Memes (' + savedMemes.length + ')</div>' +
      '<button onclick="savedMemes=[];uSave(\'saved_memes\',[]);document.getElementById(\'uMemeGallery\').querySelector(\'#uMemeGrid\').innerHTML=\'<p style=color:#64748b;font-size:13px>No saved memes.</p>\';uToast(\'Gallery cleared\',\'info\')" style="padding:4px 10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700">Clear All</button>' +
      '</div><div id="uMemeGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px"></div>';
    container.appendChild(panel);
    renderMemeGallery();
  }
  
  function renderMemeGallery(){
    var grid = document.getElementById('uMemeGrid');
    if(!grid) return;
    if(!savedMemes.length){grid.innerHTML='<p style="color:#64748b;font-size:13px">Generate a meme and save it!</p>';return;}
    grid.innerHTML = savedMemes.map(function(m,i){
      return '<div style="border:1px solid rgba(56,189,248,.2);border-radius:8px;overflow:hidden;transition:.2s;cursor:pointer" onmouseover="this.style.borderColor=\'#38bdf8\'" onmouseout="this.style.borderColor=\'rgba(56,189,248,.2)\'">' +
        '<img src="' + m.data + '" style="width:100%;display:block" loading="lazy">' +
        '<div style="display:flex;gap:4px;padding:6px">' +
        '<button onclick="var a=document.createElement(\'a\');a.href=\'\' + m.data + \'\';a.download=\'meme_\' + (i+1) + \'.png\';a.click()" style="flex:1;padding:4px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2);color:#38bdf8;border-radius:4px;cursor:pointer;font-size:10px;font-weight:700">⬇</button>' +
        '<button onclick="savedMemes.splice(' + i + ',1);uSave(\'saved_memes\',savedMemes);renderMemeGallery()" style="padding:4px 6px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#ef4444;border-radius:4px;cursor:pointer;font-size:10px;font-weight:700">✕</button>' +
        '</div></div>';
    }).join('');
  }
  
  // Patch gen() to offer save
  var origGen = window.gen;
  if(origGen){
    window.gen = function(){
      origGen();
      setTimeout(function(){
        var canvas = document.querySelector('canvas');
        if(canvas && !document.getElementById('uSaveMemeBtn')){
          var btn = document.createElement('button');
          btn.id = 'uSaveMemeBtn';
          btn.textContent = '💾 Save to Gallery';
          btn.style.cssText = 'display:block;margin:10px auto 0;padding:8px 20px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700';
          btn.onclick = function(){
            savedMemes.unshift({data:canvas.toDataURL(),time:new Date().toLocaleString()});
            if(savedMemes.length>20) savedMemes.pop();
            uSave('saved_memes',savedMemes);
            renderMemeGallery();
            uToast('Meme saved to gallery! 🎉','success');
          };
          canvas.parentNode?.insertBefore(btn, canvas.nextSibling);
        }
      }, 300);
    };
  }
  
  window.renderMemeGallery = renderMemeGallery;
  injectGallery();
})();
</script>
</body>
</html>
