<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="description" content="Color Mixer - Interactive Color Blending — part of a professional web developer portfolio with 50+ projects.">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Mixer - Interactive Color Blending</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .color-section {
            margin-bottom: 25px;
        }

        .color-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .color-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="color"] {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .hex-value {
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            min-width: 70px;
            text-align: center;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .result-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-display {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .result-color {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .result-info {
            flex: 1;
        }

        .result-hex {
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .result-rgb {
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .blend-mode {
            margin-bottom: 20px;
        }

        .blend-mode-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover, select:focus {
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        select option {
            background: #333;
            color: white;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .copy-btn {
            background: rgba(76, 175, 80, 0.3);
        }

        .copy-btn:hover {
            background: rgba(76, 175, 80, 0.5);
        }

        .reset-btn {
            background: rgba(244, 67, 54, 0.3);
        }

        .reset-btn:hover {
            background: rgba(244, 67, 54, 0.5);
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .notification.show {
            opacity: 1;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 22px;
            }

            .color-input-group {
                gap: 8px;
            }

            input[type="color"] {
                width: 50px;
                height: 50px;
            }

            .result-color {
                width: 70px;
                height: 70px;
            }

            .result-hex {
                font-size: 14px;
            }
        }
    
        /* ===== UNIVERSAL MOBILE RESPONSIVE FIX ===== */
        * { box-sizing: border-box !important; }
        body { overflow-x: hidden !important; }
        
        @media (max-width: 768px) {
            body { padding: 15px 12px !important; }
            .container, [class*="container"], [class*="wrapper"] {
                max-width: 100% !important;
                width: 100% !important;
                padding-left: 12px !important;
                padding-right: 12px !important;
            }
            h1 { font-size: clamp(22px, 6vw, 36px) !important; }
            h2 { font-size: clamp(18px, 5vw, 28px) !important; }
            h3 { font-size: clamp(15px, 4vw, 22px) !important; }
            
            /* Grids → single column */
            [class*="grid"]:not([class*="col-"]) {
                grid-template-columns: 1fr !important;
            }
            /* Flex rows → wrap */
            [class*="header"], [class*="nav"], [class*="toolbar"], [class*="actions"] {
                flex-wrap: wrap !important;
                gap: 8px !important;
            }
            /* Cards and panels */
            [class*="card"], [class*="panel"], [class*="content"], [class*="box"] {
                padding: 16px 14px !important;
            }
            /* Tables → scroll */
            table { display: block !important; overflow-x: auto !important; white-space: nowrap !important; }
            /* Inputs and buttons */
            input, select, textarea { font-size: 16px !important; max-width: 100% !important; }
            button { min-height: 40px !important; }
            /* Sidebar layouts → stack */
            [class*="sidebar"], [class*="side-bar"] {
                width: 100% !important;
                position: relative !important;
                height: auto !important;
            }
            /* Images */
            img { max-width: 100% !important; height: auto !important; }
            /* Canvas */
            canvas { max-width: 100% !important; }
            /* Fixed widths → fluid */
            [style*="width: 1200px"], [style*="width:1200px"],
            [style*="width: 900px"], [style*="width:900px"],
            [style*="width: 800px"], [style*="width:800px"],
            [style*="width: 700px"], [style*="width:700px"],
            [style*="width: 600px"], [style*="width:600px"] {
                width: 100% !important;
                max-width: 100% !important;
            }
        }
        
        @media (max-width: 480px) {
            body { padding: 10px 10px !important; }
            h1 { font-size: clamp(20px, 7vw, 28px) !important; }
            [class*="card"], [class*="panel"] { padding: 12px 10px !important; border-radius: 10px !important; }
            [class*="grid"] { gap: 10px !important; }
            button, .btn, .button { padding: 10px 14px !important; font-size: 13px !important; }
        }
        /* ===== END MOBILE FIX ===== */
        
/* ── UNIVERSAL UPGRADE: Theme, Animations, Toast ── */
:root{
  --bg:#020617;--bg2:#0f172a;--card:rgba(30,41,59,.85);--border:rgba(56,189,248,.22);
  --accent:#38bdf8;--accent2:#22c55e;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;
}


/* Toast notifications */
.u-toast-container{position:fixed;bottom:24px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.u-toast{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  animation:uToastIn .3s ease;display:flex;align-items:center;gap:8px;
}
.u-toast.success{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.u-toast.error{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.u-toast.info{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
@keyframes uToastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes uToastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* Entrance animations */
@keyframes uFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes uFadeIn{from{opacity:0}to{opacity:1}}
@keyframes uPulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.4)}70%{box-shadow:0 0 0 8px rgba(56,189,248,0)}}
.u-fade-up{animation:uFadeUp .45s ease both}
.u-fade-in{animation:uFadeIn .4s ease both}
.u-pulse{animation:uPulse 2s infinite}

/* Button hover lift */
.btn:hover,[class*="btn"]:not([class*="btn-"]):hover{transform:translateY(-2px)!important}

/* Smooth card hover */
.card:hover,[class*="card"]:hover{
  border-color:var(--accent)!important;
  box-shadow:0 6px 28px rgba(56,189,248,.12)!important;
  transition:all .25s ease!important;
}

/* Loading skeleton */
.u-skeleton{
  background:linear-gradient(90deg,rgba(56,189,248,.06) 25%,rgba(56,189,248,.12) 50%,rgba(56,189,248,.06) 75%);
  background-size:200% 100%;animation:uSkeleton 1.4s infinite;border-radius:6px;
}
@keyframes uSkeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Progress bar component */
.u-progress{height:5px;background:rgba(56,189,248,.12);border-radius:3px;overflow:hidden;margin:8px 0}
.u-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s ease}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.55)}

/* Mobile responsive upgrades */
@media(max-width:600px){
  
  .u-toast-container{right:10px;bottom:80px;max-width:calc(100vw - 20px)}
}

</style>
</head>
<body>
    <a href="../index.html" class="back-link" onclick="window.close(); return false;">← Back to Portfolio</a>
    
    <div class="container">
        <h1>🎨 Color Mixer</h1>

        <div class="color-section">
            <div class="color-label">Color 1</div>
            <div class="color-input-group">
                <input type="color" id="color1" value="#FF6B6B">
                <input type="range" id="opacity1" min="0" max="100" value="100">
                <div class="hex-value" id="hex1">#FF6B6B</div>
            </div>
        </div>

        <div class="color-section">
            <div class="color-label">Color 2</div>
            <div class="color-input-group">
                <input type="color" id="color2" value="#4ECDC4">
                <input type="range" id="opacity2" min="0" max="100" value="100">
                <div class="hex-value" id="hex2">#4ECDC4</div>
            </div>
        </div>

        <div class="blend-mode">
            <div class="blend-mode-label">Blend Mode</div>
            <select id="blendMode">
                <option value="average">Average</option>
                <option value="lighten">Lighten</option>
                <option value="darken">Darken</option>
                <option value="screen">Screen</option>
                <option value="multiply">Multiply</option>
                <option value="overlay">Overlay</option>
                <option value="weighted">Weighted (Opacity)</option>
            </select>
        </div>

        <div class="result-section">
            <div class="result-label">Result</div>
            <div class="result-display">
                <div class="result-color" id="resultColor"></div>
                <div class="result-info">
                    <div class="result-hex" id="resultHex">#FFFFFF</div>
                    <div class="result-rgb" id="resultRgb">rgb(255, 255, 255)</div>
                </div>
            </div>

            <div class="button-group">
                <button class="copy-btn" onclick="copyColor()">📋 Copy Hex</button>
                <button class="reset-btn" onclick="resetColors()">🔄 Reset</button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        const color1 = document.getElementById('color1');
        const color2 = document.getElementById('color2');
        const opacity1 = document.getElementById('opacity1');
        const opacity2 = document.getElementById('opacity2');
        const blendMode = document.getElementById('blendMode');
        const resultColor = document.getElementById('resultColor');
        const resultHex = document.getElementById('resultHex');
        const resultRgb = document.getElementById('resultRgb');

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        function blendColors() {
            const rgb1 = hexToRgb(color1.value);
            const rgb2 = hexToRgb(color2.value);
            const op1 = parseInt(opacity1.value) / 100;
            const op2 = parseInt(opacity2.value) / 100;
            const mode = blendMode.value;

            let resultRgb;

            switch(mode) {
                case 'average':
                    resultRgb = {
                        r: Math.round((rgb1.r + rgb2.r) / 2),
                        g: Math.round((rgb1.g + rgb2.g) / 2),
                        b: Math.round((rgb1.b + rgb2.b) / 2)
                    };
                    break;
                case 'lighten':
                    resultRgb = {
                        r: Math.max(rgb1.r, rgb2.r),
                        g: Math.max(rgb1.g, rgb2.g),
                        b: Math.max(rgb1.b, rgb2.b)
                    };
                    break;
                case 'darken':
                    resultRgb = {
                        r: Math.min(rgb1.r, rgb2.r),
                        g: Math.min(rgb1.g, rgb2.g),
                        b: Math.min(rgb1.b, rgb2.b)
                    };
                    break;
                case 'screen':
                    resultRgb = {
                        r: Math.round(255 - (255 - rgb1.r) * (255 - rgb2.r) / 255),
                        g: Math.round(255 - (255 - rgb1.g) * (255 - rgb2.g) / 255),
                        b: Math.round(255 - (255 - rgb1.b) * (255 - rgb2.b) / 255)
                    };
                    break;
                case 'multiply':
                    resultRgb = {
                        r: Math.round(rgb1.r * rgb2.r / 255),
                        g: Math.round(rgb1.g * rgb2.g / 255),
                        b: Math.round(rgb1.b * rgb2.b / 255)
                    };
                    break;
                case 'overlay':
                    resultRgb = {
                        r: Math.round(rgb1.r < 128 ? rgb1.r * rgb2.r / 128 : 255 - (255 - rgb1.r) * (255 - rgb2.r) / 128),
                        g: Math.round(rgb1.g < 128 ? rgb1.g * rgb2.g / 128 : 255 - (255 - rgb1.g) * (255 - rgb2.g) / 128),
                        b: Math.round(rgb1.b < 128 ? rgb1.b * rgb2.b / 128 : 255 - (255 - rgb1.b) * (255 - rgb2.b) / 128)
                    };
                    break;
                case 'weighted':
                    const totalOp = op1 + op2;
                    resultRgb = {
                        r: Math.round((rgb1.r * op1 + rgb2.r * op2) / totalOp),
                        g: Math.round((rgb1.g * op1 + rgb2.g * op2) / totalOp),
                        b: Math.round((rgb1.b * op1 + rgb2.b * op2) / totalOp)
                    };
                    break;
                default:
                    resultRgb = rgb1;
            }

            const hexResult = rgbToHex(resultRgb.r, resultRgb.g, resultRgb.b);
            resultColor.style.background = hexResult;
            resultHex.textContent = hexResult;
            resultRgb.textContent = `rgb(${resultRgb.r}, ${resultRgb.g}, ${resultRgb.b})`;

            // Update hex displays
            document.getElementById('hex1').textContent = color1.value.toUpperCase();
            document.getElementById('hex2').textContent = color2.value.toUpperCase();
        }

        function copyColor() {
            const hex = resultHex.textContent;
            navigator.clipboard.writeText(hex).then(() => {
                showNotification('Copied: ' + hex);
            });
        }

        function resetColors() {
            color1.value = '#FF6B6B';
            color2.value = '#4ECDC4';
            opacity1.value = 100;
            opacity2.value = 100;
            blendMode.value = 'average';
            blendColors();
        }

        function showNotification(message) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 2000);
        }

        color1.addEventListener('change', blendColors);
        color2.addEventListener('change', blendColors);
        opacity1.addEventListener('input', blendColors);
        opacity2.addEventListener('input', blendColors);
        blendMode.addEventListener('change', blendColors);

        // Initial blend
        blendColors();
    </script>
<script>
// ── UNIVERSAL UPGRADE: Theme, localStorage, Toast, Animations ──
(function(){
'use strict';

// ── 2. TOAST SYSTEM ──────────────────────────────────────────────
var toastContainer = null;
function getToastContainer(){
  if(!toastContainer || !document.body.contains(toastContainer)){
    toastContainer = document.createElement('div');
    toastContainer.className = 'u-toast-container';
    document.body.appendChild(toastContainer);
  }
  return toastContainer;
}

window.uToast = function(msg, type, duration){
  type = type || 'info';
  duration = duration || 2800;
  var icons = {success:'✅', error:'❌', info:'💡', warning:'⚠️'};
  var c = getToastContainer();
  var t = document.createElement('div');
  t.className = 'u-toast ' + type;
  t.innerHTML = '<span>' + (icons[type]||'💡') + '</span><span>' + msg + '</span>';
  c.appendChild(t);
  setTimeout(function(){
    t.style.animation = 'uToastOut .3s ease forwards';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration);
};

// ── 3. LOCALSTORAGE HELPERS ──────────────────────────────────────
var APP_KEY = 'uapp_' + location.pathname.split('/').pop().replace('.html','');
window.uSave = function(key, val){
  try { localStorage.setItem(APP_KEY + '_' + key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
};
window.uLoad = function(key, def){
  try {
    var v = localStorage.getItem(APP_KEY + '_' + key);
    return v !== null ? JSON.parse(v) : def;
  } catch(e){ return def; }
};
window.uClear = function(key){
  try { localStorage.removeItem(APP_KEY + '_' + key); } catch(e){}
};

// ── 4. ENTRANCE ANIMATIONS ───────────────────────────────────────
function animateEntrance(){
  var cards = document.querySelectorAll('.card, [class*="card"]');
  cards.forEach(function(el, i){
    el.style.opacity = '0';
    el.style.transform = 'translateY(18px)';
    setTimeout(function(){
      el.style.transition = 'opacity .4s ease, transform .4s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, i * 60);
  });
}

// ── 5. SMOOTH COUNTER ANIMATION ──────────────────────────────────
window.uAnimCount = function(el, target, duration, prefix, suffix){
  prefix = prefix || '';
  suffix = suffix || '';
  duration = duration || 1200;
  var start = 0;
  var step = target / (duration / 16);
  var iv = setInterval(function(){
    start = Math.min(start + step, target);
    el.textContent = prefix + Math.round(start).toLocaleString() + suffix;
    if(start >= target) clearInterval(iv);
  }, 16);
};

// ── 6. EXPORT HELPER ─────────────────────────────────────────────
window.uExportJSON = function(data, filename){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.json';
  a.click();
  uToast('Data exported!', 'success');
};
window.uExportCSV = function(rows, filename){
  var csv = rows.map(function(r){ return r.join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.csv';
  a.click();
  uToast('CSV exported!', 'success');
};

// ── 8. INIT ──────────────────────────────────────────────────────
function init(){
  setTimeout(animateEntrance, 100);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
