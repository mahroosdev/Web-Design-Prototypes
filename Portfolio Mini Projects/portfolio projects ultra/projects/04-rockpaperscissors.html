<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rock Paper Scissors — AI-powered game with streak tracking">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✊</text></svg>">
  <title>Rock Paper Scissors</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#020617;--bg2:#0f172a;--card:rgba(30,41,59,.85);--accent:#38bdf8;--green:#22c55e;--orange:#f97316;--red:#ef4444;--border:rgba(56,189,248,.2);--text:#f1f5f9;--muted:#94a3b8}
    body{background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);min-height:100vh;padding:24px 16px;overflow-x:hidden}
    .container{max-width:700px;margin:0 auto}
    a.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;font-weight:600;margin-bottom:18px;transition:.2s}
    a.back:hover{color:var(--green)}
    h1{background:linear-gradient(90deg,var(--accent),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:2rem;margin-bottom:4px}
    .subtitle{color:var(--muted);margin-bottom:24px;font-size:14px}
    .scoreboard{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
    .score-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;backdrop-filter:blur(8px)}
    .score-card.win-card{border-color:rgba(34,197,94,.4)}
    .score-card.lose-card{border-color:rgba(239,68,68,.4)}
    .score-card.draw-card{border-color:rgba(56,189,248,.4)}
    .score-num{font-size:2rem;font-weight:800;line-height:1}
    .score-num.green{background:linear-gradient(135deg,#22c55e,#4ade80);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .score-num.red{background:linear-gradient(135deg,#ef4444,#f87171);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .score-num.blue{background:linear-gradient(135deg,#38bdf8,#7dd3fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .score-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:4px}
    .streak-bar{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(8px)}
    .streak-count{font-weight:800;font-size:18px;color:#f59e0b}
    .best-num{color:var(--green);font-weight:700}
    .arena{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px;backdrop-filter:blur(8px);text-align:center}
    .arena-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-bottom:24px}
    .player-label{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
    .choice-display{width:88px;height:88px;border-radius:50%;border:3px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:40px;transition:all .4s cubic-bezier(.34,1.56,.64,1);background:rgba(0,0,0,.3);margin:0 auto}
    .choice-display.shake{animation:shake .4s ease}
    .choice-display.win{border-color:var(--green);box-shadow:0 0 24px rgba(34,197,94,.4)}
    .choice-display.lose{border-color:var(--red);box-shadow:0 0 24px rgba(239,68,68,.3)}
    .choice-display.draw{border-color:var(--accent);box-shadow:0 0 24px rgba(56,189,248,.3)}
    @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
    .vs-badge{font-size:18px;font-weight:900;color:var(--muted)}
    .result-text{font-size:1.3rem;font-weight:800;min-height:36px;transition:.3s}
    .result-text.win{color:var(--green)}
    .result-text.lose{color:var(--red)}
    .result-text.draw{color:var(--accent)}
    .countdown{font-size:2.5rem;font-weight:900;color:var(--accent);min-height:48px}
    @keyframes countPulse{from{transform:scale(1.4)}to{transform:scale(1)}}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .choice-btn{padding:16px 10px;border:2px solid var(--border);border-radius:12px;background:rgba(30,41,59,.6);color:white;cursor:pointer;font-size:14px;font-weight:700;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px}
    .choice-btn .em{font-size:32px;transition:transform .2s}
    .choice-btn:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
    .choice-btn.rock:hover{border-color:#ef4444;background:rgba(239,68,68,.1)}
    .choice-btn.paper:hover{border-color:#22c55e;background:rgba(34,197,94,.1)}
    .choice-btn.scissors:hover{border-color:#f97316;background:rgba(249,115,22,.1)}
    .choice-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .history-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;backdrop-filter:blur(8px);margin-top:20px}
    .history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .history-title{font-weight:700;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
    .clear-btn{padding:5px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;color:var(--red);cursor:pointer;font-size:11px;font-weight:700;transition:.2s}
    .clear-btn:hover{background:rgba(239,68,68,.2)}
    .history-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}
    .history-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:13px;background:rgba(0,0,0,.2);border:1px solid var(--border)}
    .h-res{font-weight:700;min-width:60px}
    .h-res.win{color:var(--green)}
    .h-res.lose{color:var(--red)}
    .h-res.draw{color:var(--accent)}
    .h-choices{flex:1;color:var(--muted)}
    .h-time{font-size:11px;color:rgba(148,163,184,.5)}
    .empty-hist{text-align:center;color:var(--muted);font-size:13px;padding:20px;opacity:.6}
    .kb-hint{text-align:center;font-size:11px;color:rgba(148,163,184,.4);margin-top:12px}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(56,189,248,.3);border-radius:3px}
    .toast-wrap{position:fixed;bottom:20px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
    .toast{background:var(--card);border:1px solid var(--border);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;animation:toastIn .3s ease;display:flex;align-items:center;gap:8px}
    .toast.win{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1);color:var(--green)}
    @keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
    @keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(20px)}}
    @media(max-width:480px){h1{font-size:1.6rem}.choice-display{width:70px;height:70px;font-size:32px}.choice-btn .em{font-size:26px}.choice-btn{padding:12px 6px;font-size:12px}}
  </style>
</head>
<body>
<div class="container">
  <a href="../index.html" class="back" onclick="window.close(); return false;">← Back to Portfolio</a>
  <h1>🎮 Rock Paper Scissors</h1>
  <p class="subtitle">Outsmart the AI — track your streak</p>

  <div class="scoreboard">
    <div class="score-card win-card"><div class="score-num green" id="winsNum">0</div><div class="score-label">🏆 Wins</div></div>
    <div class="score-card lose-card"><div class="score-num red" id="lossesNum">0</div><div class="score-label">💀 Losses</div></div>
    <div class="score-card draw-card"><div class="score-num blue" id="drawsNum">0</div><div class="score-label">🤝 Draws</div></div>
  </div>

  <div class="streak-bar">
    <span style="color:var(--muted);font-size:14px">🔥 Current streak: <span class="streak-count" id="streakNum">0</span></span>
    <span style="font-size:13px;color:var(--muted)">Best: <span class="best-num" id="bestNum">0</span></span>
  </div>

  <div class="arena">
    <div class="arena-vs">
      <div><div class="player-label">You</div><div class="choice-display" id="playerDisp">🤔</div></div>
      <div class="vs-badge">VS</div>
      <div><div class="player-label">AI</div><div class="choice-display" id="aiDisp">🤖</div></div>
    </div>
    <div class="countdown" id="countdown"></div>
    <div class="result-text" id="resultText">Choose your move below!</div>
  </div>

  <div class="choices">
    <button class="choice-btn rock" onclick="play(0)" id="b0"><span class="em">✊</span>Rock</button>
    <button class="choice-btn paper" onclick="play(1)" id="b1"><span class="em">✋</span>Paper</button>
    <button class="choice-btn scissors" onclick="play(2)" id="b2"><span class="em">✌️</span>Scissors</button>
  </div>
  <div class="kb-hint">Keyboard: R = Rock · P = Paper · S = Scissors</div>

  <div class="history-section">
    <div class="history-header">
      <div class="history-title">📋 Round History</div>
      <button class="clear-btn" onclick="clearAll()">Clear All</button>
    </div>
    <div class="history-list" id="histList"><div class="empty-hist">No rounds yet. Make your first move!</div></div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
const EMOJI = ['✊','✋','✌️'];
const NAMES = ['Rock','Paper','Scissors'];
const BEATS = [2,0,1];
let stats = {w:0,l:0,d:0,streak:0,best:0};
let hist = [];
let busy = false;
try { const s=JSON.parse(localStorage.getItem('rps2_stats')||'null'); if(s) stats=s; } catch(e){}
try { const h=JSON.parse(localStorage.getItem('rps2_hist')||'null'); if(h) hist=h; } catch(e){}

function save(){try{localStorage.setItem('rps2_stats',JSON.stringify(stats));localStorage.setItem('rps2_hist',JSON.stringify(hist.slice(0,50)));}catch(e){}}
function updateUI(){
  document.getElementById('winsNum').textContent=stats.w;
  document.getElementById('lossesNum').textContent=stats.l;
  document.getElementById('drawsNum').textContent=stats.d;
  document.getElementById('streakNum').textContent=stats.streak;
  document.getElementById('bestNum').textContent=stats.best;
  const list=document.getElementById('histList');
  if(!hist.length){list.innerHTML='<div class="empty-hist">No rounds yet. Make your first move!</div>';return;}
  list.innerHTML=hist.slice(0,20).map(h=>`<div class="history-item"><span class="h-res ${h.out}">${h.out==='win'?'🏆 Win':h.out==='lose'?'💀 Lose':'🤝 Draw'}</span><span class="h-choices">${EMOJI[h.p]} vs ${EMOJI[h.a]}</span><span class="h-time">${h.t}</span></div>`).join('');
}
function setDisabled(v){[0,1,2].forEach(i=>document.getElementById('b'+i).disabled=v);}
function toast(msg,cls){const w=document.getElementById('toastWrap');const t=document.createElement('div');t.className='toast '+(cls||'');t.textContent=msg;w.appendChild(t);setTimeout(()=>{t.style.animation='toastOut .3s ease forwards';setTimeout(()=>t.remove(),300)},2500);}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function play(u){
  if(busy)return;busy=true;setDisabled(true);
  const pd=document.getElementById('playerDisp'),ad=document.getElementById('aiDisp'),rt=document.getElementById('resultText'),cd=document.getElementById('countdown');
  pd.className='choice-display';ad.className='choice-display';rt.className='result-text';rt.textContent='';pd.textContent=EMOJI[u];
  for(const s of['3','2','1','✊✋✌️']){cd.textContent=s;cd.style.animation='countPulse .35s ease';cd.style.animation='';await sleep(350);}
  cd.textContent='';
  const a=Math.floor(Math.random()*3);
  ad.textContent=EMOJI[a];
  let out,label,cls;
  if(u===a){out='draw';label="🤝 It's a Draw!";cls='draw';stats.d++;stats.streak=0;}
  else if(BEATS[u]===a){out='win';label='🏆 You Win!';cls='win';stats.w++;stats.streak++;if(stats.streak>stats.best)stats.best=stats.streak;if(stats.streak>=3)toast('🔥 '+stats.streak+'-win streak!','win');}
  else{out='lose';label='💀 AI Wins!';cls='lose';stats.l++;stats.streak=0;}
  pd.classList.add(cls,'shake');ad.classList.add(cls,'shake');
  rt.className='result-text '+cls;rt.textContent=label;
  hist.unshift({p:u,a,out,t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
  save();updateUI();await sleep(700);setDisabled(false);busy=false;
}
function clearAll(){if(!confirm('Clear all scores and history?'))return;stats={w:0,l:0,d:0,streak:0,best:0};hist=[];save();updateUI();document.getElementById('playerDisp').textContent='🤔';document.getElementById('aiDisp').textContent='🤖';document.getElementById('resultText').textContent='Choose your move below!';document.getElementById('resultText').className='result-text';toast('Stats reset ✓');}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='r'||e.key==='R')play(0);if(e.key==='p'||e.key==='P')play(1);if(e.key==='s'||e.key==='S')play(2);});
function closeWindow(e){if(e)try{e.stopPropagation();}catch(x){}try{window.close();}catch(x){}try{if(window.opener){window.opener.postMessage({type:'requestClose',url:window.location.href},'*');setTimeout(()=>{window.location.href='../index.html';},300);return;}}catch(x){}window.location.href='../index.html';}
updateUI();
</script>
</body>
</html>
