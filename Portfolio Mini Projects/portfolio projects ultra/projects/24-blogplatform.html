<html lang="en">
<head><meta charset="UTF-8">
<meta name="description" content="Blog Platform — part of a professional web developer portfolio with 50+ projects.">

<title>Blog Platform</title><style>*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#020617 0%,#0f172a 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;min-height:100vh;padding:40px 20px;overflow-x:hidden}
.container{max-width:1000px;margin:0 auto}
h1{background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:36px;margin-bottom:8px}
.subtitle{color:#94a3b8;margin-bottom:28px;font-size:15px}
.back-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;color:#38bdf8;text-decoration:none;font-weight:600;font-size:14px;padding:8px 14px;border:1px solid rgba(56,189,248,.3);border-radius:8px;transition:.2s}
.back-link:hover{background:rgba(56,189,248,.1)}
.card{background:rgba(30,41,59,.8);backdrop-filter:blur(10px);padding:24px;border-radius:16px;border:1px solid rgba(56,189,248,.2);margin-bottom:20px}
.btn{padding:10px 22px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;transition:.2s;background:linear-gradient(90deg,#38bdf8,#22c55e);color:#000}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(56,189,248,.35)}
.btn-outline{background:transparent;border:1px solid rgba(56,189,248,.4);color:#38bdf8}
.btn-red{background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff}
input,textarea,select{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
input::placeholder,textarea::placeholder{color:#64748b}
label{display:block;font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.3)}
.badge-green{background:rgba(34,197,94,.15);color:#22c55e;border-color:rgba(34,197,94,.3)}
.badge-red{background:rgba(239,68,68,.15);color:#ef4444;border-color:rgba(239,68,68,.3)}
.badge-yellow{background:rgba(234,179,8,.15);color:#eab308;border-color:rgba(234,179,8,.3)}
.stat-box{background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.15);border-radius:12px;padding:20px;text-align:center}
.stat-num{font-size:32px;font-weight:800;background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:12px;color:#64748b;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
hr{border:none;border-top:1px solid rgba(56,189,248,.1);margin:20px 0}
@media(max-width:768px){body{padding:15px 12px}h1{font-size:26px}.grid2,.grid3,.grid4{grid-template-columns:1fr}.card{padding:16px 14px}}
.view{display:none}.view.active{display:block}
.post-card{background:rgba(30,41,59,.8);border:1px solid rgba(56,189,248,.2);border-radius:14px;padding:20px;margin-bottom:16px;cursor:pointer;transition:.2s}
.post-card:hover{border-color:rgba(56,189,248,.5);transform:translateY(-2px)}
.post-title{font-size:20px;font-weight:800;margin-bottom:6px;color:#f1f5f9}
.post-excerpt{color:#94a3b8;font-size:14px;line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:#64748b;flex-wrap:wrap}
.post-cover{font-size:48px;text-align:center;padding:20px;background:rgba(56,189,248,.06);border-radius:10px;margin-bottom:14px}
.editor-toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:rgba(56,189,248,.06);border-radius:8px 8px 0 0;border:1px solid rgba(56,189,248,.2);border-bottom:none}
.tb-btn{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2);color:#38bdf8;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:700;transition:.2s}
.tb-btn:hover{background:rgba(56,189,248,.25)}
.tag-item{background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.3);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.tag-item:hover{background:rgba(239,68,68,.2);color:#ef4444;border-color:rgba(239,68,68,.3)}
.full-post{line-height:1.9;font-size:16px;color:#cbd5e1}
.full-post h2{font-size:22px;font-weight:800;color:#38bdf8;margin:20px 0 10px}
.full-post p{margin-bottom:14px}
.like-btn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444;padding:8px 18px;border-radius:8px;cursor:pointer;font-weight:700;transition:.2s}
.like-btn:hover{background:rgba(239,68,68,.2)}
.comment-item{padding:12px;border-radius:10px;background:rgba(56,189,248,.05);border:1px solid rgba(56,189,248,.1);margin-bottom:8px}
/* ── UNIVERSAL UPGRADE: Theme, Animations, Toast ── */
:root{
  --bg:#020617;--bg2:#0f172a;--card:rgba(30,41,59,.85);--border:rgba(56,189,248,.22);
  --accent:#38bdf8;--accent2:#22c55e;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;
}


/* Toast notifications */
.u-toast-container{position:fixed;bottom:24px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.u-toast{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  animation:uToastIn .3s ease;display:flex;align-items:center;gap:8px;
}
.u-toast.success{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.u-toast.error{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.u-toast.info{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
@keyframes uToastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes uToastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* Entrance animations */
@keyframes uFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes uFadeIn{from{opacity:0}to{opacity:1}}
@keyframes uPulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.4)}70%{box-shadow:0 0 0 8px rgba(56,189,248,0)}}
.u-fade-up{animation:uFadeUp .45s ease both}
.u-fade-in{animation:uFadeIn .4s ease both}
.u-pulse{animation:uPulse 2s infinite}

/* Button hover lift */
.btn:hover,[class*="btn"]:not([class*="btn-"]):hover{transform:translateY(-2px)!important}

/* Smooth card hover */
.card:hover,[class*="card"]:hover{
  border-color:var(--accent)!important;
  box-shadow:0 6px 28px rgba(56,189,248,.12)!important;
  transition:all .25s ease!important;
}

/* Loading skeleton */
.u-skeleton{
  background:linear-gradient(90deg,rgba(56,189,248,.06) 25%,rgba(56,189,248,.12) 50%,rgba(56,189,248,.06) 75%);
  background-size:200% 100%;animation:uSkeleton 1.4s infinite;border-radius:6px;
}
@keyframes uSkeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Progress bar component */
.u-progress{height:5px;background:rgba(56,189,248,.12);border-radius:3px;overflow:hidden;margin:8px 0}
.u-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s ease}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.55)}

/* Mobile responsive upgrades */
@media(max-width:600px){
  
  .u-toast-container{right:10px;bottom:80px;max-width:calc(100vw - 20px)}
}

<body><div class="container">
<a href="../index.html" class="back-link" onclick="window.close(); return false;">← Back to Portfolio</a>

<h1>✍️ Blog Studio</h1>
<p class="subtitle">Write, publish and manage blog posts with rich editor</p>
<div id="app"></div>
</div><script>
let posts=[],tags=new Set(['Tech','Life','Dev','Design','Career']),activeView='list',viewPost=null;

function renderApp(){
  document.getElementById('app').innerHTML=`
    <div id="listView" class="view ${activeView==='list'?'active':''}">
      <div class="flex" style="justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
        <div class="flex" style="gap:8px">
          ${[...tags].map(t=>`<span class="tag-item" onclick="filterByTag('${t}')">${t}</span>`).join('')}
        </div>
        <button class="btn" onclick="setView('editor')">+ New Post</button>
      </div>
      <input id="blogSearch" placeholder="Search posts..." oninput="renderApp()" style="margin-bottom:20px">
      <div id="postList"></div>
    </div>
    <div id="editorView" class="view ${activeView==='editor'?'active':''}">
      <div class="flex" style="justify-content:space-between;margin-bottom:16px">
        <h2 style="color:#38bdf8">${editingPost?'Edit Post':'New Post'}</h2>
        <button class="btn btn-outline" onclick="setView('list')">← Back</button>
      </div>
      <div class="card">
        <div class="grid2" style="margin-bottom:12px">
          <div><label>Cover Emoji</label>
            <select id="postEmoji" style="font-size:20px">
              <option>✍️</option><option>💡</option><option>🚀</option><option>🎨</option>
              <option>💻</option><option>🌍</option><option>🔥</option><option>📱</option>
            </select>
          </div>
          <div><label>Category</label>
            <select id="postTag">${[...tags].map(t=>`<option>${t}</option>`).join('')}</select>
          </div>
        </div>
        <input id="postTitle" placeholder="Post title..." style="font-size:20px;font-weight:700;margin-bottom:12px">
        <input id="postSubtitle" placeholder="Short description..." style="margin-bottom:12px">
        <div class="editor-toolbar">
          <button class="tb-btn" onclick="ins('## Heading\n')">H2</button>
          <button class="tb-btn" onclick="ins('**bold**')">Bold</button>
          <button class="tb-btn" onclick="ins('*italic*')">Italic</button>
          <button class="tb-btn" onclick="ins('\n- Item\n')">List</button>
          <button class="tb-btn" onclick="ins('\n> Quote\n')">Quote</button>
          <button class="tb-btn" onclick="ins('\n---\n')">HR</button>
        </div>
        <textarea id="postBody" rows="14" placeholder="Write your post content here..." style="border-radius:0 0 8px 8px;border-top:none;resize:vertical"></textarea>
        <div class="flex" style="margin-top:14px;gap:10px">
          <button class="btn" onclick="publishPost()" style="flex:1">${editingPost?'Update Post':'Publish Post'}</button>
          ${editingPost?'<button class="btn btn-red" onclick="deletePost()" style="flex:1">Delete</button>':''}
        </div>
      </div>
    </div>
    <div id="readView" class="view ${activeView==='read'?'active':''}">
      ${viewPost?`
      <button class="btn btn-outline" onclick="setView('list')" style="margin-bottom:16px">← Back to Blog</button>
      <div class="post-cover">${viewPost.emoji}</div>
      <span class="badge badge-green" style="margin-bottom:10px;display:inline-block">${viewPost.tag}</span>
      <h2 style="font-size:28px;font-weight:800;margin-bottom:8px;line-height:1.3">${viewPost.title}</h2>
      <div class="post-meta" style="margin-bottom:20px">
        <span>📅 ${viewPost.date}</span><span>👁 ${viewPost.views} views</span><span>❤️ ${viewPost.likes} likes</span><span>⏱ ${Math.ceil(viewPost.body.length/1000)} min read</span>
      </div>
      <div class="full-post card">${renderMD(viewPost.body)}</div>
      <div class="card">
        <div class="flex" style="gap:12px;margin-bottom:16px">
          <button class="like-btn" onclick="likePost(${viewPost.id})">❤️ Like (${viewPost.likes})</button>
          <button class="btn btn-outline" onclick="editPost(${viewPost.id})">✏️ Edit</button>
        </div>
        <h3 style="color:#38bdf8;margin-bottom:12px">Comments (${viewPost.comments.length})</h3>
        <div id="commentList">${viewPost.comments.map(c=>`<div class="comment-item"><strong style="color:#38bdf8">${c.author}</strong> <span style="font-size:11px;color:#64748b">· ${c.date}</span><p style="margin-top:6px;font-size:14px;color:#cbd5e1">${c.text}</p></div>`).join('')}</div>
        <div class="flex" style="gap:10px;margin-top:12px">
          <input id="commentAuthor" placeholder="Your name" style="flex:1">
          <input id="commentText" placeholder="Add a comment..." style="flex:2">
          <button class="btn" onclick="addComment()" style="flex-shrink:0">Post</button>
        </div>
      </div>`:''}
    </div>`;
  if(activeView==='list')renderPostList();
}

let editingPost=null,filterTag=null;
function renderPostList(){
  const q=(document.getElementById('blogSearch')||{}).value?.toLowerCase()||'';
  let list=posts.filter(p=>(!q||p.title.toLowerCase().includes(q)||p.body.toLowerCase().includes(q))&&(!filterTag||p.tag===filterTag));
  list=[...list].reverse();
  document.getElementById('postList').innerHTML=list.length
    ?list.map(p=>`<div class="post-card" onclick="readPost(${p.id})">
      <div class="flex" style="justify-content:space-between;margin-bottom:8px">
        <span style="font-size:28px">${p.emoji}</span>
        <span class="badge badge-green">${p.tag}</span>
      </div>
      <div class="post-title">${p.title}</div>
      <div class="post-excerpt">${p.subtitle||p.body.replace(/[#*>-]/g,'').substring(0,150)+'...'}</div>
      <div class="post-meta"><span>📅 ${p.date}</span><span>👁 ${p.views}</span><span>❤️ ${p.likes}</span><span>⏱ ${Math.ceil(p.body.length/1000)} min read</span></div>
    </div>`).join('')
    :'<p style="color:#64748b;text-align:center;padding:40px">No posts yet. Write one!</p>';
}
function renderMD(md){
  return md.replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h2>$1</h2>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/^> (.+)$/gm,'<blockquote style="border-left:3px solid #38bdf8;padding-left:12px;color:#94a3b8;margin:10px 0;font-style:italic">$1</blockquote>').replace(/^---$/gm,'<hr>').replace(/^- (.+)$/gm,'<li style="margin-left:16px;margin-bottom:4px">$1</li>').replace(/\n/g,'<br>');
}
function setView(v){activeView=v;editingPost=null;renderApp();}
function readPost(id){const p=posts.find(p=>p.id===id);if(!p)return;p.views++;viewPost=p;activeView='read';renderApp();}
function editPost(id){const p=posts.find(p=>p.id===id);if(!p)return;editingPost=p;activeView='editor';renderApp();setTimeout(()=>{document.getElementById('postTitle').value=p.title;document.getElementById('postSubtitle').value=p.subtitle;document.getElementById('postBody').value=p.body;document.getElementById('postEmoji').value=p.emoji;document.getElementById('postTag').value=p.tag;},50);}
function publishPost(){
  const title=document.getElementById('postTitle').value.trim();
  const body=document.getElementById('postBody').value.trim();
  if(!title||!body)return;
  const data={id:Date.now(),title,subtitle:document.getElementById('postSubtitle').value,body,emoji:document.getElementById('postEmoji').value,tag:document.getElementById('postTag').value,date:new Date().toLocaleDateString(),views:0,likes:0,comments:[]};
  if(editingPost){Object.assign(editingPost,data,{id:editingPost.id});}else{posts.push(data);}
  setView('list');
}
function deletePost(){if(editingPost){posts=posts.filter(p=>p.id!==editingPost.id);setView('list');}}
function likePost(id){const p=posts.find(p=>p.id===id);if(p){p.likes++;viewPost=p;renderApp();}}
function addComment(){
  const author=document.getElementById('commentAuthor').value.trim()||'Anonymous';
  const text=document.getElementById('commentText').value.trim();
  if(!text||!viewPost)return;
  viewPost.comments.push({author,text,date:new Date().toLocaleDateString()});
  renderApp();
}
function ins(text){const ta=document.getElementById('postBody');if(!ta)return;const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+text+ta.value.slice(ta.selectionEnd);ta.focus();ta.selectionStart=ta.selectionEnd=s+text.length;}
function filterByTag(t){filterTag=filterTag===t?null:t;renderApp();}

// ── UNIVERSAL UPGRADE: Theme, localStorage, Toast, Animations ──
(function(){
'use strict';

// ── 2. TOAST SYSTEM ──────────────────────────────────────────────
var toastContainer = null;
function getToastContainer(){
  if(!toastContainer || !document.body.contains(toastContainer)){
    toastContainer = document.createElement('div');
    toastContainer.className = 'u-toast-container';
    document.body.appendChild(toastContainer);
  }
  return toastContainer;
}

window.uToast = function(msg, type, duration){
  type = type || 'info';
  duration = duration || 2800;
  var icons = {success:'✅', error:'❌', info:'💡', warning:'⚠️'};
  var c = getToastContainer();
  var t = document.createElement('div');
  t.className = 'u-toast ' + type;
  t.innerHTML = '<span>' + (icons[type]||'💡') + '</span><span>' + msg + '</span>';
  c.appendChild(t);
  setTimeout(function(){
    t.style.animation = 'uToastOut .3s ease forwards';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration);
};

// ── 3. LOCALSTORAGE HELPERS ──────────────────────────────────────
var APP_KEY = 'uapp_' + location.pathname.split('/').pop().replace('.html','');
window.uSave = function(key, val){
  try { localStorage.setItem(APP_KEY + '_' + key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
};
window.uLoad = function(key, def){
  try {
    var v = localStorage.getItem(APP_KEY + '_' + key);
    return v !== null ? JSON.parse(v) : def;
  } catch(e){ return def; }
};
window.uClear = function(key){
  try { localStorage.removeItem(APP_KEY + '_' + key); } catch(e){}
};

// ── 4. ENTRANCE ANIMATIONS ───────────────────────────────────────
function animateEntrance(){
  var cards = document.querySelectorAll('.card, [class*="card"]');
  cards.forEach(function(el, i){
    el.style.opacity = '0';
    el.style.transform = 'translateY(18px)';
    setTimeout(function(){
      el.style.transition = 'opacity .4s ease, transform .4s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, i * 60);
  });
}

// ── 5. SMOOTH COUNTER ANIMATION ──────────────────────────────────
window.uAnimCount = function(el, target, duration, prefix, suffix){
  prefix = prefix || '';
  suffix = suffix || '';
  duration = duration || 1200;
  var start = 0;
  var step = target / (duration / 16);
  var iv = setInterval(function(){
    start = Math.min(start + step, target);
    el.textContent = prefix + Math.round(start).toLocaleString() + suffix;
    if(start >= target) clearInterval(iv);
  }, 16);
};

// ── 6. EXPORT HELPER ─────────────────────────────────────────────
window.uExportJSON = function(data, filename){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.json';
  a.click();
  uToast('Data exported!', 'success');
};
window.uExportCSV = function(rows, filename){
  var csv = rows.map(function(r){ return r.join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.csv';
  a.click();
  uToast('CSV exported!', 'success');
};

// ── 8. INIT ──────────────────────────────────────────────────────
function init(){
  setTimeout(animateEntrance, 100);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
<script>
(function(){
  // Persist posts
  setTimeout(function(){
    var saved = uLoad('blog_posts', null);
    if(saved && saved.length && window.posts && !window.posts.length){
      window.posts = saved;
      if(window.renderApp) renderApp();
      uToast(saved.length + ' posts restored 📝', 'success', 1500);
    }
    var origPublish = window.publishPost;
    if(origPublish){
      window.publishPost = function(){
        origPublish.apply(this,arguments);
        setTimeout(function(){ if(window.posts) uSave('blog_posts', window.posts); }, 200);
      };
    }
  }, 400);
  
  // Social share
  window.sharePost = function(title){
    var text = 'Check out this post: ' + title;
    if(navigator.share){ navigator.share({title:title, text:text, url:location.href}).catch(function(){}); }
    else{ navigator.clipboard?.writeText(text + ' ' + location.href); uToast('Link copied! 🔗', 'success'); }
  };
  
  // Reading progress bar at top
  if(!document.getElementById('uReadProgress')){
    var bar = document.createElement('div');
    bar.id = 'uReadProgress';
    bar.style.cssText = 'position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#38bdf8,#22c55e);width:0%;z-index:9999;transition:width .1s';
    document.body.appendChild(bar);
    window.addEventListener('scroll', function(){
      var h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (h > 0 ? (window.scrollY / h * 100) : 0) + '%';
    });
  }
})();
</script>
</body></html>
