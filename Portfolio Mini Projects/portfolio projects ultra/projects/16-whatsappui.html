<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="description" content="WhatsApp UI — part of a professional web developer portfolio with 50+ projects.">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WhatsApp UI</title><style>*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#020617 0%,#0f172a 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;min-height:100vh;padding:40px 20px;overflow-x:hidden}
.container{max-width:1000px;margin:0 auto}
a{color:#38bdf8;text-decoration:none;font-weight:600}a:hover{color:#4ade80}
h1{background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:36px;margin-bottom:8px}
.subtitle{color:#94a3b8;margin-bottom:28px;font-size:15px}
.back-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;color:#38bdf8;text-decoration:none;font-weight:600;font-size:14px;padding:8px 14px;border:1px solid rgba(56,189,248,.3);border-radius:8px;transition:.2s}
.back-link:hover{background:rgba(56,189,248,.1)}
.card{background:rgba(30,41,59,.8);backdrop-filter:blur(10px);padding:24px;border-radius:16px;border:1px solid rgba(56,189,248,.2);margin-bottom:20px}
.btn{padding:10px 22px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;transition:.2s;background:linear-gradient(90deg,#38bdf8,#22c55e);color:#000}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(56,189,248,.35)}
.btn-outline{background:transparent;border:1px solid rgba(56,189,248,.4);color:#38bdf8}
.btn-red{background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff}
input,textarea,select{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
input::placeholder,textarea::placeholder{color:#64748b}
label{display:block;font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.3)}
.badge-green{background:rgba(34,197,94,.15);color:#22c55e;border-color:rgba(34,197,94,.3)}
.badge-red{background:rgba(239,68,68,.15);color:#ef4444;border-color:rgba(239,68,68,.3)}
.badge-yellow{background:rgba(234,179,8,.15);color:#eab308;border-color:rgba(234,179,8,.3)}
.stat-box{background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.15);border-radius:12px;padding:20px;text-align:center}
.stat-num{font-size:32px;font-weight:800;background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:12px;color:#64748b;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
hr{border:none;border-top:1px solid rgba(56,189,248,.1);margin:20px 0}
@media(max-width:768px){body{padding:15px 12px}h1{font-size:26px}.grid2,.grid3,.grid4{grid-template-columns:1fr}.card{padding:16px 14px}}
.contact-item{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;transition:.15s;border-bottom:1px solid rgba(56,189,248,.05)}
.contact-item:hover,.contact-item.active{background:rgba(56,189,248,.08)}
.c-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.c-name{font-weight:600;font-size:14px}
.c-preview{font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.c-time{font-size:10px;color:#64748b;margin-left:auto;flex-shrink:0}
.unread-badge{background:#22c55e;color:#000;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msg-bubble{max-width:70%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;position:relative;word-break:break-word}
.msg-out{background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(34,197,94,.2));border-bottom-right-radius:4px;align-self:flex-end}
.msg-in{background:rgba(30,41,59,.9);border:1px solid rgba(56,189,248,.15);border-bottom-left-radius:4px;align-self:flex-start}
.msg-time{font-size:10px;color:#64748b;margin-top:4px;text-align:right}
.msg-wrap-out{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end}
.msg-wrap-in{align-self:flex-start;display:flex;flex-direction:column;align-items:flex-start}
.typing{color:#22c55e;font-size:12px;font-style:italic;padding:4px 0}
@media(max-width:768px){[style*="grid-template-columns:300px"]{grid-template-columns:1fr!important;height:auto!important}[style*="border-right:1px"]{border-right:none!important;border-bottom:1px solid rgba(56,189,248,.1)!important;max-height:200px}}
/* ── UNIVERSAL UPGRADE: Theme, Animations, Toast ── */
:root{
  --bg:#020617;--bg2:#0f172a;--card:rgba(30,41,59,.85);--border:rgba(56,189,248,.22);
  --accent:#38bdf8;--accent2:#22c55e;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;
}


/* Toast notifications */
.u-toast-container{position:fixed;bottom:24px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.u-toast{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  animation:uToastIn .3s ease;display:flex;align-items:center;gap:8px;
}
.u-toast.success{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.u-toast.error{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.u-toast.info{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
@keyframes uToastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes uToastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* Entrance animations */
@keyframes uFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes uFadeIn{from{opacity:0}to{opacity:1}}
@keyframes uPulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.4)}70%{box-shadow:0 0 0 8px rgba(56,189,248,0)}}
.u-fade-up{animation:uFadeUp .45s ease both}
.u-fade-in{animation:uFadeIn .4s ease both}
.u-pulse{animation:uPulse 2s infinite}

/* Button hover lift */
.btn:hover,[class*="btn"]:not([class*="btn-"]):hover{transform:translateY(-2px)!important}

/* Smooth card hover */
.card:hover,[class*="card"]:hover{
  border-color:var(--accent)!important;
  box-shadow:0 6px 28px rgba(56,189,248,.12)!important;
  transition:all .25s ease!important;
}

/* Loading skeleton */
.u-skeleton{
  background:linear-gradient(90deg,rgba(56,189,248,.06) 25%,rgba(56,189,248,.12) 50%,rgba(56,189,248,.06) 75%);
  background-size:200% 100%;animation:uSkeleton 1.4s infinite;border-radius:6px;
}
@keyframes uSkeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Progress bar component */
.u-progress{height:5px;background:rgba(56,189,248,.12);border-radius:3px;overflow:hidden;margin:8px 0}
.u-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s ease}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.55)}

/* Mobile responsive upgrades */
@media(max-width:600px){
  
  .u-toast-container{right:10px;bottom:80px;max-width:calc(100vw - 20px)}
}

</style></head>
<body><div class="container">
<a href="../index.html" class="back-link" onclick="window.close(); return false;">← Back to Portfolio</a>

<h1>💬 Chat Messenger</h1>
<p class="subtitle">WhatsApp-style real-time messaging interface</p>
<div style="display:grid;grid-template-columns:300px 1fr;gap:0;background:rgba(15,23,42,.9);border-radius:16px;border:1px solid rgba(56,189,248,.2);overflow:hidden;height:600px">
  <div style="border-right:1px solid rgba(56,189,248,.1);display:flex;flex-direction:column">
    <div style="padding:16px;border-bottom:1px solid rgba(56,189,248,.1)">
      <div style="font-weight:700;font-size:16px;margin-bottom:10px;color:#38bdf8">💬 Messages</div>
      <input id="searchContact" placeholder="Search contacts..." oninput="filterContacts()" style="font-size:13px;padding:8px 12px">
    </div>
    <div id="contactList" style="overflow-y:auto;flex:1"></div>
  </div>
  <div style="display:flex;flex-direction:column">
    <div id="chatHeader" style="padding:14px 18px;border-bottom:1px solid rgba(56,189,248,.1);display:flex;align-items:center;gap:12px">
      <div id="chatAvatar" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#22c55e);display:flex;align-items:center;justify-content:center;font-size:18px">💬</div>
      <div><div id="chatName" style="font-weight:700">Select a contact</div><div id="chatStatus" style="font-size:12px;color:#22c55e"></div></div>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn btn-outline" style="padding:6px 12px;font-size:12px" onclick="clearChat()">🗑</button>
      </div>
    </div>
    <div id="msgArea" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px">
      <div style="text-align:center;color:#64748b;font-size:14px;margin:auto">Select a contact to start chatting</div>
    </div>
    <div id="inputArea" style="padding:12px 16px;border-top:1px solid rgba(56,189,248,.1);display:flex;gap:8px;align-items:center">
      <button class="btn btn-outline" style="padding:8px 12px;font-size:18px;flex-shrink:0" onclick="insertEmoji()">😊</button>
      <input id="msgInput" placeholder="Type a message..." style="flex:1" onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="btn" style="padding:8px 16px;flex-shrink:0" onclick="sendMsg()">Send ➤</button>
    </div>
  </div>
</div>
</div><script>
const contacts=[
  {id:1,name:'Alice Johnson',avatar:'👩‍💼',color:'#38bdf8',status:'online',msgs:[{out:false,text:'Hey! How are you doing?',time:'10:23 AM'},{out:true,text:'I\'m great, thanks! Working on a new project 🚀',time:'10:24 AM'},{out:false,text:'That sounds exciting! What kind of project?',time:'10:25 AM'}],unread:2},
  {id:2,name:'Bob Smith',avatar:'👨‍💻',color:'#22c55e',status:'online',msgs:[{out:false,text:'Did you check the latest code review?',time:'9:45 AM'},{out:true,text:'Yes, left some comments. Looks good overall!',time:'9:50 AM'}],unread:0},
  {id:3,name:'Carol White',avatar:'👩‍🎨',color:'#a855f7',status:'last seen 2h ago',msgs:[{out:false,text:'Can you send me the design files?',time:'Yesterday'}],unread:1},
  {id:4,name:'Dev Team',avatar:'👥',color:'#f59e0b',status:'4 members',msgs:[{out:false,text:'Sprint planning at 3PM today',time:'8:00 AM'},{out:true,text:'I\'ll be there!',time:'8:05 AM'},{out:false,text:'Great, see you all then 👍',time:'8:10 AM'}],unread:3},
  {id:5,name:'Support Bot',avatar:'🤖',color:'#64748b',status:'automated',msgs:[{out:true,text:'Hello, I need help with my account',time:'Yesterday'},{out:false,text:'Hi! I\'m here to help. What\'s the issue?',time:'Yesterday'}],unread:0},
];

const emojis=['😊','👍','❤️','🔥','😂','🎉','👏','🙏','💯','✅'];
let emojiIdx=0,activeCon=null,typing=null;

function filterContacts(){
  const q=document.getElementById('searchContact').value.toLowerCase();
  renderContacts(contacts.filter(c=>c.name.toLowerCase().includes(q)));
}

function renderContacts(list=contacts){
  document.getElementById('contactList').innerHTML=list.map(c=>`
    <div class="contact-item ${activeCon===c.id?'active':''}" onclick="openChat(${c.id})">
      <div class="c-avatar" style="background:linear-gradient(135deg,${c.color}33,${c.color}11);border:2px solid ${c.color}44">${c.avatar}</div>
      <div style="flex:1;min-width:0">
        <div class="flex" style="gap:4px;flex-wrap:nowrap">
          <span class="c-name">${c.name}</span>
          <span class="c-time">${c.msgs.length?c.msgs[c.msgs.length-1].time:''}</span>
        </div>
        <div class="flex" style="gap:4px;flex-wrap:nowrap">
          <span class="c-preview">${c.msgs.length?c.msgs[c.msgs.length-1].text:''}</span>
          ${c.unread?`<span class="unread-badge">${c.unread}</span>`:''}
        </div>
      </div>
    </div>`).join('');
}

function openChat(id){
  activeCon=id;
  const c=contacts.find(c=>c.id===id);
  c.unread=0;
  document.getElementById('chatAvatar').textContent=c.avatar;
  document.getElementById('chatName').textContent=c.name;
  document.getElementById('chatStatus').textContent=c.status;
  renderMessages(c);
  renderContacts();
  document.getElementById('msgInput').focus();
  simulateTyping(c);
}

function renderMessages(c){
  document.getElementById('msgArea').innerHTML=c.msgs.map(m=>`
    <div class="msg-wrap-${m.out?'out':'in'}">
      <div class="msg-bubble msg-${m.out?'out':'in'}">${m.text}</div>
      <div class="msg-time">${m.time} ${m.out?'✓✓':''}</div>
    </div>`).join('');
  const area=document.getElementById('msgArea');
  area.scrollTop=area.scrollHeight;
}

function sendMsg(){
  if(!activeCon)return;
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text)return;
  const c=contacts.find(c=>c.id===activeCon);
  const now=new Date();
  const time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  c.msgs.push({out:true,text,time});
  input.value='';
  renderMessages(c);renderContacts();
  // Auto-reply
  setTimeout(()=>{
    const replies=['Got it! 👍','Sounds good!','Interesting 🤔','Sure, let me check','Thanks for letting me know!','On it! 🚀','Will do!','Makes sense 💡'];
    c.msgs.push({out:false,text:replies[Math.floor(Math.random()*replies.length)],time});
    renderMessages(c);renderContacts();
  },1200+Math.random()*1800);
}

function clearChat(){if(!activeCon)return;const c=contacts.find(c=>c.id===activeCon);c.msgs=[];renderMessages(c);}
function insertEmoji(){const input=document.getElementById('msgInput');input.value+=emojis[emojiIdx++%emojis.length];input.focus();}
function simulateTyping(c){if(typing)clearTimeout(typing);if(Math.random()>.5){document.getElementById('chatStatus').textContent='typing...';typing=setTimeout(()=>{document.getElementById('chatStatus').textContent=c.status;},2000);}}

renderContacts();
</script><script>
// ── UNIVERSAL UPGRADE: Theme, localStorage, Toast, Animations ──
(function(){
'use strict';

// ── 2. TOAST SYSTEM ──────────────────────────────────────────────
var toastContainer = null;
function getToastContainer(){
  if(!toastContainer || !document.body.contains(toastContainer)){
    toastContainer = document.createElement('div');
    toastContainer.className = 'u-toast-container';
    document.body.appendChild(toastContainer);
  }
  return toastContainer;
}

window.uToast = function(msg, type, duration){
  type = type || 'info';
  duration = duration || 2800;
  var icons = {success:'✅', error:'❌', info:'💡', warning:'⚠️'};
  var c = getToastContainer();
  var t = document.createElement('div');
  t.className = 'u-toast ' + type;
  t.innerHTML = '<span>' + (icons[type]||'💡') + '</span><span>' + msg + '</span>';
  c.appendChild(t);
  setTimeout(function(){
    t.style.animation = 'uToastOut .3s ease forwards';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration);
};

// ── 3. LOCALSTORAGE HELPERS ──────────────────────────────────────
var APP_KEY = 'uapp_' + location.pathname.split('/').pop().replace('.html','');
window.uSave = function(key, val){
  try { localStorage.setItem(APP_KEY + '_' + key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
};
window.uLoad = function(key, def){
  try {
    var v = localStorage.getItem(APP_KEY + '_' + key);
    return v !== null ? JSON.parse(v) : def;
  } catch(e){ return def; }
};
window.uClear = function(key){
  try { localStorage.removeItem(APP_KEY + '_' + key); } catch(e){}
};

// ── 4. ENTRANCE ANIMATIONS ───────────────────────────────────────
function animateEntrance(){
  var cards = document.querySelectorAll('.card, [class*="card"]');
  cards.forEach(function(el, i){
    el.style.opacity = '0';
    el.style.transform = 'translateY(18px)';
    setTimeout(function(){
      el.style.transition = 'opacity .4s ease, transform .4s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, i * 60);
  });
}

// ── 5. SMOOTH COUNTER ANIMATION ──────────────────────────────────
window.uAnimCount = function(el, target, duration, prefix, suffix){
  prefix = prefix || '';
  suffix = suffix || '';
  duration = duration || 1200;
  var start = 0;
  var step = target / (duration / 16);
  var iv = setInterval(function(){
    start = Math.min(start + step, target);
    el.textContent = prefix + Math.round(start).toLocaleString() + suffix;
    if(start >= target) clearInterval(iv);
  }, 16);
};

// ── 6. EXPORT HELPER ─────────────────────────────────────────────
window.uExportJSON = function(data, filename){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.json';
  a.click();
  uToast('Data exported!', 'success');
};
window.uExportCSV = function(rows, filename){
  var csv = rows.map(function(r){ return r.join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.csv';
  a.click();
  uToast('CSV exported!', 'success');
};

// ── 8. INIT ──────────────────────────────────────────────────────
function init(){
  setTimeout(animateEntrance, 100);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
<script>
(function(){
  var storedChats = uLoad('wa_chats', null);
  var reactions = ['❤️','😂','👍','😮','😢','🙏'];
  
  // Save chats on send
  var origSend = window.sendMsg;
  if(origSend){
    window.sendMsg = function(){
      origSend.apply(this,arguments);
      setTimeout(function(){
        if(window.contacts) uSave('wa_chats', window.contacts.map(function(c){return {id:c.id,msgs:c.msgs.slice(-30)};}));
      }, 150);
    };
  }
  
  // Restore chats
  if(storedChats && window.contacts){
    storedChats.forEach(function(sc){
      var con = window.contacts.find(function(c){return c.id===sc.id;});
      if(con && sc.msgs.length > con.msgs.length) con.msgs = sc.msgs;
    });
    if(window.renderContacts) window.renderContacts();
  }
  
  // Add reaction menu to messages on right-click
  document.addEventListener('contextmenu', function(e){
    var bubble = e.target.closest('.msg-bubble');
    if(!bubble) return;
    e.preventDefault();
    var existing = document.getElementById('uReactionMenu');
    if(existing) existing.remove();
    var menu = document.createElement('div');
    menu.id = 'uReactionMenu';
    menu.style.cssText = 'position:fixed;left:'+e.clientX+'px;top:'+e.clientY+'px;background:rgba(15,23,42,.97);border:1px solid rgba(56,189,248,.3);border-radius:12px;padding:8px;display:flex;gap:6px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.4)';
    menu.innerHTML = reactions.map(function(r){
      return '<button onclick="var el=this.closest(\'.msg-bubble\');if(el){var rEl=el.querySelector(\'.u-react\');if(!rEl){rEl=document.createElement(\'span\');rEl.className=\'u-react\';rEl.style.cssText=\'font-size:12px;margin-left:6px;animation:uFadeIn .3s\';el.appendChild(rEl);}rEl.textContent=\''+r+'\';} document.getElementById(\'uReactionMenu\').remove();" style="background:none;border:none;font-size:20px;cursor:pointer;padding:4px;border-radius:8px;transition:.15s" onmouseover="this.style.background=\'rgba(56,189,248,.15)\'" onmouseout="this.style.background=\'none\'">'+r+'</button>';
    }).join('');
    document.body.appendChild(menu);
    setTimeout(function(){var m=document.getElementById('uReactionMenu');if(m)m.remove();}, 4000);
  });
  document.addEventListener('click', function(){var m=document.getElementById('uReactionMenu');if(m)m.remove();});
  
  uToast('Right-click messages for reactions 😄', 'info', 2500);
})();
</script>
</body></html>
