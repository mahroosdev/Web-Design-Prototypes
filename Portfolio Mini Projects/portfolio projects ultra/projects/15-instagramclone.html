<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="description" content="Instagram Clone — part of a professional web developer portfolio with 50+ projects.">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Instagram Clone</title>
<style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(135deg,#020617 0%,#0f172a 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;min-height:100vh;padding:40px 20px;overflow-x:hidden}
        .container{max-width:1000px;margin:0 auto}
        a{color:#38bdf8;text-decoration:none;font-weight:600}a:hover{color:#4ade80}
        h1{background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:36px;margin-bottom:8px}
        .subtitle{color:#94a3b8;margin-bottom:28px;font-size:15px}
        .back-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;color:#38bdf8;text-decoration:none;font-weight:600;font-size:14px;padding:8px 14px;border:1px solid rgba(56,189,248,.3);border-radius:8px;transition:.2s}
        .back-link:hover{background:rgba(56,189,248,.1)}
        .card{background:rgba(30,41,59,.8);backdrop-filter:blur(10px);padding:24px;border-radius:16px;border:1px solid rgba(56,189,248,.2);margin-bottom:20px}
        .btn{padding:10px 22px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;transition:.2s;background:linear-gradient(90deg,#38bdf8,#22c55e);color:#000}
        .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(56,189,248,.35)}
        .btn-outline{background:transparent;border:1px solid rgba(56,189,248,.4);color:#38bdf8}
        .btn-red{background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff}
        input,textarea,select{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:.2s}
        input:focus,textarea:focus,select:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
        input::placeholder,textarea::placeholder{color:#64748b}
        label{display:block;font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
        .flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.3)}
        .badge-green{background:rgba(34,197,94,.15);color:#22c55e;border-color:rgba(34,197,94,.3)}
        .badge-red{background:rgba(239,68,68,.15);color:#ef4444;border-color:rgba(239,68,68,.3)}
        .badge-yellow{background:rgba(234,179,8,.15);color:#eab308;border-color:rgba(234,179,8,.3)}
        .stat-box{background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.15);border-radius:12px;padding:20px;text-align:center}
        .stat-num{font-size:32px;font-weight:800;background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .stat-label{font-size:12px;color:#64748b;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
        hr{border:none;border-top:1px solid rgba(56,189,248,.1);margin:20px 0}
        @media(max-width:768px){body{padding:15px 12px}h1{font-size:26px}.grid2,.grid3{grid-template-columns:1fr}.card{padding:16px 14px}}

.post-card{background:rgba(30,41,59,.8);border:1px solid rgba(56,189,248,.2);border-radius:16px;margin-bottom:16px;overflow:hidden}
.post-header{display:flex;align-items:center;gap:10px;padding:14px}
.post-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#22c55e);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.post-img{width:100%;aspect-ratio:1;background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(34,197,94,.1));display:flex;align-items:center;justify-content:center;font-size:80px;cursor:pointer}
.post-actions{padding:12px 14px;display:flex;gap:16px;align-items:center}
.post-action{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:18px;transition:.2s;display:flex;align-items:center;gap:4px;font-size:14px}
.post-action:hover{color:#38bdf8;transform:scale(1.1)}
.post-action.liked{color:#ef4444}
.post-likes{font-weight:700;font-size:14px;padding:0 14px}
.post-caption{padding:4px 14px 8px;font-size:14px;line-height:1.5}
.post-tags{color:#38bdf8;font-size:13px}
.post-comments{padding:4px 14px 14px}
.comment-form{display:flex;gap:8px;padding:8px 14px 14px;border-top:1px solid rgba(56,189,248,.1)}
.comment-form input{border-radius:20px;padding:8px 14px;font-size:13px}
.comment-form button{background:none;border:none;color:#38bdf8;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13px}
.sugg-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(56,189,248,.08)}
.sugg-item:last-child{border:none}
.follow-btn{margin-left:auto;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;padding:5px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700;transition:.2s}
.follow-btn:hover,.follow-btn.followed{background:#38bdf8;color:#000}

/* ── UNIVERSAL UPGRADE: Theme, Animations, Toast ── */
:root{
  --bg:#020617;--bg2:#0f172a;--card:rgba(30,41,59,.85);--border:rgba(56,189,248,.22);
  --accent:#38bdf8;--accent2:#22c55e;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;
}


/* Toast notifications */
.u-toast-container{position:fixed;bottom:24px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.u-toast{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  animation:uToastIn .3s ease;display:flex;align-items:center;gap:8px;
}
.u-toast.success{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.u-toast.error{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.u-toast.info{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
@keyframes uToastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes uToastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* Entrance animations */
@keyframes uFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes uFadeIn{from{opacity:0}to{opacity:1}}
@keyframes uPulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.4)}70%{box-shadow:0 0 0 8px rgba(56,189,248,0)}}
.u-fade-up{animation:uFadeUp .45s ease both}
.u-fade-in{animation:uFadeIn .4s ease both}
.u-pulse{animation:uPulse 2s infinite}

/* Button hover lift */
.btn:hover,[class*="btn"]:not([class*="btn-"]):hover{transform:translateY(-2px)!important}

/* Smooth card hover */
.card:hover,[class*="card"]:hover{
  border-color:var(--accent)!important;
  box-shadow:0 6px 28px rgba(56,189,248,.12)!important;
  transition:all .25s ease!important;
}

/* Loading skeleton */
.u-skeleton{
  background:linear-gradient(90deg,rgba(56,189,248,.06) 25%,rgba(56,189,248,.12) 50%,rgba(56,189,248,.06) 75%);
  background-size:200% 100%;animation:uSkeleton 1.4s infinite;border-radius:6px;
}
@keyframes uSkeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Progress bar component */
.u-progress{height:5px;background:rgba(56,189,248,.12);border-radius:3px;overflow:hidden;margin:8px 0}
.u-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s ease}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.55)}

/* Mobile responsive upgrades */
@media(max-width:600px){
  
  .u-toast-container{right:10px;bottom:80px;max-width:calc(100vw - 20px)}
}

</style>
</head>
<body><div class="container">
<a href="../index.html" class="back-link" onclick="window.close(); return false;">← Back to Portfolio</a>

<h1>📸 Social Feed</h1>
<p class="subtitle">Instagram-style photo sharing app</p>
<div class="grid2" style="align-items:start">
  <div>
    <div class="card">
      <div class="flex" style="margin-bottom:16px">
        <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#22c55e);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">👤</div>
        <div>
          <div style="font-weight:700">@yourprofile</div>
          <div style="font-size:13px;color:#64748b">Web Developer · Creator</div>
        </div>
      </div>
      <div class="grid3" style="text-align:center">
        <div><div class="stat-num" id="postCount" style="font-size:22px">0</div><div style="font-size:12px;color:#64748b">Posts</div></div>
        <div><div class="stat-num" style="font-size:22px" id="followersNum">1.2K</div><div style="font-size:12px;color:#64748b">Followers</div></div>
        <div><div class="stat-num" style="font-size:22px">348</div><div style="font-size:12px;color:#64748b">Following</div></div>
      </div>
    </div>
    <div class="card">
      <h3 style="color:#38bdf8;margin-bottom:14px">Create Post</h3>
      <select id="postEmoji" style="margin-bottom:10px">
        <option value="🌅">🌅 Sunrise</option><option value="🌆">🌆 City</option><option value="🌊">🌊 Ocean</option>
        <option value="🏔">🏔 Mountain</option><option value="🌸">🌸 Flowers</option><option value="🍕">🍕 Food</option>
        <option value="🎨">🎨 Art</option><option value="🐾">🐾 Pets</option><option value="✈️">✈️ Travel</option>
        <option value="💻">💻 Tech</option>
      </select>
      <input id="postFilter" placeholder="Filter (e.g. #sunset #travel)" style="margin-bottom:10px">
      <textarea id="postCaption" rows="3" placeholder="Write a caption..." style="margin-bottom:12px"></textarea>
      <button class="btn" onclick="createPost()" style="width:100%">📤 Share Post</button>
    </div>
    <div class="card">
      <h3 style="color:#38bdf8;margin-bottom:12px">Suggested Users</h3>
      <div id="suggestions"></div>
    </div>
  </div>
  <div id="feed"><p style="color:#64748b;text-align:center;padding:40px">No posts yet. Create one!</p></div>
</div>
</div>
<script>
const users=['@alexdesign','@techlife','@naturepics','@foodlover','@traveler'];
const avatars=['🧑‍🎨','👨‍💻','🌿','👩‍🍳','🗺'];
const posts=[];
let postId=0,followCount=1200;

function createPost(){
  const cap=document.getElementById('postCaption').value.trim();
  const emoji=document.getElementById('postEmoji').value;
  const tags=document.getElementById('postFilter').value.trim();
  if(!cap)return;
  const p={id:postId++,emoji,caption:cap,tags,likes:Math.floor(Math.random()*200)+10,liked:false,comments:[],user:'@yourprofile',avatar:'👤',time:'Just now'};
  posts.unshift(p);
  document.getElementById('postCaption').value='';
  document.getElementById('postFilter').value='';
  renderFeed();
  document.getElementById('postCount').textContent=posts.length;
}

function renderFeed(){
  if(!posts.length){document.getElementById('feed').innerHTML='<div class="card" style="text-align:center;color:#64748b;padding:40px">No posts yet.</div>';return;}
  document.getElementById('feed').innerHTML=posts.map(p=>`
    <div class="post-card" id="post${p.id}">
      <div class="post-header">
        <div class="post-avatar">${p.avatar}</div>
        <div><div style="font-weight:700;font-size:14px">${p.user}</div><div style="font-size:12px;color:#64748b">${p.time}</div></div>
      </div>
      <div class="post-img">${p.emoji}</div>
      <div class="post-actions">
        <button class="post-action ${p.liked?'liked':''}" onclick="like(${p.id})"><span>${p.liked?'❤️':'🤍'}</span></button>
        <button class="post-action" onclick="focusComment(${p.id})">💬</button>
        <button class="post-action" onclick="share(${p.id})">🔗</button>
        <span style="margin-left:auto;font-size:12px;color:#64748b">${p.time}</span>
      </div>
      <div class="post-likes">${p.likes} likes</div>
      <div class="post-caption"><strong>${p.user}</strong> ${p.caption} <span class="post-tags">${p.tags}</span></div>
      <div class="post-comments">${p.comments.map(c=>`<div style="font-size:13px;margin-bottom:4px"><strong>${c.user}</strong> ${c.text}</div>`).join('')}</div>
      <div class="comment-form">
        <input id="ci${p.id}" placeholder="Add a comment...">
        <button onclick="addComment(${p.id})">Post</button>
      </div>
    </div>`).join('');
}

function like(id){const p=posts.find(p=>p.id===id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;renderFeed();}
function focusComment(id){setTimeout(()=>document.getElementById('ci'+id)?.focus(),50);}
function share(id){navigator.clipboard?.writeText(location.href+'#post'+id);navigator.clipboard?.writeText(location.href+'#post'+id).catch(()=>{});
        const t=document.createElement('div');
        t.style.cssText='position:fixed;bottom:20px;right:20px;background:rgba(34,197,94,.9);color:#000;padding:10px 18px;border-radius:8px;font-weight:700;font-size:13px;z-index:9999';
        t.textContent='✓ Link copied!';document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function addComment(id){
  const el=document.getElementById('ci'+id);
  if(!el||!el.value.trim())return;
  const p=posts.find(p=>p.id===id);
  if(p){p.comments.push({user:'@yourprofile',text:el.value.trim()});renderFeed();}
}
function follow(btn){btn.classList.toggle('followed');btn.textContent=btn.classList.contains('followed')?'Following':'Follow';followCount+=btn.classList.contains('followed')?1:-1;document.getElementById('followersNum').textContent=(followCount/1000).toFixed(1)+'K';}

document.getElementById('suggestions').innerHTML=users.map((u,i)=>`
  <div class="sugg-item">
    <div class="post-avatar">${avatars[i]}</div>
    <div><div style="font-weight:700;font-size:13px">${u}</div><div style="font-size:11px;color:#64748b">Suggested for you</div></div>
    <button class="follow-btn" onclick="follow(this)">Follow</button>
  </div>`).join('');

// Seed with sample posts
[{emoji:'🌅',caption:'Beautiful morning view today!',tags:'#sunrise #morning #golden'},
 {emoji:'💻',caption:'Deep in code. Building something awesome 🚀',tags:'#coding #developer #tech'},
 {emoji:'🍕',caption:'Late night pizza hits different',tags:'#food #nightlife #yum'}
].forEach((d,i)=>{posts.push({id:postId++,emoji:d.emoji,caption:d.caption,tags:d.tags,likes:Math.floor(Math.random()*500)+50,liked:false,comments:[],user:users[i],avatar:avatars[i],time:((i+1)*2)+'h ago'});});
renderFeed();document.getElementById('postCount').textContent=0;
</script>
<script>
// ── UNIVERSAL UPGRADE: Theme, localStorage, Toast, Animations ──
(function(){
'use strict';

// ── 2. TOAST SYSTEM ──────────────────────────────────────────────
var toastContainer = null;
function getToastContainer(){
  if(!toastContainer || !document.body.contains(toastContainer)){
    toastContainer = document.createElement('div');
    toastContainer.className = 'u-toast-container';
    document.body.appendChild(toastContainer);
  }
  return toastContainer;
}

window.uToast = function(msg, type, duration){
  type = type || 'info';
  duration = duration || 2800;
  var icons = {success:'✅', error:'❌', info:'💡', warning:'⚠️'};
  var c = getToastContainer();
  var t = document.createElement('div');
  t.className = 'u-toast ' + type;
  t.innerHTML = '<span>' + (icons[type]||'💡') + '</span><span>' + msg + '</span>';
  c.appendChild(t);
  setTimeout(function(){
    t.style.animation = 'uToastOut .3s ease forwards';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration);
};

// ── 3. LOCALSTORAGE HELPERS ──────────────────────────────────────
var APP_KEY = 'uapp_' + location.pathname.split('/').pop().replace('.html','');
window.uSave = function(key, val){
  try { localStorage.setItem(APP_KEY + '_' + key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
};
window.uLoad = function(key, def){
  try {
    var v = localStorage.getItem(APP_KEY + '_' + key);
    return v !== null ? JSON.parse(v) : def;
  } catch(e){ return def; }
};
window.uClear = function(key){
  try { localStorage.removeItem(APP_KEY + '_' + key); } catch(e){}
};

// ── 4. ENTRANCE ANIMATIONS ───────────────────────────────────────
function animateEntrance(){
  var cards = document.querySelectorAll('.card, [class*="card"]');
  cards.forEach(function(el, i){
    el.style.opacity = '0';
    el.style.transform = 'translateY(18px)';
    setTimeout(function(){
      el.style.transition = 'opacity .4s ease, transform .4s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, i * 60);
  });
}

// ── 5. SMOOTH COUNTER ANIMATION ──────────────────────────────────
window.uAnimCount = function(el, target, duration, prefix, suffix){
  prefix = prefix || '';
  suffix = suffix || '';
  duration = duration || 1200;
  var start = 0;
  var step = target / (duration / 16);
  var iv = setInterval(function(){
    start = Math.min(start + step, target);
    el.textContent = prefix + Math.round(start).toLocaleString() + suffix;
    if(start >= target) clearInterval(iv);
  }, 16);
};

// ── 6. EXPORT HELPER ─────────────────────────────────────────────
window.uExportJSON = function(data, filename){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.json';
  a.click();
  uToast('Data exported!', 'success');
};
window.uExportCSV = function(rows, filename){
  var csv = rows.map(function(r){ return r.join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.csv';
  a.click();
  uToast('CSV exported!', 'success');
};

// ── 8. INIT ──────────────────────────────────────────────────────
function init(){
  setTimeout(animateEntrance, 100);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
<script>
(function(){
  // Persist posts
  var origCreate = window.createPost;
  if(origCreate){
    window.createPost = function(){
      origCreate.apply(this,arguments);
      setTimeout(function(){
        if(window.posts) uSave('ig_posts', window.posts.slice(0,20));
        uToast('Post shared! 📸', 'success');
      }, 100);
    };
  }
  
  // Persist likes
  var origLike = window.like;
  if(origLike){
    window.like = function(id){
      origLike.apply(this,[id]);
      setTimeout(function(){
        if(window.posts) uSave('ig_posts', window.posts.slice(0,20));
      }, 100);
    };
  }
  
  // Notifications panel
  function injectNotifications(){
    if(document.getElementById('uIgNotifs')) return;
    var actions = document.querySelector('.card:first-child .flex');
    if(!actions) return;
    var bell = document.createElement('button');
    bell.id = 'uNotifBtn';
    bell.style.cssText = 'position:relative;background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;padding:4px 8px;transition:.2s';
    bell.innerHTML = '🔔<span id="uNotifBadge" style="position:absolute;top:0;right:0;background:#ef4444;color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;font-weight:800;display:none;align-items:center;justify-content:center">0</span>';
    bell.onclick = function(){
      var panel = document.getElementById('uNotifPanel');
      if(panel) panel.style.display = panel.style.display==='none'?'block':'none';
    };
    actions.appendChild(bell);
    
    var panel = document.createElement('div');
    panel.id = 'uNotifPanel';
    panel.className = 'card';
    panel.style.cssText = 'display:none;margin-top:8px;padding:14px;max-height:200px;overflow-y:auto';
    panel.innerHTML = '<div style="font-weight:700;color:#38bdf8;margin-bottom:10px">Notifications</div><div id="uNotifList"><p style="color:#64748b;font-size:13px">No notifications yet.</p></div>';
    actions.closest('.card').after(panel);
  }
  
  var notifs = [];
  var origAddComment = window.addComment;
  if(origAddComment){
    window.addComment = function(id){
      origAddComment.apply(this,[id]);
      var post = (window.posts||[]).find(function(p){return p.id===id;});
      if(post){
        notifs.unshift({text:'New comment on "' + post.caption.substring(0,20) + '..."', time:'just now'});
        var badge = document.getElementById('uNotifBadge');
        if(badge){ badge.style.display='flex'; badge.textContent=notifs.length; }
        var list = document.getElementById('uNotifList');
        if(list) list.innerHTML = notifs.map(function(n){
          return '<div style="padding:8px 0;border-bottom:1px solid rgba(56,189,248,.08);font-size:13px">' + n.text + '<span style="float:right;color:#475569;font-size:11px">' + n.time + '</span></div>';
        }).join('');
        uToast('💬 New comment!', 'info', 1500);
      }
    };
  }
  
  injectNotifications();
})();
