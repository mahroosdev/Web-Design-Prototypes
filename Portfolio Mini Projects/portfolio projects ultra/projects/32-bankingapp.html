<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="description" content="Banking App — part of a professional web developer portfolio with 50+ projects.">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Banking App</title><style>*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#020617 0%,#0f172a 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;min-height:100vh;padding:40px 20px;overflow-x:hidden}
.container{max-width:1000px;margin:0 auto}
h1{background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:36px;margin-bottom:8px}
.subtitle{color:#94a3b8;margin-bottom:28px;font-size:15px}
.back-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;color:#38bdf8;text-decoration:none;font-weight:600;font-size:14px;padding:8px 14px;border:1px solid rgba(56,189,248,.3);border-radius:8px;transition:.2s}
.back-link:hover{background:rgba(56,189,248,.1)}
.card{background:rgba(30,41,59,.8);backdrop-filter:blur(10px);padding:24px;border-radius:16px;border:1px solid rgba(56,189,248,.2);margin-bottom:20px}
.btn{padding:10px 22px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;transition:.2s;background:linear-gradient(90deg,#38bdf8,#22c55e);color:#000}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(56,189,248,.35)}
.btn-outline{background:transparent;border:1px solid rgba(56,189,248,.4);color:#38bdf8}
.btn-red{background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff}
input,textarea,select{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
input::placeholder,textarea::placeholder{color:#64748b}
label{display:block;font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.3)}
.badge-green{background:rgba(34,197,94,.15);color:#22c55e;border-color:rgba(34,197,94,.3)}
.badge-red{background:rgba(239,68,68,.15);color:#ef4444;border-color:rgba(239,68,68,.3)}
.badge-yellow{background:rgba(234,179,8,.15);color:#eab308;border-color:rgba(234,179,8,.3)}
.stat-box{background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.15);border-radius:12px;padding:20px;text-align:center}
.stat-num{font-size:32px;font-weight:800;background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:12px;color:#64748b;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
hr{border:none;border-top:1px solid rgba(56,189,248,.1);margin:20px 0}
@media(max-width:768px){body{padding:15px 12px}h1{font-size:26px}.grid2,.grid3,.grid4{grid-template-columns:1fr}.card{padding:16px 14px}}
.tx-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(56,189,248,.08)}
.tx-item:last-child{border:none}
.tx-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-amount{font-size:16px;font-weight:800;margin-left:auto;text-align:right;flex-shrink:0}
.tx-name{font-weight:600;font-size:14px}
.tx-date{font-size:12px;color:#64748b;margin-top:1px}
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat-bar{flex:1;height:8px;background:rgba(56,189,248,.1);border-radius:4px;overflow:hidden}
.cat-fill{height:100%;border-radius:4px;transition:width .6s}
.goal-item{margin-bottom:14px}
.goal-header{display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px}
.goal-bar{height:10px;background:rgba(56,189,248,.1);border-radius:5px;overflow:hidden;margin-bottom:4px}
.goal-fill{height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e);border-radius:5px;transition:width .6s}
/* ── UNIVERSAL UPGRADE: Theme, Animations, Toast ── */
:root{
  --bg:#020617;--bg2:#0f172a;--card:rgba(30,41,59,.85);--border:rgba(56,189,248,.22);
  --accent:#38bdf8;--accent2:#22c55e;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;
}


/* Toast notifications */
.u-toast-container{position:fixed;bottom:24px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.u-toast{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  animation:uToastIn .3s ease;display:flex;align-items:center;gap:8px;
}
.u-toast.success{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.u-toast.error{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.u-toast.info{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
@keyframes uToastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes uToastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* Entrance animations */
@keyframes uFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes uFadeIn{from{opacity:0}to{opacity:1}}
@keyframes uPulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.4)}70%{box-shadow:0 0 0 8px rgba(56,189,248,0)}}
.u-fade-up{animation:uFadeUp .45s ease both}
.u-fade-in{animation:uFadeIn .4s ease both}
.u-pulse{animation:uPulse 2s infinite}

/* Button hover lift */
.btn:hover,[class*="btn"]:not([class*="btn-"]):hover{transform:translateY(-2px)!important}

/* Smooth card hover */
.card:hover,[class*="card"]:hover{
  border-color:var(--accent)!important;
  box-shadow:0 6px 28px rgba(56,189,248,.12)!important;
  transition:all .25s ease!important;
}

/* Loading skeleton */
.u-skeleton{
  background:linear-gradient(90deg,rgba(56,189,248,.06) 25%,rgba(56,189,248,.12) 50%,rgba(56,189,248,.06) 75%);
  background-size:200% 100%;animation:uSkeleton 1.4s infinite;border-radius:6px;
}
@keyframes uSkeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Progress bar component */
.u-progress{height:5px;background:rgba(56,189,248,.12);border-radius:3px;overflow:hidden;margin:8px 0}
.u-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s ease}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.55)}

/* Mobile responsive upgrades */
@media(max-width:600px){
  
  .u-toast-container{right:10px;bottom:80px;max-width:calc(100vw - 20px)}
}

</style></head>
<body><div class="container">
<a href="../index.html" class="back-link" onclick="window.close(); return false;">← Back to Portfolio</a>

<h1>🏦 NeoBank</h1>
<p class="subtitle">Modern digital banking dashboard</p>
<div class="grid2" style="align-items:start">
  <div>
    <div class="card" style="background:linear-gradient(135deg,rgba(56,189,248,.2),rgba(34,197,94,.1));border-color:rgba(56,189,248,.4)">
      <div class="flex" style="justify-content:space-between;margin-bottom:20px">
        <div><div style="font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Total Balance</div>
        <div style="font-size:36px;font-weight:900;background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent" id="mainBalance">$0.00</div></div>
        <div style="font-size:36px">💳</div>
      </div>
      <div style="font-size:14px;color:#94a3b8;font-family:monospace;letter-spacing:2px">•••• •••• •••• 4829</div>
      <div class="flex" style="justify-content:space-between;margin-top:16px">
        <div><div style="font-size:11px;color:#64748b;text-transform:uppercase">Card Holder</div><div style="font-weight:700;font-size:14px">Alex Johnson</div></div>
        <div style="text-align:right"><div style="font-size:11px;color:#64748b;text-transform:uppercase">Expires</div><div style="font-weight:700;font-size:14px">09/27</div></div>
      </div>
    </div>
    <div class="grid3" style="gap:10px;margin-bottom:20px">
      <div class="stat-box"><div class="stat-num" id="incomeAmt" style="font-size:20px">$0</div><div class="stat-label">Income</div></div>
      <div class="stat-box"><div class="stat-num" id="expenseAmt" style="font-size:20px">$0</div><div class="stat-label">Expenses</div></div>
      <div class="stat-box"><div class="stat-num" id="savingsAmt" style="font-size:20px">$0</div><div class="stat-label">Savings</div></div>
    </div>
    <div class="card">
      <h3 style="color:#38bdf8;margin-bottom:14px">Quick Actions</h3>
      <div class="grid2" style="gap:10px;margin-bottom:10px">
        <input id="sendAmt" type="number" placeholder="Amount ($)" style="font-size:14px">
        <input id="sendTo" placeholder="Recipient name" style="font-size:14px">
      </div>
      <button class="btn" onclick="sendMoney()" style="width:100%;margin-bottom:10px">💸 Send Money</button>
      <div class="grid2" style="gap:10px">
        <button class="btn btn-outline" onclick="addIncome()">+ Add Income</button>
        <button class="btn btn-outline" onclick="topUp()">⬆ Top Up</button>
      </div>
    </div>
    <div class="card">
      <h3 style="color:#38bdf8;margin-bottom:14px">Spending by Category</h3>
      <div id="spendCategories"></div>
    </div>
  </div>
  <div>
    <div class="card">
      <div class="flex" style="justify-content:space-between;margin-bottom:14px">
        <h3 style="color:#38bdf8">Transactions</h3>
        <select id="txFilter" onchange="renderTransactions()" style="width:auto;padding:6px 10px;font-size:13px">
          <option value="all">All</option><option value="income">Income</option><option value="expense">Expenses</option>
        </select>
      </div>
      <div id="txList"></div>
    </div>
    <div class="card">
      <h3 style="color:#38bdf8;margin-bottom:14px">Savings Goals</h3>
      <div id="goalsSection"></div>
      <button class="btn btn-outline" onclick="addGoal()" style="width:100%;margin-top:10px">+ New Goal</button>
    </div>
  </div>
</div>
</div><script>
let balance=24850.75,income=8500,expenses=3649.25,savings=4200;
const transactions=[
  {id:1,name:'Salary Deposit',cat:'Income',icon:'💼',color:'rgba(34,197,94,.15)',amount:8500,type:'income',date:'Today, 9:00 AM'},
  {id:2,name:'Netflix',cat:'Entertainment',icon:'🎬',color:'rgba(239,68,68,.15)',amount:-15.99,type:'expense',date:'Today, 8:12 AM'},
  {id:3,name:'Whole Foods',cat:'Groceries',icon:'🛒',color:'rgba(34,197,94,.15)',amount:-87.40,type:'expense',date:'Yesterday'},
  {id:4,name:'Uber',cat:'Transport',icon:'🚗',color:'rgba(56,189,248,.15)',amount:-18.50,type:'expense',date:'Yesterday'},
  {id:5,name:'AWS Services',cat:'Business',icon:'☁️',color:'rgba(168,85,247,.15)',amount:-124.00,type:'expense',date:'Dec 18'},
  {id:6,name:'Freelance Payment',cat:'Income',icon:'💻',color:'rgba(34,197,94,.15)',amount:1200,type:'income',date:'Dec 17'},
  {id:7,name:'Spotify',cat:'Entertainment',icon:'🎵',color:'rgba(239,68,68,.15)',amount:-9.99,type:'expense',date:'Dec 16'},
  {id:8,name:'Restaurant',cat:'Food',icon:'🍕',color:'rgba(245,158,11,.15)',amount:-62.30,type:'expense',date:'Dec 15'},
];
const goals=[
  {name:'Emergency Fund',target:10000,saved:6800,icon:'🛡'},
  {name:'Vacation Fund',target:3500,saved:2100,icon:'✈️'},
  {name:'New Laptop',target:2500,saved:900,icon:'💻'},
];
const spendCats=[{name:'Housing',pct:35,color:'#38bdf8'},{name:'Food',pct:22,color:'#22c55e'},{name:'Transport',pct:15,color:'#a855f7'},{name:'Entertainment',pct:12,color:'#f59e0b'},{name:'Other',pct:16,color:'#ef4444'}];

function fmtAmt(n){return(n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function updateSummary(){
  document.getElementById('mainBalance').textContent=fmtAmt(balance);
  document.getElementById('incomeAmt').textContent='$'+income.toLocaleString();
  document.getElementById('expenseAmt').textContent='$'+expenses.toFixed(0);
  document.getElementById('savingsAmt').textContent='$'+savings.toLocaleString();
}

function renderTransactions(){
  const f=document.getElementById('txFilter').value;
  const list=transactions.filter(t=>f==='all'||t.type===f);
  document.getElementById('txList').innerHTML=list.map(t=>`
    <div class="tx-item">
      <div class="tx-icon" style="background:${t.color}">${t.icon}</div>
      <div><div class="tx-name">${t.name}</div><div class="tx-date">${t.date} · ${t.cat}</div></div>
      <div class="tx-amount" style="color:${t.amount>0?'#22c55e':'#ef4444'}">${fmtAmt(t.amount)}</div>
    </div>`).join('');
}

function renderGoals(){
  document.getElementById('goalsSection').innerHTML=goals.map((g,i)=>`
    <div class="goal-item">
      <div class="goal-header">
        <span>${g.icon} ${g.name}</span>
        <span style="color:#38bdf8">${fmtAmt(g.saved)} / ${fmtAmt(g.target)}</span>
      </div>
      <div class="goal-bar"><div class="goal-fill" style="width:${Math.round(g.saved/g.target*100)}%"></div></div>
      <div class="flex" style="justify-content:space-between;font-size:12px;color:#64748b">
        <span>${Math.round(g.saved/g.target*100)}% reached</span>
        <span>${fmtAmt(g.target-g.saved)} remaining</span>
      </div>
      <button class="btn btn-outline" onclick="addToGoal(${i})" style="width:100%;margin-top:8px;padding:7px;font-size:12px">+ Add Funds</button>
    </div>`).join('');
}

function renderCategories(){
  document.getElementById('spendCategories').innerHTML=spendCats.map(c=>`
    <div class="cat-row">
      <span style="font-size:13px;width:110px;flex-shrink:0">${c.name}</span>
      <div class="cat-bar"><div class="cat-fill" style="width:${c.pct}%;background:${c.color}"></div></div>
      <span style="font-size:13px;font-weight:700;color:${c.color};width:36px;text-align:right">${c.pct}%</span>
    </div>`).join('');
}

function sendMoney(){
  const amt=parseFloat(document.getElementById('sendAmt').value)||0;
  const to=document.getElementById('sendTo').value.trim();
  if(!amt||!to||amt>balance)return;
  balance-=amt;expenses+=amt;
  transactions.unshift({id:Date.now(),name:'Transfer to '+to,cat:'Transfer',icon:'💸',color:'rgba(239,68,68,.15)',amount:-amt,type:'expense',date:'Just now'});
  document.getElementById('sendAmt').value='';document.getElementById('sendTo').value='';
  updateSummary();renderTransactions();
}
function addIncome(){const amt=parseFloat(prompt('Income amount ($):')||'0');if(amt>0){balance+=amt;income+=amt;transactions.unshift({id:Date.now(),name:'Income',cat:'Income',icon:'💰',color:'rgba(34,197,94,.15)',amount:amt,type:'income',date:'Just now'});updateSummary();renderTransactions();}}
function topUp(){const amt=parseFloat(prompt('Top up amount ($):')||'0');if(amt>0){balance+=amt;savings+=amt;updateSummary();}}
function addGoal(){const name=prompt('Goal name:');const target=parseFloat(prompt('Target amount ($):')||'0');if(name&&target>0){goals.push({name,target,saved:0,icon:'🎯'});renderGoals();}}
function addToGoal(i){const amt=parseFloat(prompt('Add amount ($):')||'0');if(amt>0&&amt<=balance){goals[i].saved=Math.min(goals[i].saved+amt,goals[i].target);balance-=amt;savings-=amt;updateSummary();renderGoals();}}

updateSummary();renderTransactions();renderGoals();renderCategories();
</script><script>
// ── UNIVERSAL UPGRADE: Theme, localStorage, Toast, Animations ──
(function(){
'use strict';

// ── 2. TOAST SYSTEM ──────────────────────────────────────────────
var toastContainer = null;
function getToastContainer(){
  if(!toastContainer || !document.body.contains(toastContainer)){
    toastContainer = document.createElement('div');
    toastContainer.className = 'u-toast-container';
    document.body.appendChild(toastContainer);
  }
  return toastContainer;
}

window.uToast = function(msg, type, duration){
  type = type || 'info';
  duration = duration || 2800;
  var icons = {success:'✅', error:'❌', info:'💡', warning:'⚠️'};
  var c = getToastContainer();
  var t = document.createElement('div');
  t.className = 'u-toast ' + type;
  t.innerHTML = '<span>' + (icons[type]||'💡') + '</span><span>' + msg + '</span>';
  c.appendChild(t);
  setTimeout(function(){
    t.style.animation = 'uToastOut .3s ease forwards';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration);
};

// ── 3. LOCALSTORAGE HELPERS ──────────────────────────────────────
var APP_KEY = 'uapp_' + location.pathname.split('/').pop().replace('.html','');
window.uSave = function(key, val){
  try { localStorage.setItem(APP_KEY + '_' + key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
};
window.uLoad = function(key, def){
  try {
    var v = localStorage.getItem(APP_KEY + '_' + key);
    return v !== null ? JSON.parse(v) : def;
  } catch(e){ return def; }
};
window.uClear = function(key){
  try { localStorage.removeItem(APP_KEY + '_' + key); } catch(e){}
};

// ── 4. ENTRANCE ANIMATIONS ───────────────────────────────────────
function animateEntrance(){
  var cards = document.querySelectorAll('.card, [class*="card"]');
  cards.forEach(function(el, i){
    el.style.opacity = '0';
    el.style.transform = 'translateY(18px)';
    setTimeout(function(){
      el.style.transition = 'opacity .4s ease, transform .4s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, i * 60);
  });
}

// ── 5. SMOOTH COUNTER ANIMATION ──────────────────────────────────
window.uAnimCount = function(el, target, duration, prefix, suffix){
  prefix = prefix || '';
  suffix = suffix || '';
  duration = duration || 1200;
  var start = 0;
  var step = target / (duration / 16);
  var iv = setInterval(function(){
    start = Math.min(start + step, target);
    el.textContent = prefix + Math.round(start).toLocaleString() + suffix;
    if(start >= target) clearInterval(iv);
  }, 16);
};

// ── 6. EXPORT HELPER ─────────────────────────────────────────────
window.uExportJSON = function(data, filename){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.json';
  a.click();
  uToast('Data exported!', 'success');
};
window.uExportCSV = function(rows, filename){
  var csv = rows.map(function(r){ return r.join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.csv';
  a.click();
  uToast('CSV exported!', 'success');
};

// ── 8. INIT ──────────────────────────────────────────────────────
function init(){
  setTimeout(animateEntrance, 100);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
</body></html>
