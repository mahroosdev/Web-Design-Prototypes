<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="description" content="Real Estate App — part of a professional web developer portfolio with 50+ projects.">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Real Estate App</title><style>*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#020617 0%,#0f172a 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;min-height:100vh;padding:40px 20px;overflow-x:hidden}
.container{max-width:1000px;margin:0 auto}
h1{background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:36px;margin-bottom:8px}
.subtitle{color:#94a3b8;margin-bottom:28px;font-size:15px}
.back-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;color:#38bdf8;text-decoration:none;font-weight:600;font-size:14px;padding:8px 14px;border:1px solid rgba(56,189,248,.3);border-radius:8px;transition:.2s}
.back-link:hover{background:rgba(56,189,248,.1)}
.card{background:rgba(30,41,59,.8);backdrop-filter:blur(10px);padding:24px;border-radius:16px;border:1px solid rgba(56,189,248,.2);margin-bottom:20px}
.btn{padding:10px 22px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;transition:.2s;background:linear-gradient(90deg,#38bdf8,#22c55e);color:#000}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(56,189,248,.35)}
.btn-outline{background:transparent;border:1px solid rgba(56,189,248,.4);color:#38bdf8}
.btn-red{background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff}
input,textarea,select{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
input::placeholder,textarea::placeholder{color:#64748b}
label{display:block;font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.3)}
.badge-green{background:rgba(34,197,94,.15);color:#22c55e;border-color:rgba(34,197,94,.3)}
.badge-red{background:rgba(239,68,68,.15);color:#ef4444;border-color:rgba(239,68,68,.3)}
.badge-yellow{background:rgba(234,179,8,.15);color:#eab308;border-color:rgba(234,179,8,.3)}
.stat-box{background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.15);border-radius:12px;padding:20px;text-align:center}
.stat-num{font-size:32px;font-weight:800;background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:12px;color:#64748b;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
hr{border:none;border-top:1px solid rgba(56,189,248,.1);margin:20px 0}
@media(max-width:768px){body{padding:15px 12px}h1{font-size:26px}.grid2,.grid3,.grid4{grid-template-columns:1fr}.card{padding:16px 14px}}
.prop-card{background:rgba(30,41,59,.8);border:1px solid rgba(56,189,248,.15);border-radius:14px;overflow:hidden;margin-bottom:12px;cursor:pointer;transition:.2s}
.prop-card:hover,.prop-card.active{border-color:rgba(56,189,248,.5);transform:translateY(-2px)}
.prop-img{width:100%;height:140px;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,rgba(56,189,248,.1),rgba(34,197,94,.08))}
.prop-body{padding:14px}
.prop-price{font-size:22px;font-weight:900;background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.prop-address{font-size:13px;color:#94a3b8;margin:4px 0 8px}
.prop-specs{display:flex;gap:10px;font-size:12px;color:#64748b;flex-wrap:wrap}
.prop-spec{display:flex;align-items:center;gap:4px}
.save-btn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:14px;transition:.2s}
.save-btn.saved{background:rgba(239,68,68,.2)}
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.feat-item{background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.1);border-radius:8px;padding:10px;text-align:center;font-size:13px}
.feat-icon{font-size:20px;margin-bottom:4px}
.feat-label{color:#64748b;font-size:11px}
.feat-val{font-weight:700;color:#e2e8f0}
/* ── UNIVERSAL UPGRADE: Theme, Animations, Toast ── */
:root{
  --bg:#020617;--bg2:#0f172a;--card:rgba(30,41,59,.85);--border:rgba(56,189,248,.22);
  --accent:#38bdf8;--accent2:#22c55e;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;
}


/* Toast notifications */
.u-toast-container{position:fixed;bottom:24px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.u-toast{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  animation:uToastIn .3s ease;display:flex;align-items:center;gap:8px;
}
.u-toast.success{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.u-toast.error{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.u-toast.info{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
@keyframes uToastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes uToastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* Entrance animations */
@keyframes uFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes uFadeIn{from{opacity:0}to{opacity:1}}
@keyframes uPulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.4)}70%{box-shadow:0 0 0 8px rgba(56,189,248,0)}}
.u-fade-up{animation:uFadeUp .45s ease both}
.u-fade-in{animation:uFadeIn .4s ease both}
.u-pulse{animation:uPulse 2s infinite}

/* Button hover lift */
.btn:hover,[class*="btn"]:not([class*="btn-"]):hover{transform:translateY(-2px)!important}

/* Smooth card hover */
.card:hover,[class*="card"]:hover{
  border-color:var(--accent)!important;
  box-shadow:0 6px 28px rgba(56,189,248,.12)!important;
  transition:all .25s ease!important;
}

/* Loading skeleton */
.u-skeleton{
  background:linear-gradient(90deg,rgba(56,189,248,.06) 25%,rgba(56,189,248,.12) 50%,rgba(56,189,248,.06) 75%);
  background-size:200% 100%;animation:uSkeleton 1.4s infinite;border-radius:6px;
}
@keyframes uSkeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Progress bar component */
.u-progress{height:5px;background:rgba(56,189,248,.12);border-radius:3px;overflow:hidden;margin:8px 0}
.u-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s ease}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.55)}

/* Mobile responsive upgrades */
@media(max-width:600px){
  
  .u-toast-container{right:10px;bottom:80px;max-width:calc(100vw - 20px)}
}

</style></head>
<body><div class="container">
<a href="../index.html" class="back-link" onclick="window.close(); return false;">← Back to Portfolio</a>

<h1>🏠 HomeQuest</h1>
<p class="subtitle">Search, filter and explore property listings</p>
<div class="card">
  <div class="flex" style="gap:10px;flex-wrap:wrap">
    <input id="locSearch" placeholder="City, neighborhood, zip..." style="flex:2;min-width:160px" oninput="renderListings()">
    <select id="propType" onchange="renderListings()" style="flex:1;min-width:120px">
      <option value="">All Types</option><option value="house">House</option>
      <option value="condo">Condo</option><option value="apartment">Apartment</option><option value="townhouse">Townhouse</option>
    </select>
    <select id="priceRange" onchange="renderListings()" style="flex:1;min-width:140px">
      <option value="0">Any Price</option><option value="200000">Up to $200k</option>
      <option value="500000">Up to $500k</option><option value="1000000">Up to $1M</option><option value="2000000">Up to $2M</option>
    </select>
    <select id="beds" onchange="renderListings()" style="flex:1;min-width:100px">
      <option value="0">Any Beds</option><option value="1">1+ Beds</option>
      <option value="2">2+ Beds</option><option value="3">3+ Beds</option><option value="4">4+ Beds</option>
    </select>
  </div>
</div>
<div class="grid2" style="align-items:start">
  <div>
    <div class="flex" style="justify-content:space-between;margin-bottom:12px">
      <span id="listCount" style="color:#64748b;font-size:14px">0 properties</span>
      <select id="sortProp" onchange="renderListings()" style="width:auto;padding:6px 10px;font-size:13px">
        <option value="new">Newest</option><option value="price_asc">Price: Low-High</option>
        <option value="price_desc">Price: High-Low</option><option value="size">Largest</option>
      </select>
    </div>
    <div id="listings"></div>
  </div>
  <div>
    <div id="propDetail" class="card">
      <div style="text-align:center;padding:30px;color:#64748b">
        <div style="font-size:48px;margin-bottom:12px">🏠</div>
        <div>Select a property to view details</div>
      </div>
    </div>
    <div class="card">
      <h3 style="color:#38bdf8;margin-bottom:14px">Saved Properties (<span id="savedCount">0</span>)</h3>
      <div id="savedList"><p style="color:#64748b;font-size:14px">No saved properties.</p></div>
    </div>
  </div>
</div>
</div><script>
const properties=[
  {id:1,emoji:'🏡',type:'house',title:'Modern Family Home',address:'123 Oak Street, Austin, TX',price:485000,beds:4,baths:3,sqft:2400,year:2019,garage:true,pool:false,desc:'Stunning modern home with open floor plan, chef kitchen, and large backyard. Recently renovated with premium finishes throughout.',features:['Hardwood floors','Smart home system','Solar panels','Gourmet kitchen','Master suite'],daysListed:5},
  {id:2,emoji:'🏢',type:'condo',title:'Downtown Luxury Condo',address:'456 Main Ave, Unit 1204, NYC, NY',price:1250000,beds:2,baths:2,sqft:1100,year:2021,garage:true,pool:true,desc:'Breathtaking city views from this high-floor condo. Floor-to-ceiling windows, premium appliances, 24/7 concierge.',features:['City views','Concierge','Gym access','Rooftop pool','Private balcony'],daysListed:12},
  {id:3,emoji:'🏘',type:'townhouse',title:'Charming Townhouse',address:'789 Elm Lane, Chicago, IL',price:375000,beds:3,baths:2,sqft:1800,year:2015,garage:false,pool:false,desc:'Beautiful townhouse in walkable neighborhood. Updated kitchen, private patio, steps from restaurants and transit.',features:['Private patio','Updated kitchen','Walk-in closets','Basement storage','Near transit'],daysListed:8},
  {id:4,emoji:'🏠',type:'house',title:'Suburban Dream Home',address:'321 Pine Drive, Denver, CO',price:620000,beds:5,baths:4,sqft:3200,year:2020,garage:true,pool:true,desc:'Expansive home on quiet cul-de-sac. Huge backyard with pool, bonus room, dedicated office space.',features:['Pool & spa','Home office','Bonus room','3-car garage','Mountain views'],daysListed:3},
  {id:5,emoji:'🏗',type:'apartment',title:'Modern Studio Apt',address:'555 Tech Blvd, Seattle, WA',price:189000,beds:1,baths:1,sqft:650,year:2022,garage:false,pool:false,desc:'Newly built studio in tech hub. Efficient layout, in-unit laundry, building rooftop deck with stunning views.',features:['In-unit laundry','Rooftop deck','Bike storage','EV charging','Fast internet'],daysListed:14},
  {id:6,emoji:'🏰',type:'house',title:'Historic Victorian',address:'101 Heritage Way, San Francisco, CA',price:1850000,beds:4,baths:3,sqft:2800,year:1905,garage:false,pool:false,desc:'Meticulously restored Victorian home. Original details preserved, modern amenities added. Prime location near Golden Gate Park.',features:['Original woodwork','Period details','Modern kitchen','Clawfoot tubs','Garden courtyard'],daysListed:21},
];

let saved=[],activeId=null;

function renderListings(){
  const q=document.getElementById('locSearch').value.toLowerCase();
  const type=document.getElementById('propType').value;
  const maxP=parseInt(document.getElementById('priceRange').value)||Infinity;
  const minB=parseInt(document.getElementById('beds').value)||0;
  const sort=document.getElementById('sortProp').value;
  let list=properties.filter(p=>{
    return(!q||p.title.toLowerCase().includes(q)||p.address.toLowerCase().includes(q))&&(!type||p.type===type)&&p.price<=maxP&&p.beds>=minB;
  });
  if(sort==='price_asc')list.sort((a,b)=>a.price-b.price);
  else if(sort==='price_desc')list.sort((a,b)=>b.price-a.price);
  else if(sort==='size')list.sort((a,b)=>b.sqft-a.sqft);
  else list.sort((a,b)=>a.daysListed-b.daysListed);
  document.getElementById('listCount').textContent=list.length+' propert'+(list.length!==1?'ies':'y')+' found';
  document.getElementById('listings').innerHTML=list.length?list.map(p=>`
    <div class="prop-card ${p.id===activeId?'active':''}" onclick="showProp(${p.id})">
      <div class="prop-img">${p.emoji}</div>
      <div class="prop-body">
        <div class="flex" style="justify-content:space-between;margin-bottom:4px">
          <div class="prop-price">$${p.price.toLocaleString()}</div>
          <button class="save-btn ${saved.includes(p.id)?'saved':''}" onclick="event.stopPropagation();toggleSave(${p.id})">${saved.includes(p.id)?'❤️':'🤍'}</button>
        </div>
        <div style="font-weight:700;font-size:15px;margin-bottom:2px">${p.title}</div>
        <div class="prop-address">${p.address}</div>
        <div class="prop-specs">
          <span class="prop-spec">🛏 ${p.beds} beds</span>
          <span class="prop-spec">🚿 ${p.baths} baths</span>
          <span class="prop-spec">📐 ${p.sqft.toLocaleString()} sqft</span>
          <span class="prop-spec">📅 ${p.year}</span>
          <span class="badge" style="font-size:10px">${p.type}</span>
          ${p.daysListed<=7?'<span class="badge badge-green" style="font-size:10px">New</span>':''}
        </div>
      </div>
    </div>`).join(''):'<p style="color:#64748b;text-align:center;padding:40px">No properties match your filters.</p>';
}

function showProp(id){
  activeId=id;
  const p=properties.find(p=>p.id===id);
  document.getElementById('propDetail').innerHTML=`
    <div style="font-size:72px;text-align:center;margin-bottom:12px">${p.emoji}</div>
    <div class="flex" style="justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px">
      <div class="prop-price" style="font-size:28px">$${p.price.toLocaleString()}</div>
      <button class="save-btn ${saved.includes(id)?'saved':''}" onclick="toggleSave(${id})" style="font-size:16px;padding:8px 14px">${saved.includes(id)?'❤️ Saved':'🤍 Save'}</button>
    </div>
    <h3 style="font-size:18px;font-weight:800;margin-bottom:4px">${p.title}</h3>
    <p style="color:#64748b;font-size:13px;margin-bottom:12px">📍 ${p.address}</p>
    <div class="feat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">
      <div class="feat-item"><div class="feat-icon">🛏</div><div class="feat-label">Beds</div><div class="feat-val">${p.beds}</div></div>
      <div class="feat-item"><div class="feat-icon">🚿</div><div class="feat-label">Baths</div><div class="feat-val">${p.baths}</div></div>
      <div class="feat-item"><div class="feat-icon">📐</div><div class="feat-label">SqFt</div><div class="feat-val">${p.sqft.toLocaleString()}</div></div>
      <div class="feat-item"><div class="feat-icon">📅</div><div class="feat-label">Built</div><div class="feat-val">${p.year}</div></div>
    </div>
    <p style="font-size:14px;color:#94a3b8;line-height:1.7;margin-bottom:14px">${p.desc}</p>
    <h4 style="color:#38bdf8;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Features</h4>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${p.features.map(f=>`<span class="badge">${f}</span>`).join('')}</div>
    <div class="grid2" style="gap:10px">
      <button class="btn" onclick="scheduleViewing(${p.id})">📅 Schedule Viewing</button>
      <button class="btn btn-outline" onclick="contactAgent(${p.id})">📞 Contact Agent</button>
    </div>
    <div id="actionFeedback${p.id}" style="margin-top:10px"></div>`;
  renderListings();
}

function toggleSave(id){
  const idx=saved.indexOf(id);
  if(idx>=0)saved.splice(idx,1);else saved.push(id);
  renderSaved();if(activeId===id)showProp(id);else renderListings();
}
function renderSaved(){
  document.getElementById('savedCount').textContent=saved.length;
  document.getElementById('savedList').innerHTML=saved.length?saved.map(id=>{const p=properties.find(p=>p.id===id);return`<div class="flex" style="padding:8px;border-radius:8px;background:rgba(56,189,248,.05);border:1px solid rgba(56,189,248,.1);margin-bottom:6px;cursor:pointer" onclick="showProp(${p.id})"><span style="font-size:20px">${p.emoji}</span><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.title}</div><div style="font-size:12px;color:#22c55e;font-weight:700">$${p.price.toLocaleString()}</div></div></div>`;}).join(''):'<p style="color:#64748b;font-size:14px">No saved properties.</p>';
}
function scheduleViewing(id){const el=document.getElementById('actionFeedback'+id);if(el)el.innerHTML='<div class="badge badge-green" style="padding:8px 14px;font-size:13px">✓ Viewing scheduled! Agent will contact you within 24h</div>';}
function contactAgent(id){const el=document.getElementById('actionFeedback'+id);if(el)el.innerHTML='<div class="badge" style="padding:8px 14px;font-size:13px">📬 Message sent! Agent will reply within 2 hours</div>';}
renderListings();
</script><script>
// ── UNIVERSAL UPGRADE: Theme, localStorage, Toast, Animations ──
(function(){
'use strict';

// ── 2. TOAST SYSTEM ──────────────────────────────────────────────
var toastContainer = null;
function getToastContainer(){
  if(!toastContainer || !document.body.contains(toastContainer)){
    toastContainer = document.createElement('div');
    toastContainer.className = 'u-toast-container';
    document.body.appendChild(toastContainer);
  }
  return toastContainer;
}

window.uToast = function(msg, type, duration){
  type = type || 'info';
  duration = duration || 2800;
  var icons = {success:'✅', error:'❌', info:'💡', warning:'⚠️'};
  var c = getToastContainer();
  var t = document.createElement('div');
  t.className = 'u-toast ' + type;
  t.innerHTML = '<span>' + (icons[type]||'💡') + '</span><span>' + msg + '</span>';
  c.appendChild(t);
  setTimeout(function(){
    t.style.animation = 'uToastOut .3s ease forwards';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration);
};

// ── 3. LOCALSTORAGE HELPERS ──────────────────────────────────────
var APP_KEY = 'uapp_' + location.pathname.split('/').pop().replace('.html','');
window.uSave = function(key, val){
  try { localStorage.setItem(APP_KEY + '_' + key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
};
window.uLoad = function(key, def){
  try {
    var v = localStorage.getItem(APP_KEY + '_' + key);
    return v !== null ? JSON.parse(v) : def;
  } catch(e){ return def; }
};
window.uClear = function(key){
  try { localStorage.removeItem(APP_KEY + '_' + key); } catch(e){}
};

// ── 4. ENTRANCE ANIMATIONS ───────────────────────────────────────
function animateEntrance(){
  var cards = document.querySelectorAll('.card, [class*="card"]');
  cards.forEach(function(el, i){
    el.style.opacity = '0';
    el.style.transform = 'translateY(18px)';
    setTimeout(function(){
      el.style.transition = 'opacity .4s ease, transform .4s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, i * 60);
  });
}

// ── 5. SMOOTH COUNTER ANIMATION ──────────────────────────────────
window.uAnimCount = function(el, target, duration, prefix, suffix){
  prefix = prefix || '';
  suffix = suffix || '';
  duration = duration || 1200;
  var start = 0;
  var step = target / (duration / 16);
  var iv = setInterval(function(){
    start = Math.min(start + step, target);
    el.textContent = prefix + Math.round(start).toLocaleString() + suffix;
    if(start >= target) clearInterval(iv);
  }, 16);
};

// ── 6. EXPORT HELPER ─────────────────────────────────────────────
window.uExportJSON = function(data, filename){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.json';
  a.click();
  uToast('Data exported!', 'success');
};
window.uExportCSV = function(rows, filename){
  var csv = rows.map(function(r){ return r.join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.csv';
  a.click();
  uToast('CSV exported!', 'success');
};

// ── 8. INIT ──────────────────────────────────────────────────────
function init(){
  setTimeout(animateEntrance, 100);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
<script>
(function(){
  // Mortgage calculator panel
  function injectMortgageCalc(){
    if(document.getElementById('uMortgageCalc')) return;
    var container = document.querySelector('.container,.grid2')?.parentNode || document.querySelector('.container');
    if(!container) return;
    var panel = document.createElement('div');
    panel.id = 'uMortgageCalc';
    panel.className = 'card u-fade-up';
    panel.style.marginTop = '20px';
    panel.innerHTML = '<div style="font-weight:700;color:#38bdf8;margin-bottom:14px;font-size:15px">🏦 Mortgage Calculator</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">' +
      '<div><label style="font-size:12px">Home Price ($)</label><input id="uMortPrice" type="number" value="500000" style="font-size:13px"></div>' +
      '<div><label style="font-size:12px">Down Payment (%)</label><input id="uMortDown" type="number" value="20" min="1" max="100" style="font-size:13px"></div>' +
      '<div><label style="font-size:12px">Interest Rate (%)</label><input id="uMortRate" type="number" value="6.5" step="0.1" style="font-size:13px"></div>' +
      '<div><label style="font-size:12px">Loan Term (years)</label><select id="uMortTerm" style="font-size:13px"><option value="30">30 years</option><option value="15">15 years</option><option value="10">10 years</option></select></div>' +
      '</div>' +
      '<button onclick="calcMortgage()" style="width:100%;padding:10px;background:linear-gradient(90deg,#38bdf8,#22c55e);border:none;color:#000;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;margin-bottom:12px">Calculate Monthly Payment</button>' +
      '<div id="uMortResult" style="display:none;padding:14px;background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.2);border-radius:10px"></div>';
    container.appendChild(panel);
  }
  
  window.calcMortgage = function(){
    var price = parseFloat(document.getElementById('uMortPrice')?.value||500000);
    var down = parseFloat(document.getElementById('uMortDown')?.value||20) / 100;
    var rate = parseFloat(document.getElementById('uMortRate')?.value||6.5) / 100 / 12;
    var n = parseInt(document.getElementById('uMortTerm')?.value||30) * 12;
    var principal = price * (1 - down);
    var monthly = rate === 0 ? principal/n : principal * (rate * Math.pow(1+rate,n)) / (Math.pow(1+rate,n)-1);
    var totalPaid = monthly * n;
    var totalInterest = totalPaid - principal;
    var res = document.getElementById('uMortResult');
    if(res){
      res.style.display = 'block';
      res.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
        ['Monthly Payment:$'+monthly.toFixed(2),'Loan Amount:$'+principal.toLocaleString(),'Total Payment:$'+totalPaid.toFixed(0),'Total Interest:$'+totalInterest.toFixed(0)].map(function(item){
          var parts = item.split(':');
          return '<div style="text-align:center;padding:10px;background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.1);border-radius:8px"><div style="font-size:11px;color:#64748b;margin-bottom:4px">'+parts[0]+'</div><div style="font-size:18px;font-weight:800;color:#38bdf8">'+parts[1]+'</div></div>';
        }).join('') + '</div>';
      uSave('mortgage_calc', {price:price,down:down,rate:rate,n:n,monthly:monthly.toFixed(2)});
      uToast('Monthly payment: $'+monthly.toFixed(2), 'success');
    }
  };
  
  // Restore saved
  var saved = uLoad('mortgage_calc', null);
  
  injectMortgageCalc();
  if(saved) setTimeout(calcMortgage, 500);
})();
</script>
</body></html>
