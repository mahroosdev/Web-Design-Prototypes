<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="description" content="Admin Dashboard — part of a professional web developer portfolio with 50+ projects.">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#020617 0%,#0f172a 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;min-height:100vh;padding:40px 20px;overflow-x:hidden}
.container{max-width:1000px;margin:0 auto}
h1{background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:36px;margin-bottom:8px}
.subtitle{color:#94a3b8;margin-bottom:28px;font-size:15px}
.back-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;color:#38bdf8;text-decoration:none;font-weight:600;font-size:14px;padding:8px 14px;border:1px solid rgba(56,189,248,.3);border-radius:8px;transition:.2s}
.back-link:hover{background:rgba(56,189,248,.1)}
.card{background:rgba(30,41,59,.8);backdrop-filter:blur(10px);padding:24px;border-radius:16px;border:1px solid rgba(56,189,248,.2);margin-bottom:20px}
.btn{padding:10px 22px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;transition:.2s;background:linear-gradient(90deg,#38bdf8,#22c55e);color:#000}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(56,189,248,.35)}
.btn-outline{background:transparent;border:1px solid rgba(56,189,248,.4);color:#38bdf8}
.btn-red{background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff}
input,textarea,select{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;width:100%;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
input::placeholder,textarea::placeholder{color:#64748b}
label{display:block;font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.3)}
.badge-green{background:rgba(34,197,94,.15);color:#22c55e;border-color:rgba(34,197,94,.3)}
.badge-red{background:rgba(239,68,68,.15);color:#ef4444;border-color:rgba(239,68,68,.3)}
.badge-yellow{background:rgba(234,179,8,.15);color:#eab308;border-color:rgba(234,179,8,.3)}
.stat-box{background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.15);border-radius:12px;padding:20px;text-align:center}
.stat-num{font-size:32px;font-weight:800;background:linear-gradient(90deg,#38bdf8,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:12px;color:#64748b;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
hr{border:none;border-top:1px solid rgba(56,189,248,.1);margin:20px 0}
@media(max-width:768px){body{padding:15px 12px}h1{font-size:26px}.grid2,.grid3,.grid4{grid-template-columns:1fr}.card{padding:16px 14px}}
.order-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(56,189,248,.08);font-size:13px}
.order-row:last-child{border:none}
.order-id{color:#64748b;font-family:monospace;width:60px;flex-shrink:0}
.order-customer{flex:1;font-weight:600}
.order-amount{font-weight:700;color:#22c55e;width:70px;text-align:right;flex-shrink:0}
.order-status{width:70px;text-align:center;flex-shrink:0}
.prod-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(56,189,248,.08)}
.prod-row:last-child{border:none}
.prod-bar{flex:1;height:6px;background:rgba(56,189,248,.1);border-radius:3px;overflow:hidden}
.prod-fill{height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e);border-radius:3px;transition:width .8s ease}
.src-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.src-bar{flex:1;height:8px;background:rgba(56,189,248,.1);border-radius:4px;overflow:hidden}
.src-fill{height:100%;border-radius:4px;transition:width .8s ease}
/* ── UNIVERSAL UPGRADE: Theme, Animations, Toast ── */
:root{
  --bg:#020617;--bg2:#0f172a;--card:rgba(30,41,59,.85);--border:rgba(56,189,248,.22);
  --accent:#38bdf8;--accent2:#22c55e;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;
}


/* Toast notifications */
.u-toast-container{position:fixed;bottom:24px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.u-toast{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  animation:uToastIn .3s ease;display:flex;align-items:center;gap:8px;
}
.u-toast.success{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.u-toast.error{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.u-toast.info{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.1)}
@keyframes uToastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes uToastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}

/* Entrance animations */
@keyframes uFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes uFadeIn{from{opacity:0}to{opacity:1}}
@keyframes uPulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.4)}70%{box-shadow:0 0 0 8px rgba(56,189,248,0)}}
.u-fade-up{animation:uFadeUp .45s ease both}
.u-fade-in{animation:uFadeIn .4s ease both}
.u-pulse{animation:uPulse 2s infinite}

/* Button hover lift */
.btn:hover,[class*="btn"]:not([class*="btn-"]):hover{transform:translateY(-2px)!important}

/* Smooth card hover */
.card:hover,[class*="card"]:hover{
  border-color:var(--accent)!important;
  box-shadow:0 6px 28px rgba(56,189,248,.12)!important;
  transition:all .25s ease!important;
}

/* Loading skeleton */
.u-skeleton{
  background:linear-gradient(90deg,rgba(56,189,248,.06) 25%,rgba(56,189,248,.12) 50%,rgba(56,189,248,.06) 75%);
  background-size:200% 100%;animation:uSkeleton 1.4s infinite;border-radius:6px;
}
@keyframes uSkeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Progress bar component */
.u-progress{height:5px;background:rgba(56,189,248,.12);border-radius:3px;overflow:hidden;margin:8px 0}
.u-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s ease}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.55)}

/* Mobile responsive upgrades */
@media(max-width:600px){
  
  .u-toast-container{right:10px;bottom:80px;max-width:calc(100vw - 20px)}
}

</style></head>
<body><div class="container">
<a href="../index.html" class="back-link" onclick="window.close(); return false;">← Back to Portfolio</a>

<h1>📊 Admin Dashboard</h1>
<p class="subtitle">Full-featured analytics and management dashboard</p>
<div class="grid4" style="margin-bottom:20px">
  <div class="stat-box"><div class="stat-num" id="s1">0</div><div class="stat-label">Total Users</div></div>
  <div class="stat-box"><div class="stat-num" id="s2">$0</div><div class="stat-label">Revenue</div></div>
  <div class="stat-box"><div class="stat-num" id="s3">0</div><div class="stat-label">Orders</div></div>
  <div class="stat-box"><div class="stat-num" id="s4">0%</div><div class="stat-label">Conversion</div></div>
</div>
<div class="grid2" style="align-items:start">
  <div>
    <div class="card">
      <div class="flex" style="justify-content:space-between;margin-bottom:16px">
        <h3 style="color:#38bdf8">Revenue Chart</h3>
        <select id="chartPeriod" onchange="renderChart()" style="width:auto;padding:6px 10px;font-size:13px">
          <option value="7">7 Days</option><option value="30" selected>30 Days</option><option value="90">90 Days</option>
        </select>
      </div>
      <canvas id="revenueChart" height="180"></canvas>
    </div>
    <div class="card">
      <h3 style="color:#38bdf8;margin-bottom:14px">Traffic Sources</h3>
      <div id="trafficSources"></div>
    </div>
  </div>
  <div>
    <div class="card">
      <div class="flex" style="justify-content:space-between;margin-bottom:14px">
        <h3 style="color:#38bdf8">Recent Orders</h3>
        <span class="badge">Live</span>
      </div>
      <div id="orderTable"></div>
    </div>
    <div class="card">
      <h3 style="color:#38bdf8;margin-bottom:14px">Top Products</h3>
      <div id="products"></div>
    </div>
    <div class="card">
      <h3 style="color:#38bdf8;margin-bottom:14px">User Activity</h3>
      <canvas id="activityChart" height="100"></canvas>
    </div>
  </div>
</div>
</div><script>
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const names=['Alice K.','Bob M.','Carol P.','David L.','Eve S.','Frank R.','Grace H.','Henry O.'];
const products2=['Pro Plan','Enterprise','Starter Kit','Analytics Add-on','API Credits','Support Bundle'];
const statuses=['Completed','Pending','Processing','Shipped'];
const statusColors={'Completed':'badge-green','Pending':'badge-yellow','Processing':'badge','Shipped':'badge-green'};
const sources=[{name:'Organic Search',pct:42,color:'#38bdf8'},{name:'Direct',pct:28,color:'#22c55e'},{name:'Social Media',pct:18,color:'#a855f7'},{name:'Email',pct:8,color:'#f59e0b'},{name:'Referral',pct:4,color:'#ef4444'}];

// Animate stats
function animateStat(id,target,prefix='',suffix=''){
  let v=0;const step=target/40;
  const iv=setInterval(()=>{v=Math.min(v+step,target);document.getElementById(id).textContent=prefix+Math.round(v).toLocaleString()+suffix;if(v>=target)clearInterval(iv);},30);
}
animateStat('s1',12847);animateStat('s2',94320,'$');animateStat('s3',3218);animateStat('s4',4.7,'','%');

// Revenue chart
function renderChart(){
  const days=parseInt(document.getElementById('chartPeriod').value);
  const canvas=document.getElementById('revenueChart');
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.parentElement.offsetWidth-48;
  const data=Array.from({length:days},()=>rnd(800,8000));
  const max=Math.max(...data);
  const W=canvas.width,H=180,pad=30;
  ctx.clearRect(0,0,W,H);
  // Grid lines
  ctx.strokeStyle='rgba(56,189,248,.08)';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad+(H-pad*2)*i/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-10,y);ctx.stroke();}
  // Gradient fill
  const grad=ctx.createLinearGradient(0,pad,0,H-pad);
  grad.addColorStop(0,'rgba(56,189,248,.3)');grad.addColorStop(1,'rgba(56,189,248,.0)');
  const pts=data.map((v,i)=>({x:pad+(W-pad-20)*i/(days-1),y:pad+(H-pad*2)*(1-v/max)}));
  ctx.beginPath();ctx.moveTo(pts[0].x,H-pad);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,H-pad);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  // Line
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.strokeStyle='#38bdf8';ctx.lineWidth=2;ctx.stroke();
  // Dots
  pts.forEach((p,i)=>{if(i%Math.ceil(days/10)===0){ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fillStyle='#38bdf8';ctx.fill();}});
}
setTimeout(renderChart,100);window.addEventListener('resize',renderChart);

// Activity chart
function renderActivity(){
  const canvas=document.getElementById('activityChart');
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.parentElement.offsetWidth-48;
  const hours=Array.from({length:24},(_,i)=>({h:i,v:i>=9&&i<=18?rnd(60,100):rnd(5,30)}));
  const W=canvas.width,H=100;
  ctx.clearRect(0,0,W,H);
  const bw=W/24-2;
  hours.forEach((d,i)=>{
    const h=d.v/100*(H-20);
    const grad=ctx.createLinearGradient(0,H-h,0,H);
    grad.addColorStop(0,'rgba(34,197,94,.8)');grad.addColorStop(1,'rgba(34,197,94,.1)');
    ctx.fillStyle=grad;
    ctx.fillRect(i*(bw+2),H-h,bw,h);
  });
}
setTimeout(renderActivity,100);

// Orders
const orders=Array.from({length:8},(_,i)=>({id:'#'+rnd(10000,99999),name:names[i%names.length],amount:rnd(29,499),status:statuses[rnd(0,3)]}));
document.getElementById('orderTable').innerHTML=orders.map(o=>`
  <div class="order-row">
    <span class="order-id">${o.id}</span>
    <span class="order-customer">${o.name}</span>
    <span class="order-amount">$${o.amount}</span>
    <span class="order-status"><span class="badge ${statusColors[o.status]}" style="font-size:10px">${o.status}</span></span>
  </div>`).join('');

// Products
const prodData=products2.map(p=>({name:p,sales:rnd(50,500),pct:rnd(30,95)}));
document.getElementById('products').innerHTML=prodData.map(p=>`
  <div class="prod-row">
    <span style="flex:1;font-size:13px;font-weight:600">${p.name}</span>
    <span style="font-size:12px;color:#64748b;width:50px;text-align:right">${p.sales} sales</span>
    <div class="prod-bar" style="width:80px"><div class="prod-fill" style="width:${p.pct}%"></div></div>
  </div>`).join('');

// Traffic sources
document.getElementById('trafficSources').innerHTML=sources.map(s=>`
  <div class="src-row">
    <span style="font-size:13px;font-weight:600;width:130px;flex-shrink:0">${s.name}</span>
    <div class="src-bar"><div class="src-fill" style="width:${s.pct}%;background:${s.color}"></div></div>
    <span style="font-size:13px;font-weight:700;color:${s.color};width:36px;text-align:right">${s.pct}%</span>
  </div>`).join('');
</script><script>
// ── UNIVERSAL UPGRADE: Theme, localStorage, Toast, Animations ──
(function(){
'use strict';

// ── 2. TOAST SYSTEM ──────────────────────────────────────────────
var toastContainer = null;
function getToastContainer(){
  if(!toastContainer || !document.body.contains(toastContainer)){
    toastContainer = document.createElement('div');
    toastContainer.className = 'u-toast-container';
    document.body.appendChild(toastContainer);
  }
  return toastContainer;
}

window.uToast = function(msg, type, duration){
  type = type || 'info';
  duration = duration || 2800;
  var icons = {success:'✅', error:'❌', info:'💡', warning:'⚠️'};
  var c = getToastContainer();
  var t = document.createElement('div');
  t.className = 'u-toast ' + type;
  t.innerHTML = '<span>' + (icons[type]||'💡') + '</span><span>' + msg + '</span>';
  c.appendChild(t);
  setTimeout(function(){
    t.style.animation = 'uToastOut .3s ease forwards';
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration);
};

// ── 3. LOCALSTORAGE HELPERS ──────────────────────────────────────
var APP_KEY = 'uapp_' + location.pathname.split('/').pop().replace('.html','');
window.uSave = function(key, val){
  try { localStorage.setItem(APP_KEY + '_' + key, JSON.stringify(val)); return true; }
  catch(e){ return false; }
};
window.uLoad = function(key, def){
  try {
    var v = localStorage.getItem(APP_KEY + '_' + key);
    return v !== null ? JSON.parse(v) : def;
  } catch(e){ return def; }
};
window.uClear = function(key){
  try { localStorage.removeItem(APP_KEY + '_' + key); } catch(e){}
};

// ── 4. ENTRANCE ANIMATIONS ───────────────────────────────────────
function animateEntrance(){
  var cards = document.querySelectorAll('.card, [class*="card"]');
  cards.forEach(function(el, i){
    el.style.opacity = '0';
    el.style.transform = 'translateY(18px)';
    setTimeout(function(){
      el.style.transition = 'opacity .4s ease, transform .4s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, i * 60);
  });
}

// ── 5. SMOOTH COUNTER ANIMATION ──────────────────────────────────
window.uAnimCount = function(el, target, duration, prefix, suffix){
  prefix = prefix || '';
  suffix = suffix || '';
  duration = duration || 1200;
  var start = 0;
  var step = target / (duration / 16);
  var iv = setInterval(function(){
    start = Math.min(start + step, target);
    el.textContent = prefix + Math.round(start).toLocaleString() + suffix;
    if(start >= target) clearInterval(iv);
  }, 16);
};

// ── 6. EXPORT HELPER ─────────────────────────────────────────────
window.uExportJSON = function(data, filename){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.json';
  a.click();
  uToast('Data exported!', 'success');
};
window.uExportCSV = function(rows, filename){
  var csv = rows.map(function(r){ return r.join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (filename || 'export') + '.csv';
  a.click();
  uToast('CSV exported!', 'success');
};

// ── 8. INIT ──────────────────────────────────────────────────────
function init(){
  setTimeout(animateEntrance, 100);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
<script>
(function(){
  var dashSettings = uLoad('dash_settings', {autoRefresh:true, refreshInterval:30});
  
  // Add export and live-refresh toolbar
  setTimeout(function(){
    var header = document.querySelector('h1,h2,.container > .card:first-child');
    if(header && !document.getElementById('uDashToolbar')){
      var toolbar = document.createElement('div');
      toolbar.id = 'uDashToolbar';
      toolbar.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:rgba(56,189,248,.04);border:1px solid rgba(56,189,248,.12);border-radius:10px;align-items:center';
      toolbar.innerHTML =
        '<span style="font-size:13px;color:#64748b;font-weight:600">Dashboard Controls:</span>' +
        '<button onclick="if(window.renderAll)renderAll();else if(window.renderChart)renderChart();uToast(\'Dashboard refreshed\',\'success\',1200)" style="padding:6px 14px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700">🔄 Refresh</button>' +
        '<button onclick="exportDashboard()" style="padding:6px 14px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#22c55e;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700">⬇ Export CSV</button>' +
        '<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b;cursor:pointer;margin-left:auto">' +
        '<input type="checkbox" id="uAutoRefresh" '+(dashSettings.autoRefresh?'checked':'')+' style="width:auto;background:transparent;border:none;box-shadow:none;padding:0"> Auto-refresh (30s)</label>' +
        '<div id="uLiveBadge" style="display:flex;align-items:center;gap:4px;font-size:11px;color:#22c55e;font-weight:700"><span style="width:6px;height:6px;background:#22c55e;border-radius:50%;display:inline-block;animation:uPulse 2s infinite"></span>LIVE</div>';
      document.querySelector('.container')?.insertBefore(toolbar, document.querySelector('.grid4,.grid2,h1,h2')?.nextSibling || document.querySelector('.container')?.firstChild);
    }
    
    document.getElementById('uAutoRefresh')?.addEventListener('change', function(){
      dashSettings.autoRefresh = this.checked;
      uSave('dash_settings', dashSettings);
      uToast('Auto-refresh ' + (this.checked?'enabled':'disabled'), 'info');
    });
  }, 400);
  
  window.exportDashboard = function(){
    var rows = [['Metric','Value','Period']];
    document.querySelectorAll('.kpi-card,.stat-box').forEach(function(card){
      var label = card.querySelector('.kpi-label,.stat-label')?.textContent.trim() || '';
      var val = card.querySelector('.kpi-val,.stat-num')?.textContent.trim() || '';
      if(label && val) rows.push([label, val, 'Current Period']);
    });
    uExportCSV(rows, 'dashboard_export');
  };
  
  // Auto-refresh
  if(dashSettings.autoRefresh){
    setInterval(function(){
      if(window.renderAll) renderAll();
      else if(window.renderChart) renderChart();
      var badge = document.getElementById('uLiveBadge');
      if(badge){ badge.style.opacity='0'; setTimeout(function(){badge.style.opacity='1';},300); }
    }, 30000);
  }
})();
</script>
</body></html>
