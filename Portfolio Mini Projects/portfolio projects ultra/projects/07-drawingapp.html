<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Drawing App — professional canvas drawing tool">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
  <title>Drawing App</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#020617;--bg2:#0f172a;--card:rgba(30,41,59,.9);--accent:#38bdf8;--green:#22c55e;--border:rgba(56,189,248,.2);--text:#f1f5f9;--muted:#94a3b8}
    body{background:linear-gradient(135deg,var(--bg),var(--bg2));font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);min-height:100vh;padding:20px 16px;overflow-x:hidden}
    .container{max-width:900px;margin:0 auto}
    a.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;font-weight:600;margin-bottom:16px;transition:.2s}
    a.back:hover{color:var(--green)}
    h1{background:linear-gradient(90deg,var(--accent),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:1.8rem;margin-bottom:4px}
    .subtitle{color:var(--muted);margin-bottom:20px;font-size:14px}
    .app-wrapper{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;backdrop-filter:blur(12px)}
    
    /* Toolbar */
    .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(15,23,42,.6)}
    .tool-group{display:flex;align-items:center;gap:6px;padding-right:10px;border-right:1px solid var(--border)}
    .tool-group:last-child{border-right:none;margin-left:auto}
    .tool-btn{width:36px;height:36px;border:1px solid var(--border);border-radius:8px;background:rgba(56,189,248,.05);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
    .tool-btn:hover{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.4)}
    .tool-btn.active{background:rgba(56,189,248,.2);border-color:var(--accent);box-shadow:0 0 0 2px rgba(56,189,248,.2)}
    .tool-btn[title]:hover::after{content:attr(title);position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--border);padding:3px 8px;border-radius:5px;font-size:11px;white-space:nowrap;pointer-events:none;z-index:99}
    
    label.tb-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
    input[type=range]{width:80px;height:4px;accent-color:var(--accent);cursor:pointer}
    input[type=color]{width:32px;height:32px;border:2px solid var(--border);border-radius:6px;cursor:pointer;padding:2px;background:transparent}
    .size-display{font-size:12px;color:var(--accent);font-weight:700;min-width:24px;text-align:center}
    
    /* Color palette */
    .palette{display:flex;gap:4px;flex-wrap:wrap}
    .pal-color{width:22px;height:22px;border-radius:5px;border:2px solid transparent;cursor:pointer;transition:.15s;flex-shrink:0}
    .pal-color:hover{transform:scale(1.15)}
    .pal-color.active{border-color:white;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
    
    /* Canvas area */
    .canvas-wrapper{position:relative;overflow:hidden}
    #drawCanvas{display:block;width:100%;cursor:crosshair;touch-action:none}
    
    /* Status bar */
    .status-bar{display:flex;align-items:center;gap:16px;padding:8px 16px;border-top:1px solid var(--border);background:rgba(15,23,42,.4);font-size:11px;color:var(--muted)}
    .status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
    
    /* Action buttons */
    .act-btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid;transition:all .2s;white-space:nowrap}
    .act-btn:hover{transform:translateY(-1px)}
    .btn-clear{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#ef4444}
    .btn-clear:hover{background:rgba(239,68,68,.25)}
    .btn-undo{background:rgba(148,163,184,.1);border-color:rgba(148,163,184,.3);color:var(--muted)}
    .btn-undo:hover{background:rgba(148,163,184,.2)}
    .btn-save{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:var(--green)}
    .btn-save:hover{background:rgba(34,197,94,.25)}
    
    @media(max-width:600px){.toolbar{gap:6px;padding:10px}.tool-group{padding-right:6px;gap:4px}input[type=range]{width:60px}}
  </style>
</head>
<body>
<div class="container">
  <a href="../index.html" class="back" onclick="window.close(); return false;">← Back to Portfolio</a>
  <h1>🎨 Drawing App</h1>
  <p class="subtitle">Professional canvas — draw, shape, erase, export</p>
  
  <div class="app-wrapper">
    <!-- Toolbar -->
    <div class="toolbar">
      <!-- Tools -->
      <div class="tool-group">
        <span class="tb-label">Tool</span>
        <button class="tool-btn active" id="toolPen" onclick="setTool('pen')" title="Pen">✏️</button>
        <button class="tool-btn" id="toolLine" onclick="setTool('line')" title="Line">📏</button>
        <button class="tool-btn" id="toolRect" onclick="setTool('rect')" title="Rectangle">⬜</button>
        <button class="tool-btn" id="toolCircle" onclick="setTool('circle')" title="Circle">⭕</button>
        <button class="tool-btn" id="toolEraser" onclick="setTool('eraser')" title="Eraser">🧹</button>
        <button class="tool-btn" id="toolFill" onclick="setTool('fill')" title="Fill">🪣</button>
      </div>
      <!-- Brush size -->
      <div class="tool-group">
        <span class="tb-label">Size</span>
        <input type="range" id="brushSize" min="1" max="50" value="5" oninput="updateSize()">
        <span class="size-display" id="sizeLabel">5</span>
      </div>
      <!-- Opacity -->
      <div class="tool-group">
        <span class="tb-label">Opacity</span>
        <input type="range" id="opacity" min="10" max="100" value="100" oninput="updateOpacity()">
        <span class="size-display" id="opacityLabel">100%</span>
      </div>
      <!-- Color picker -->
      <div class="tool-group">
        <span class="tb-label">Color</span>
        <input type="color" id="colorPicker" value="#38bdf8" onchange="setColor(this.value)">
        <div class="palette" id="palette"></div>
      </div>
      <!-- Actions -->
      <div class="tool-group">
        <button class="act-btn btn-undo" onclick="undo()">↩ Undo</button>
        <button class="act-btn btn-clear" onclick="clearCanvas()">🗑 Clear</button>
        <button class="act-btn btn-save" onclick="saveImage()">💾 Save</button>
      </div>
    </div>
    
    <!-- Canvas -->
    <div class="canvas-wrapper">
      <canvas id="drawCanvas"></canvas>
    </div>
    
    <!-- Status bar -->
    <div class="status-bar">
      <div class="status-dot"></div>
      <span id="statusTool">Tool: Pen</span>
      <span>|</span>
      <span id="statusPos">X: 0  Y: 0</span>
      <span>|</span>
      <span id="statusColor" style="display:flex;align-items:center;gap:4px">Color: <span id="colorSwatch" style="width:12px;height:12px;border-radius:3px;background:#38bdf8;display:inline-block"></span></span>
      <span style="margin-left:auto;opacity:.6">Ctrl+Z = Undo</span>
    </div>
  </div>
</div>

<script>
const PALETTE = ['#ef4444','#f97316','#eab308','#22c55e','#38bdf8','#818cf8','#ec4899','#f1f5f9','#1e293b','#000000'];

// Setup canvas
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resizeCanvas() {
  const wrapper = canvas.parentElement;
  const rect = wrapper.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const newW = Math.floor(rect.width);
  const newH = Math.max(420, Math.floor(window.innerHeight * 0.5));
  if (W === newW && H === newH) return;
  // Save current drawing
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  W = newW; H = newH;
  canvas.width = newW * dpr;
  canvas.height = newH * dpr;
  canvas.style.width = newW + 'px';
  canvas.style.height = newH + 'px';
  ctx.scale(dpr, dpr);
  ctx.putImageData(img, 0, 0);
}

// State
let tool = 'pen';
let drawing = false;
let color = '#38bdf8';
let brushW = 5;
let alpha = 1;
let startX, startY;
let undoStack = [];
const MAX_UNDO = 20;

function saveState() {
  undoStack.push(canvas.toDataURL());
  if (undoStack.length > MAX_UNDO) undoStack.shift();
}

function undo() {
  if (!undoStack.length) return;
  const prev = undoStack.pop();
  const img = new Image();
  img.onload = () => { ctx.clearRect(0,0,W,H); ctx.drawImage(img,0,0); };
  img.src = prev;
}

function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tool' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
  canvas.style.cursor = t === 'eraser' ? 'cell' : t === 'fill' ? 'crosshair' : 'crosshair';
  document.getElementById('statusTool').textContent = 'Tool: ' + t.charAt(0).toUpperCase() + t.slice(1);
}

function setColor(c) {
  color = c;
  document.getElementById('colorPicker').value = c;
  document.getElementById('colorSwatch').style.background = c;
  document.querySelectorAll('.pal-color').forEach(el => {
    el.classList.toggle('active', el.dataset.c === c);
  });
}

function updateSize() {
  brushW = +document.getElementById('brushSize').value;
  document.getElementById('sizeLabel').textContent = brushW;
}

function updateOpacity() {
  alpha = document.getElementById('opacity').value / 100;
  document.getElementById('opacityLabel').textContent = Math.round(alpha * 100) + '%';
}

function applyStyle(strokeOnly) {
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
  ctx.fillStyle = color;
  ctx.lineWidth = tool === 'eraser' ? brushW * 2 : brushW;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

// Drawing handlers
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - r.left), y: (src.clientY - r.top) };
}

// Snapshot for shape preview
let snapshot;

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e); }, {passive:false});
canvas.addEventListener('mousemove', doMove);
canvas.addEventListener('touchmove', e => { e.preventDefault(); doMove(e); }, {passive:false});
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchend', endDraw);
canvas.addEventListener('mouseleave', endDraw);

function startDraw(e) {
  const {x, y} = getPos(e);
  startX = x; startY = y;
  drawing = true;
  saveState();
  if (tool === 'fill') { floodFill(Math.round(x), Math.round(y)); drawing = false; return; }
  if (tool === 'pen' || tool === 'eraser') {
    applyStyle();
    ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.beginPath();
    ctx.moveTo(x, y);
  }
  if (['line','rect','circle'].includes(tool)) {
    snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }
}

function doMove(e) {
  const {x, y} = getPos(e);
  document.getElementById('statusPos').textContent = 'X: ' + Math.round(x) + '  Y: ' + Math.round(y);
  if (!drawing) return;
  applyStyle();
  if (tool === 'pen' || tool === 'eraser') {
    ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.lineTo(x, y);
    ctx.stroke();
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.putImageData(snapshot, 0, 0);
    ctx.beginPath();
    if (tool === 'line') { ctx.moveTo(startX,startY); ctx.lineTo(x,y); ctx.stroke(); }
    else if (tool === 'rect') { ctx.strokeRect(startX, startY, x-startX, y-startY); }
    else if (tool === 'circle') {
      const rx = (x-startX)/2, ry = (y-startY)/2;
      ctx.ellipse(startX+rx, startY+ry, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI*2);
      ctx.stroke();
    }
  }
}

function endDraw() {
  if (!drawing) return;
  drawing = false;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  if (tool === 'pen' || tool === 'eraser') ctx.closePath();
}

// Flood fill (simple canvas implementation)
function floodFill(x, y) {
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  const dpr = window.devicePixelRatio || 1;
  const cx = Math.round(x * dpr), cy = Math.round(y * dpr);
  const W2 = canvas.width, H2 = canvas.height;
  const idx = (cy * W2 + cx) * 4;
  const targetR = data[idx], targetG = data[idx+1], targetB = data[idx+2], targetA = data[idx+3];
  const fillC = hexToRgb(color);
  if (!fillC) return;
  if (targetR === fillC.r && targetG === fillC.g && targetB === fillC.b) return;
  const stack = [[cx, cy]];
  function match(i) { return Math.abs(data[i]-targetR)<30 && Math.abs(data[i+1]-targetG)<30 && Math.abs(data[i+2]-targetB)<30 && Math.abs(data[i+3]-targetA)<30; }
  while (stack.length) {
    const [px,py] = stack.pop();
    if (px<0||py<0||px>=W2||py>=H2) continue;
    const i=(py*W2+px)*4;
    if (!match(i)) continue;
    data[i]=fillC.r; data[i+1]=fillC.g; data[i+2]=fillC.b; data[i+3]=255;
    stack.push([px+1,py],[px-1,py],[px,py+1],[px,py-1]);
  }
  ctx.putImageData(imgData, 0, 0);
}

function hexToRgb(h) {
  const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);
  return r ? {r:parseInt(r[1],16),g:parseInt(r[2],16),b:parseInt(r[3],16)} : null;
}

function clearCanvas() {
  if (!confirm('Clear the entire canvas?')) return;
  saveState();
  ctx.clearRect(0, 0, W, H);
}

function saveImage() {
  const a = document.createElement('a');
  a.download = 'drawing-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}

// Build palette
function buildPalette() {
  const pal = document.getElementById('palette');
  PALETTE.forEach(c => {
    const d = document.createElement('div');
    d.className = 'pal-color' + (c === color ? ' active' : '');
    d.style.background = c;
    d.dataset.c = c;
    d.title = c;
    d.onclick = () => setColor(c);
    pal.appendChild(d);
  });
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.key === 'p') setTool('pen');
  if (e.key === 'e') setTool('eraser');
  if (e.key === 'l') setTool('line');
  if (e.key === 'r') setTool('rect');
  if (e.key === 'c') setTool('circle');
  if (e.key === 'f') setTool('fill');
});

function closeWindow(ev) {
  if (ev) try { ev.stopPropagation(); } catch(x) {}
  try { window.close(); } catch(x) {}
  try { if (window.opener) { window.opener.postMessage({type:'requestClose',url:window.location.href},'*'); setTimeout(()=>{window.location.href='../index.html';},300); return; }} catch(x) {}
  window.location.href = '../index.html';
}

// Init
buildPalette();
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
// Fill with white background
ctx.fillStyle = '#0f1a2e';
ctx.fillRect(0, 0, W, H);
undoStack = []; // clear the auto-state from fillRect
</script>
</body>
</html>
