<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Banking App | DevOS</title>
  <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">BANK_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">
<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">🏦</span><h1>Banking App</h1></div>
  <p>Personal finance with transactions, budgets, goals and insights.</p>
</div>


<h1>🏦 Banking Dashboard</h1>
<p>Personal finance dashboard with accounts, transactions and budgets.</p>
<div style="margin-top:16px"><div class="card" style="background:linear-gradient(135deg,rgba(0,224,255,.1),rgba(129,140,248,.08));margin-bottom:12px">
  <div style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:6px">TOTAL BALANCE</div>
  <div style="font-size:36px;font-weight:800;color:var(--accent);margin-bottom:12px">$24,850.00</div>
  <div class="row" style="gap:8px">
    <button class="btn btn-primary" onclick="toast('Transfer initiated!')" style="flex:1;font-size:13px">Transfer</button>
    <button class="btn btn-outline" onclick="toast('Pay feature coming soon!')" style="flex:1;font-size:13px">Pay</button>
  </div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
  <div class="card" style="text-align:center"><div style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:4px">INCOME</div><div style="font-size:20px;font-weight:700;color:var(--accent3)">+$5,200</div></div>
  <div class="card" style="text-align:center"><div style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:4px">EXPENSES</div><div style="font-size:20px;font-weight:700;color:var(--accent4)">-$3,480</div></div>
</div>
<div class="card" style="margin-bottom:12px">
  <h2 style="font-size:14px;margin-bottom:12px">Recent Transactions</h2>
  <div id="bank-tx"></div>
</div>
<div class="card">
  <h2 style="font-size:14px;margin-bottom:12px">Budget Overview</h2>
  <div id="bank-budget"></div>
</div></div>
<script>const txs=[{desc:'Apple Store',amount:-129,cat:'Shopping',icon:'🛍',date:'Today'},{desc:'Salary Deposit',amount:5200,cat:'Income',icon:'💰',date:'Today'},{desc:'Netflix',amount:-15,cat:'Entertainment',icon:'🎬',date:'Yesterday'},{desc:'Grocery Store',amount:-84,cat:'Food',icon:'🛒',date:'Yesterday'},{desc:'Freelance Payment',amount:800,cat:'Income',icon:'💼',date:'2 days ago'},{desc:'Electricity Bill',amount:-112,cat:'Utilities',icon:'⚡',date:'3 days ago'}];
const budgets=[{cat:'Food',spent:420,limit:600,icon:'🍔'},{cat:'Shopping',spent:380,limit:400,icon:'🛍'},{cat:'Entertainment',spent:89,limit:200,icon:'🎬'},{cat:'Transport',spent:165,limit:300,icon:'🚗'}];
document.getElementById('bank-tx').innerHTML=txs.map(t=>`<div class="row" style="align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,224,255,.06)"><div style="width:38px;height:38px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px">${t.icon}</div><div style="flex:1"><div style="font-size:13px;font-weight:600">${t.desc}</div><div style="font-size:11px;color:var(--muted)">${t.cat} · ${t.date}</div></div><span style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:${t.amount>0?'var(--accent3)':'var(--accent4)'}">${t.amount>0?'+':''}$${Math.abs(t.amount)}</span></div>`).join('');
document.getElementById('bank-budget').innerHTML=budgets.map(b=>`<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between;margin-bottom:5px;font-size:12px"><span>${b.icon} ${b.cat}</span><span style="font-family:'JetBrains Mono',monospace;color:${b.spent/b.limit>.9?'var(--accent4)':'var(--muted)'}">$${b.spent} / $${b.limit}</span></div><div style="background:var(--card2);border-radius:4px;height:7px;overflow:hidden"><div style="height:100%;width:${b.spent/b.limit*100}%;background:${b.spent/b.limit>.9?'var(--accent4)':'linear-gradient(90deg,var(--accent3),var(--accent))'};border-radius:4px"></div></div></div>`).join('');</script>


</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
