<h1>💬 Chat Application</h1>
<p>Real-time style chat UI with message bubbles and emoji.</p>
<div style="margin-top:16px"><div class="card" style="display:flex;flex-direction:column;height:500px;padding:0;overflow:hidden">
  <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
    <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center">🤖</div>
    <div><div style="font-size:14px;font-weight:600">DevBot</div><div style="font-size:11px;color:var(--accent3)">● Online</div></div>
  </div>
  <div id="chat-msgs" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px"></div>
  <div style="padding:12px;border-top:1px solid var(--border)">
    <div class="row" style="gap:8px">
      <div style="display:flex;gap:4px">
        <button onclick="addEmoji('😂')" style="background:none;border:none;font-size:20px;cursor:pointer;padding:4px">😂</button>
        <button onclick="addEmoji('👍')" style="background:none;border:none;font-size:20px;cursor:pointer;padding:4px">👍</button>
        <button onclick="addEmoji('❤️')" style="background:none;border:none;font-size:20px;cursor:pointer;padding:4px">❤️</button>
      </div>
      <input id="chat-in" style="flex:1" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="btn btn-primary" onclick="sendMsg()" style="min-height:44px">Send</button>
    </div>
  </div>
</div></div>
<script>const replies=['Interesting! Tell me more 🤔','That sounds great! 🎉','I totally agree with you!','Wow, really? That is fascinating!','Haha, that is funny! 😄','Great point! I have been thinking the same.','Sounds like a plan! 💯','I will get right on that!','Can you elaborate a bit more?','Absolutely! No problem at all 👍'];
let msgs=[{from:'bot',text:'Hey! I am DevBot. How can I help you today? 👋'}];
function renderMsgs(){const el=document.getElementById('chat-msgs');el.innerHTML=msgs.map(m=>`<div style="display:flex;flex-direction:column;align-items:${m.from==='me'?'flex-end':'flex-start'}"><div style="max-width:75%;padding:10px 14px;border-radius:${m.from==='me'?'14px 14px 4px 14px':'14px 14px 14px 4px'};background:${m.from==='me'?'linear-gradient(135deg,var(--accent),var(--accent2))':'var(--card2)'};color:${m.from==='me'?'#000':'var(--text)'};font-size:14px;line-height:1.5">${m.text}</div></div>`).join('');el.scrollTop=el.scrollHeight;}
function sendMsg(){const v=document.getElementById('chat-in').value.trim();if(!v)return;msgs.push({from:'me',text:v});document.getElementById('chat-in').value='';renderMsgs();setTimeout(()=>{msgs.push({from:'bot',text:replies[Math.floor(Math.random()*replies.length)]});renderMsgs();},600+Math.random()*800);}
function addEmoji(e){document.getElementById('chat-in').value+=e;}
renderMsgs();</script>


</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
