<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>QR Generator | DevOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">QR_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">

<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">🔲</span><h1>QR Generator</h1></div>
  <p>Generate, customize and download QR codes for URLs, WiFi, contacts, email and plain text.</p>
</div>
<div class="card animate-in" style="margin-bottom:14px">
  <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:14px">
    <button class="chip active" id="qtype-url" onclick="setQType('url',this)">🔗 URL</button>
    <button class="chip" id="qtype-text" onclick="setQType('text',this)">📝 Text</button>
    <button class="chip" id="qtype-wifi" onclick="setQType('wifi',this)">📶 WiFi</button>
    <button class="chip" id="qtype-email" onclick="setQType('email',this)">✉️ Email</button>
    <button class="chip" id="qtype-tel" onclick="setQType('tel',this)">📞 Phone</button>
    <button class="chip" id="qtype-vcard" onclick="setQType('vcard',this)">👤 Contact</button>
  </div>
  <div id="qr-fields"></div>
  <div class="row" style="gap:10px;margin-top:12px;flex-wrap:wrap">
    <div class="col"><label>Foreground</label><input type="color" id="qr-fg" value="#000000" style="height:44px;padding:4px;cursor:pointer"></div>
    <div class="col"><label>Background</label><input type="color" id="qr-bg" value="#ffffff" style="height:44px;padding:4px;cursor:pointer"></div>
    <div class="col"><label>Size</label><select id="qr-size"><option value="150">Small</option><option value="200" selected>Medium</option><option value="280">Large</option></select></div>
  </div>
</div>
<div class="row" style="gap:14px;flex-wrap:wrap;align-items:flex-start">
  <div class="card animate-in" style="flex:1;min-width:200px;text-align:center">
    <div id="qr-box" style="display:inline-block;padding:16px;background:#fff;border-radius:var(--r2)"><canvas id="qr-canvas" style="touch-action:none"></canvas></div>
    <div id="qr-empty" style="padding:20px;color:var(--muted);font-size:13px">Fill in fields and click Generate</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;min-width:140px">
    <button class="btn btn-primary btn-full" onclick="generateQR()">⚡ Generate</button>
    <button class="btn btn-outline btn-full" onclick="downloadQR()" id="qr-dl" disabled>⬇ PNG</button>
    <button class="btn btn-outline btn-full" onclick="copyQR()" id="qr-cp" disabled>📋 Copy</button>
    <button class="btn btn-ghost btn-full" onclick="shareQR()" id="qr-sh">🔗 Share</button>
  </div>
</div>
<div style="margin-top:16px">
  <div class="section-title">Recent QR Codes</div>
  <div id="qr-history"></div>
</div>

</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
