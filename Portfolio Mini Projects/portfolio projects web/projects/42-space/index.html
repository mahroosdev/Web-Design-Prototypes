<body>
<div id="topbar">

    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>

<div class="wrap">
<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">🚀</span><h1>Space Explorer</h1></div>
  <p>Animated solar system with planet facts and real orbital data.</p>
</div>


<h1>🚀 Space Explorer</h1>
<p>Interactive solar system with planet info and animations.</p>
<div style="margin-top:16px"><canvas id="sp-canvas" style="width:100%;height:400px;border-radius:14px;border:1px solid var(--border);cursor:pointer;display:block;touch-action:none"></canvas>
<div id="sp-info" class="card" style="margin-top:12px;text-align:center">
  <p style="color:var(--muted);font-size:13px">Click on a planet to learn more</p>
</div></div>
<script>const canvas=document.getElementById('sp-canvas');const ctx=canvas.getContext('2d');canvas.width=canvas.offsetWidth;canvas.height=400;
const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;
const planets=[{name:'Mercury',r:4,orbit:50,speed:.047,color:'#b5b5b5',desc:'Smallest planet, closest to Sun. Surface temp: -180°C to 430°C',angle:0},{name:'Venus',r:7,orbit:80,speed:.035,color:'#e8c47a',desc:'Hottest planet at 465°C average. Thick CO2 atmosphere.',angle:1},{name:'Earth',r:8,orbit:115,speed:.03,color:'#4b9cd3',desc:'Our home. Only known planet with life. 71% covered by water.',angle:2},{name:'Mars',r:5,orbit:155,speed:.024,color:'#c1440e',desc:'The Red Planet. Has the tallest volcano: Olympus Mons (22km).',angle:3},{name:'Jupiter',r:16,orbit:210,speed:.013,color:'#c88b3a',desc:'Largest planet. Great Red Spot storm has lasted 350+ years.',angle:4},{name:'Saturn',r:13,orbit:265,speed:.009,color:'#e4d191',desc:'Has stunning ring system made of ice and rock. 82 moons.',angle:5}];
function draw(){
  ctx.fillStyle='#060a10';ctx.fillRect(0,0,W,H);
  // Stars
  ctx.fillStyle='rgba(255,255,255,.6)';
  for(let i=0;i<80;i++){ctx.beginPath();ctx.arc((i*137)%W,(i*197)%H,(i%3)*0.5+0.5,0,Math.PI*2);ctx.fill();}
  // Sun
  const sg=ctx.createRadialGradient(cx,cy,0,cx,cy,22);sg.addColorStop(0,'#fff7a1');sg.addColorStop(0.5,'#ffcc00');sg.addColorStop(1,'rgba(255,150,0,0)');ctx.beginPath();ctx.arc(cx,cy,22,0,Math.PI*2);ctx.fillStyle=sg;ctx.fill();
  planets.forEach(p=>{
    p.angle+=p.speed*.02;
    const x=cx+Math.cos(p.angle)*p.orbit;const y=cy+Math.sin(p.angle)*p.orbit;
    // Orbit
    ctx.beginPath();ctx.arc(cx,cy,p.orbit,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;ctx.stroke();
    // Planet
    const pg=ctx.createRadialGradient(x-p.r*.3,y-p.r*.3,0,x,y,p.r);pg.addColorStop(0,'#fff');pg.addColorStop(0.3,p.color);pg.addColorStop(1,'rgba(0,0,0,.5)');ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();
    // Saturn rings
    if(p.name==='Saturn'){ctx.beginPath();ctx.ellipse(x,y,p.r+10,4,0,0,Math.PI*2);ctx.strokeStyle='rgba(228,209,145,.5)';ctx.lineWidth=3;ctx.stroke();}
  });
  requestAnimationFrame(draw);
}
// Touch support
canvas.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0];const r=canvas.getBoundingClientRect();const me=new MouseEvent('click',{clientX:t.clientX,clientY:t.clientY});canvas.dispatchEvent(me);},{passive:false});
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect();const mx=(e.clientX-r.left)*(canvas.width/r.width);const my=(e.clientY-r.top)*(canvas.height/r.height);planets.forEach(p=>{const x=cx+Math.cos(p.angle)*p.orbit;const y=cy+Math.sin(p.angle)*p.orbit;const d=Math.sqrt((mx-x)**2+(my-y)**2);if(d<p.r+10){document.getElementById('sp-info').innerHTML=`<div style="font-size:22px;margin-bottom:6px">🪐 ${p.name}</div><p style="color:var(--muted);font-size:13px">${p.desc}</p>`;}});});
draw();</script>


</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
