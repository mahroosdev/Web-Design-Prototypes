<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>E-Commerce Store | DevOS</title>
  <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">SHOP_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">

<div class="page-header animate-in">
  <div class="row align between">
    <div class="row align" style="gap:10px"><span style="font-size:28px">🛍</span><h1>ShopOS</h1></div>
    <button class="btn btn-outline" onclick="toggleCart()" style="position:relative">
      🛒 Cart <span id="cart-badge" style="background:var(--accent4);color:#000;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-left:4px">0</span>
    </button>
  </div>
</div>
<div id="cart-panel" class="card animate-in" style="display:none;margin-bottom:14px;border-color:rgba(0,229,255,.2)">
  <div class="row between align" style="margin-bottom:12px"><h2 style="font-size:15px">🛒 Your Cart</h2><button class="btn btn-xs btn-ghost" onclick="toggleCart()">✕ Close</button></div>
  <div id="cart-items"></div>
  <div id="cart-empty" class="empty" style="padding:20px"><p>Your cart is empty</p></div>
  <div id="cart-footer" style="display:none;border-top:1px solid var(--border);padding-top:12px;margin-top:12px">
    <div class="row between align" style="margin-bottom:10px"><span style="color:var(--muted)">Subtotal</span><span style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:16px;font-weight:700">$<span id="cart-total">0</span></span></div>
    <button class="btn btn-primary btn-full" onclick="checkout()">Checkout →</button>
  </div>
</div>
<div class="card animate-in" style="margin-bottom:14px">
  <div class="row" style="gap:8px;margin-bottom:10px">
    <div class="input-group col"><span class="input-icon">🔍</span><input id="shop-search" placeholder="Search products..." oninput="filterProducts()" style="padding-left:38px"></div>
    <select id="shop-sort" onchange="filterProducts()" style="width:130px"><option value="">Sort: Default</option><option value="price-asc">Price ↑</option><option value="price-desc">Price ↓</option><option value="rating">Rating</option></select>
  </div>
  <div class="row" style="gap:6px;flex-wrap:wrap" id="cat-filters">
    <button class="chip active" onclick="setShopCat('',this)">All</button>
    <button class="chip" onclick="setShopCat('Electronics',this)">📱 Electronics</button>
    <button class="chip" onclick="setShopCat('Clothing',this)">👕 Clothing</button>
    <button class="chip" onclick="setShopCat('Books',this)">📚 Books</button>
    <button class="chip" onclick="setShopCat('Home',this)">🏠 Home</button>
  </div>
</div>
<div id="shop-grid" class="grid-auto animate-in"></div>

</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
