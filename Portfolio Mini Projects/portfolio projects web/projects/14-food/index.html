<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Food Delivery | DevOS</title>
  <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">FOOD_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">
<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">🍔</span><h1>Food Delivery</h1></div>
  <p>Browse restaurants, build your cart and place orders with real-time status.</p>
</div>


<h1>🍔 Food Delivery App</h1>
<p>Browse restaurants, add to cart and place food orders.</p>
<div style="margin-top:16px"><div class="card" style="margin-bottom:12px">
  <div class="row" style="gap:8px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px">
    <button class="btn btn-outline" style="font-size:12px;padding:7px 14px;min-height:36px;flex-shrink:0;border-color:var(--accent);color:var(--accent)" onclick="filterFood('all',this)">All</button>
    <button class="btn btn-outline" style="font-size:12px;padding:7px 14px;min-height:36px;flex-shrink:0" onclick="filterFood('burger',this)">🍔 Burgers</button>
    <button class="btn btn-outline" style="font-size:12px;padding:7px 14px;min-height:36px;flex-shrink:0" onclick="filterFood('pizza',this)">🍕 Pizza</button>
    <button class="btn btn-outline" style="font-size:12px;padding:7px 14px;min-height:36px;flex-shrink:0" onclick="filterFood('sushi',this)">🍣 Sushi</button>
    <button class="btn btn-outline" style="font-size:12px;padding:7px 14px;min-height:36px;flex-shrink:0" onclick="filterFood('dessert',this)">🍰 Dessert</button>
  </div>
</div>
<div id="food-cart" style="display:none" class="card" style="margin-bottom:12px"></div>
<div id="food-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px"></div></div>
<script>const foods=[{id:1,name:'Classic Burger',cat:'burger',price:8.99,icon:'🍔',time:'20 min',rating:4.7},{id:2,name:'BBQ Burger',cat:'burger',price:10.99,icon:'🍔',time:'25 min',rating:4.5},{id:3,name:'Margherita',cat:'pizza',price:12.99,icon:'🍕',time:'30 min',rating:4.8},{id:4,name:'Pepperoni',cat:'pizza',price:14.99,icon:'🍕',time:'30 min',rating:4.6},{id:5,name:'Salmon Roll',cat:'sushi',price:16.99,icon:'🍣',time:'20 min',rating:4.9},{id:6,name:'Tuna Maki',cat:'sushi',price:13.99,icon:'🍱',time:'20 min',rating:4.7},{id:7,name:'Cheesecake',cat:'dessert',price:5.99,icon:'🍰',time:'5 min',rating:4.8},{id:8,name:'Brownie',cat:'dessert',price:4.99,icon:'🍫',time:'5 min',rating:4.6}];
let cart={},fcurrent='all';
function filterFood(f,btn){fcurrent=f;document.querySelectorAll('#food-grid').forEach(()=>{});document.querySelectorAll('.btn-outline').forEach(b=>{b.style.borderColor='var(--border)';b.style.color='var(--muted)'});btn.style.borderColor='var(--accent)';btn.style.color='var(--accent)';renderFood();}
function renderFood(){const list=fcurrent==='all'?foods:foods.filter(f=>f.cat===fcurrent);document.getElementById('food-grid').innerHTML=list.map(f=>`<div class="card" style="cursor:pointer;transition:border-color .2s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'"><div style="font-size:44px;text-align:center;margin-bottom:10px">${f.icon}</div><div style="font-size:13px;font-weight:600;margin-bottom:4px">${f.name}</div><div style="font-size:11px;color:var(--muted);margin-bottom:8px">⭐${f.rating} · ${f.time}</div><div class="row" style="justify-content:space-between;align-items:center"><span style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:14px">$${f.price}</span><button class="btn btn-primary" style="padding:6px 12px;font-size:12px;min-height:34px" onclick="addFood(${f.id})">Add</button></div></div>`).join('');}
function addFood(id){const f=foods.find(x=>x.id===id);cart[id]=(cart[id]||0)+1;renderCart();toast('Added '+f.name);}
function renderCart(){const items=Object.entries(cart).filter(([,q])=>q>0);const panel=document.getElementById('food-cart');if(!items.length){panel.style.display='none';return;}const total=items.reduce((s,[id,q])=>{const f=foods.find(x=>x.id==id);return s+(f?f.price*q:0);},0);panel.style.display='block';panel.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="font-size:15px">🛒 Cart</h2><button class="btn btn-primary" style="font-size:12px;padding:7px 14px;min-height:34px" onclick="placeOrder()">Order $${total.toFixed(2)}</button></div>`+items.map(([id,q])=>{const f=foods.find(x=>x.id==id);return`<div class="row" style="justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(0,224,255,.06)"><span style="font-size:13px">${f.icon} ${f.name}</span><div class="row" style="gap:8px;align-items:center"><button onclick="cart[${id}]=Math.max(0,cart[${id}]-1);renderCart()" style="background:none;border:1px solid var(--border);color:var(--muted);width:24px;height:24px;border-radius:5px;cursor:pointer">-</button><span style="font-size:13px">${q}</span><button onclick="addFood(${id})" style="background:none;border:1px solid var(--border);color:var(--accent);width:24px;height:24px;border-radius:5px;cursor:pointer">+</button></div></div>`;}).join('');}
function placeOrder(){cart={};renderCart();toast('🚀 Order placed! Delivery in 30 min');}
renderFood();</script>


</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
