<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Calendar | DevOS</title>
  <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">CAL_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">
<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">📅</span><h1>Calendar</h1></div>
  <p>Monthly calendar with events, reminders and recurring event support.</p>
</div>


<h1>📅 Calendar App</h1>
<p>Interactive calendar with event creation and monthly view.</p>
<div style="margin-top:16px"><div class="card">
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:16px">
    <button class="btn btn-outline" onclick="changeMonth(-1)" style="width:36px;height:36px;padding:0;font-size:18px;min-height:36px">‹</button>
    <h2 id="cal-title" style="font-size:18px"></h2>
    <button class="btn btn-outline" onclick="changeMonth(1)" style="width:36px;height:36px;padding:0;font-size:18px;min-height:36px">›</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">
    <div style="text-align:center;font-size:11px;color:var(--muted);padding:4px;font-family:'JetBrains Mono',monospace">S</div>
    <div style="text-align:center;font-size:11px;color:var(--muted);padding:4px;font-family:'JetBrains Mono',monospace">M</div>
    <div style="text-align:center;font-size:11px;color:var(--muted);padding:4px;font-family:'JetBrains Mono',monospace">T</div>
    <div style="text-align:center;font-size:11px;color:var(--muted);padding:4px;font-family:'JetBrains Mono',monospace">W</div>
    <div style="text-align:center;font-size:11px;color:var(--muted);padding:4px;font-family:'JetBrains Mono',monospace">T</div>
    <div style="text-align:center;font-size:11px;color:var(--muted);padding:4px;font-family:'JetBrains Mono',monospace">F</div>
    <div style="text-align:center;font-size:11px;color:var(--muted);padding:4px;font-family:'JetBrains Mono',monospace">S</div>
  </div>
  <div id="cal-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px"></div>
  <div id="cal-events" style="margin-top:14px"></div>
  <div class="row" style="gap:8px;margin-top:12px">
    <input id="cal-ev" placeholder="Add event for selected date..." style="flex:1">
    <button class="btn btn-primary" onclick="addEvent()">Add</button>
  </div>
</div></div>
<script>let now=new Date(),sel=null;
const events={};
// Add some demo events
const td=new Date();
const key=d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
events[key(td)]=['Team standup 10am','Deploy v2.0'];
events[key(new Date(td.getTime()+86400000))]=['Client meeting 2pm'];
events[key(new Date(td.getTime()+3*86400000))]=['Code review'];
const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
function renderCal(){
  const y=now.getFullYear(),m=now.getMonth();
  document.getElementById('cal-title').textContent=months[m]+' '+y;
  const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();const today=new Date();
  let html='';for(let i=0;i<first;i++)html+='<div></div>';
  for(let d=1;d<=days;d++){
    const dt=new Date(y,m,d);const k=key(dt);const isToday=dt.toDateString()===today.toDateString();const isSel=sel&&sel.toDateString()===dt.toDateString();const hasEv=events[k]?.length>0;
    html+=`<div onclick="selectDay(${d})" style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;background:${isSel?'var(--accent)':isToday?'rgba(0,224,255,.12)':'transparent'};color:${isSel?'#000':isToday?'var(--accent)':'var(--text)'};font-size:13px;font-weight:${isToday?700:400};transition:background .15s;position:relative" onmouseover="if(!${isSel})this.style.background='rgba(0,224,255,.08)'" onmouseout="if(!${isSel})this.style.background='${isToday?'rgba(0,224,255,.12)':'transparent'}'">
      ${d}${hasEv?`<div style="width:5px;height:5px;border-radius:50%;background:${isSel?'#000':'var(--accent4)'};position:absolute;bottom:3px"></div>`:''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
  renderEvents();
}
function selectDay(d){sel=new Date(now.getFullYear(),now.getMonth(),d);renderCal();}
function renderEvents(){const k=sel?key(sel):'';const evs=events[k]||[];document.getElementById('cal-events').innerHTML=sel?`<div style="font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:8px">${sel.toDateString()}</div>${evs.length?evs.map((e,i)=>`<div class="row" style="justify-content:space-between;padding:8px 12px;background:var(--card2);border-radius:8px;margin-bottom:6px;font-size:13px"><span>📅 ${e}</span><button onclick="delEv('${k}',${i})" style="background:none;border:none;color:var(--muted);cursor:pointer">✕</button></div>`).join(''):`<div style="font-size:13px;color:var(--muted)">No events. Add one below.</div>`}`:'';}
function addEvent(){if(!sel){toast('Select a date first');return;}const v=document.getElementById('cal-ev').value.trim();if(!v)return;const k=key(sel);if(!events[k])events[k]=[];events[k].push(v);document.getElementById('cal-ev').value='';renderCal();}
function delEv(k,i){events[k].splice(i,1);renderEvents();}
function changeMonth(d){now=new Date(now.getFullYear(),now.getMonth()+d,1);sel=null;renderCal();}
renderCal();</script>


</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
