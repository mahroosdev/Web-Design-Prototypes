<div class="page-header animate-in">

<h1>📸 Instagram Clone</h1>
<p>Photo feed with likes, comments, stories and explore grid.</p>
<div style="margin-top:16px"><div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none">
  <div style="flex-shrink:0;text-align:center" onclick="toast('Your story')"><div style="width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--accent4),#f97316);padding:2px;margin:0 auto 4px"><div style="width:100%;height:100%;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px">➕</div></div><div style="font-size:10px;color:var(--muted)">Your Story</div></div>
  <div style="flex-shrink:0;text-align:center" onclick="toast('alex_dev story')"><div style="width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#f97316,#ec4899);padding:2px;margin:0 auto 4px"><div style="width:100%;height:100%;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px">👨‍💻</div></div><div style="font-size:10px;color:var(--muted)">alex_dev</div></div>
  <div style="flex-shrink:0;text-align:center" onclick="toast('design_ui story')"><div style="width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#06b6d4);padding:2px;margin:0 auto 4px"><div style="width:100%;height:100%;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px">🎨</div></div><div style="font-size:10px;color:var(--muted)">design_ui</div></div>
  <div style="flex-shrink:0;text-align:center" onclick="toast('coder_life story')"><div style="width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);padding:2px;margin:0 auto 4px"><div style="width:100%;height:100%;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px">💻</div></div><div style="font-size:10px;color:var(--muted)">coder_life</div></div>
</div>
<div id="ig-feed"></div></div>
<script>const posts=[{id:1,user:'alex_dev',avatar:'👨‍💻',img:'🌆',caption:'Late night coding session. The city never sleeps and neither do I. 💻✨ #coding #nightlife',likes:342,comments:['Great shot!','So relatable 😂','Keep grinding!'],liked:false,time:'2h'},{id:2,user:'design_ui',avatar:'🎨',img:'🎭',caption:'New UI concept dropped! Glassmorphism meets brutalism. What do you think? 🎨 #UIdesign #creative',likes:891,comments:['This is stunning','Mind blown 🤯','Tutorial please!'],liked:false,time:'4h'},{id:3,user:'coder_life',avatar:'💻',img:'🏔',caption:'Taking a break from screens. Sometimes you need to recharge to code better. 🏔 #worklifebalance',likes:556,comments:['Well deserved!','Where is this?','Beautiful 😍'],liked:false,time:'6h'}];
let newComment={};
function renderFeed(){document.getElementById('ig-feed').innerHTML=posts.map((p,i)=>`<div class="card" style="margin-bottom:14px;padding:0;overflow:hidden"><div style="padding:12px;display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:20px">${p.avatar}</div><div style="flex:1"><div style="font-size:14px;font-weight:600">${p.user}</div><div style="font-size:11px;color:var(--muted)">${p.time} ago</div></div><button style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer">•••</button></div><div style="width:100%;aspect-ratio:1;background:linear-gradient(135deg,rgba(0,224,255,.08),rgba(129,140,248,.12));display:flex;align-items:center;justify-content:center;font-size:100px">${p.img}</div><div style="padding:12px"><div class="row" style="gap:14px;margin-bottom:10px"><button onclick="likePost(${i})" style="background:none;border:none;font-size:22px;cursor:pointer;-webkit-tap-highlight-color:transparent">${p.liked?'❤️':'🤍'}</button><button style="background:none;border:none;font-size:22px;cursor:pointer">💬</button><button style="background:none;border:none;font-size:22px;cursor:pointer">📤</button></div><div style="font-size:13px;font-weight:600;margin-bottom:4px">${p.likes} likes</div><div style="font-size:13px;margin-bottom:8px"><span style="font-weight:600">${p.user}</span> ${p.caption}</div><div style="font-size:12px;color:var(--muted);margin-bottom:8px">${p.comments.map(c=>`<div>• ${c}</div>`).join('')}</div><div class="row" style="gap:8px"><input placeholder="Add a comment..." style="flex:1;font-size:13px;padding:8px 10px" onkeydown="if(event.key==='Enter'){addComment(${i},this.value);this.value=''}" id="ci${i}"><button onclick="addComment(${i},document.getElementById('ci${i}').value);document.getElementById('ci${i}').value=''" style="background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;white-space:nowrap">Post</button></div></div></div>`).join('');}
function likePost(i){posts[i].liked=!posts[i].liked;posts[i].likes+=posts[i].liked?1:-1;renderFeed();}
function addComment(i,v){if(v.trim()){posts[i].comments.push(v.trim());renderFeed();}}
renderFeed();</script>


</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
