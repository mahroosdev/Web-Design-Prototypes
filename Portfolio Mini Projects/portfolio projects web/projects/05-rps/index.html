<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Rock Paper Scissors | DevOS</title>
  <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">RPS_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">

<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">✊</span><h1>Rock Paper Scissors</h1></div>
  <p>Classic game vs AI or 2-player mode. Track streaks, win rates and match history.</p>
</div>
<div class="stats-grid animate-in">
  <div class="stat-card"><div class="stat-val" id="sc-w" style="color:var(--accent3)">0</div><div class="stat-lbl">Wins</div></div>
  <div class="stat-card"><div class="stat-val" id="sc-d" style="color:var(--muted)">0</div><div class="stat-lbl">Draws</div></div>
  <div class="stat-card"><div class="stat-val" id="sc-l" style="color:var(--accent4)">0</div><div class="stat-lbl">Losses</div></div>
  <div class="stat-card"><div class="stat-val" id="sc-s" style="color:var(--accent2)">0</div><div class="stat-lbl">Best Streak</div></div>
</div>
<div class="card animate-in" style="text-align:center;margin-bottom:14px">
  <div class="row center" style="gap:20px;margin-bottom:20px">
    <div><div style="font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:6px">YOU</div><div id="p-pick" style="font-size:72px;min-height:80px;transition:transform .3s">❓</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
      <div style="font-size:20px;color:var(--dim)">VS</div>
      <div id="rps-res" style="font-size:13px;font-weight:700;color:var(--accent);min-height:20px;font-family:'JetBrains Mono',monospace"></div>
    </div>
    <div><div style="font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:6px">CPU</div><div id="c-pick" style="font-size:72px;min-height:80px;transition:transform .3s">❓</div></div>
  </div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:14px">Current streak: <span id="cur-streak" style="color:var(--accent2);font-weight:700">0</span></div>
  <div class="row center" style="gap:12px">
    <button onclick="play('✊')" class="btn btn-outline" style="width:80px;height:80px;border-radius:16px;font-size:40px;padding:0;border-width:2px">✊</button>
    <button onclick="play('✋')" class="btn btn-outline" style="width:80px;height:80px;border-radius:16px;font-size:40px;padding:0;border-width:2px">✋</button>
    <button onclick="play('✌️')" class="btn btn-outline" style="width:80px;height:80px;border-radius:16px;font-size:40px;padding:0;border-width:2px">✌️</button>
  </div>
  <div class="row center" style="gap:8px;margin-top:14px">
    <button class="btn btn-xs btn-ghost" onclick="resetGame()">Reset Stats</button>
    <button class="btn btn-xs btn-ghost" onclick="toggleMode()" id="mode-btn">Mode: vs CPU</button>
  </div>
</div>
<div class="section-title">Match History</div>
<div id="rps-hist"></div>

</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
