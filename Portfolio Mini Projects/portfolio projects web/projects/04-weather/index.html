<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Weather App | DevOS</title>
  <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">WEATHER_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">

<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">🌤</span><h1>Weather</h1><span class="badge badge-accent">Live API</span></div>
  <p>Real-time weather with 7-day forecast, hourly data and animated conditions.</p>
</div>
<div class="card animate-in" style="margin-bottom:14px">
  <div class="row" style="gap:8px">
    <div class="input-group col"><span class="input-icon">🔍</span><input id="wx-city" placeholder="Search city..." onkeydown="if(event.key==='Enter')searchCity()" value="Kuwait City"></div>
    <button class="btn btn-primary" onclick="searchCity()" style="min-width:80px">Search</button>
    <button class="btn btn-outline btn-icon" onclick="getLocation()" title="My Location">📍</button>
  </div>
  <div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap" id="wx-recent"></div>
</div>
<div id="wx-main" style="display:none" class="animate-in">
  <div class="card" style="background:linear-gradient(135deg,var(--bg2),var(--bg3));margin-bottom:12px;text-align:center;padding:28px 20px">
    <div id="wx-city-name" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.2em;margin-bottom:8px"></div>
    <div id="wx-icon" style="font-size:80px;margin-bottom:8px;animation:bounce 2s ease-in-out infinite"></div>
    <div id="wx-temp" style="font-size:clamp(52px,14vw,72px);font-weight:800;color:var(--accent);line-height:1;letter-spacing:-.03em"></div>
    <div id="wx-desc" style="font-size:14px;color:var(--muted);margin-top:8px;text-transform:capitalize"></div>
    <div id="wx-feels" style="font-size:12px;color:var(--dim);margin-top:4px"></div>
  </div>
  <div class="stats-grid" id="wx-details" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px"></div>
  <div class="section-title">7-Day Forecast</div>
  <div id="wx-forecast" class="row nowrap" style="gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch"></div>
  <div class="section-title" style="margin-top:16px">Hourly</div>
  <div id="wx-hourly" class="row nowrap" style="gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch"></div>
</div>
<div id="wx-loading" style="text-align:center;padding:40px;display:none"><div class="loading" style="width:60px;height:60px;border-radius:50%;margin:0 auto"></div><p style="margin-top:12px;color:var(--muted)">Loading weather...</p></div>
<div id="wx-err" class="card" style="display:none;border-color:rgba(255,77,141,.3);color:var(--accent4);text-align:center;padding:20px"></div>

</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
