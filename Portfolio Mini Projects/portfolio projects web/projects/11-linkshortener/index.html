<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Link Shortener | DevOS</title>
  <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">LINK_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">

<div class="page-header animate-in"><div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">🔗</span><h1>Link Shortener</h1></div><p>Shorten URLs with custom aliases, track clicks and manage link history.</p></div>
<div class="card animate-in" style="margin-bottom:14px">
  <div class="form-group"><label>Long URL</label><input id="ls-url" placeholder="https://your-very-long-url.com/..."></div>
  <div class="form-group"><label>Custom Alias (optional)</label><div class="input-group"><span class="input-icon" style="left:12px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--muted)">dvos.io/</span><input id="ls-alias" placeholder="my-link" style="padding-left:68px"></div></div>
  <button class="btn btn-primary btn-full" onclick="shortenLink()">⚡ Shorten URL</button>
</div>
<div id="ls-result" class="card animate-in" style="display:none;margin-bottom:14px;border-color:rgba(0,229,255,.3)">
  <div style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:8px">✅ SHORTENED URL</div>
  <div class="row align" style="gap:8px">
    <div id="ls-short" style="flex:1;background:var(--bg);border:1px solid var(--border);padding:11px 14px;border-radius:var(--r3);font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--accent)"></div>
    <button class="btn btn-outline btn-icon" onclick="copyShort()">📋</button>
    <button class="btn btn-outline btn-icon" onclick="shareShort()">↗</button>
  </div>
</div>
<div class="section-title">Link History</div>
<div id="ls-hist"></div>
</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
