  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

</head>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">NEURAL_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">
<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">🕸</span><h1>Neural Network</h1></div>
  <p>Interactive neural network with forward pass and weight visualization.</p>
</div>


<h1>🕸 Neural Network Viz</h1>
<p>Interactive neural network visualization with forward pass animation.</p>
<div style="margin-top:16px"><canvas id="nn-canvas" style="width:100%;height:380px;border-radius:14px;border:1px solid var(--border);display:block;touch-action:none"></canvas>
<div class="card" style="margin-top:12px">
  <div class="row" style="gap:8px;margin-bottom:10px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="forwardPass()" style="font-size:13px;flex:1">▶ Forward Pass</button>
    <button class="btn btn-outline" onclick="randomWeights()" style="font-size:13px;flex:1">🎲 Randomize</button>
  </div>
  <div id="nn-output" style="font-family:JetBrains Mono,monospace;font-size:12px;color:var(--accent)">Click Forward Pass to run the network</div>
</div></div>
<script>const canvas=document.getElementById('nn-canvas');const ctx=canvas.getContext('2d');canvas.width=canvas.offsetWidth;canvas.height=380;
const layers=[{nodes:3,label:'Input'},{nodes:5,label:'Hidden 1'},{nodes:4,label:'Hidden 2'},{nodes:2,label:'Output'}];
let weights=[];let activations=layers.map(l=>Array(l.nodes).fill(0));let animating=false;
function randomWeights(){weights=layers.slice(0,-1).map((l,i)=>Array(l.nodes).fill(0).map(()=>Array(layers[i+1].nodes).fill(0).map(()=>(Math.random()*2-1).toFixed(2))));}
function getNodePos(li,ni){const lx=canvas.width*(li+1)/(layers.length+1);const ly=canvas.height/2+(ni-(layers[li].nodes-1)/2)*60;return{x:lx,y:ly};}
function draw(){
  ctx.fillStyle='#060a10';ctx.fillRect(0,0,canvas.width,canvas.height);
  // Connections
  layers.forEach((layer,li)=>{if(li>=layers.length-1)return;layer.nodes&&Array.from({length:layer.nodes},(_,ni)=>{Array.from({length:layers[li+1].nodes},(_,nni)=>{const a=getNodePos(li,ni);const b=getNodePos(li+1,nni);const w=weights[li]?parseFloat(weights[li][ni][nni]):0;const alpha=Math.abs(w)*.5+.1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=w>0?`rgba(0,224,255,${alpha})`:`rgba(244,114,182,${alpha})`;ctx.lineWidth=Math.abs(w)+.5;ctx.stroke();});});});
  // Nodes
  layers.forEach((layer,li)=>{Array.from({length:layer.nodes},(_,ni)=>{const p=getNodePos(li,ni);const act=activations[li][ni];const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,16);g.addColorStop(0,`rgba(0,224,255,${.3+act*.7})`);g.addColorStop(1,`rgba(0,224,255,${.05+act*.2})`);ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=`rgba(0,224,255,${.3+act*.5})`;ctx.lineWidth=1.5;ctx.stroke();if(act>.01){ctx.fillStyle='#fff';ctx.font='9px JetBrains Mono,monospace';ctx.textAlign='center';ctx.fillText(act.toFixed(1),p.x,p.y+3);}});ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='10px JetBrains Mono,monospace';ctx.textAlign='center';const p=getNodePos(li,0);ctx.fillText(layer.label,p.x,30);});
}
function forwardPass(){if(animating)return;animating=true;activations[0]=[Math.random(),Math.random(),Math.random()].map(v=>parseFloat(v.toFixed(2)));let step=0;const iv=setInterval(()=>{step++;if(step<layers.length){activations[step]=Array.from({length:layers[step].nodes},(_,i)=>{const sum=activations[step-1].reduce((s,a,j)=>s+a*(weights[step-1]?parseFloat(weights[step-1][j][i]):Math.random()),0);return parseFloat((1/(1+Math.exp(-sum))).toFixed(2));});}else{clearInterval(iv);animating=false;const out=activations[activations.length-1];document.getElementById('nn-output').textContent=`Output: [${out.join(', ')}] → Class ${out[0]>out[1]?0:1} (confidence: ${(Math.max(...out)*100).toFixed(1)}%)`;}draw();},400);}
randomWeights();draw();draw();</script>


</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
