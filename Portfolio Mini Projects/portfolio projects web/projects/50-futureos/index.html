<h1>🖥 FutureOS Desktop</h1>
<p>A futuristic OS-like desktop with apps, taskbar and widgets.</p>
<div style="margin-top:16px"><div id="os-desktop" style="background:linear-gradient(135deg,#060a10,#0d1b2a);border-radius:14px;border:1px solid var(--border);overflow:hidden;position:relative;min-height:500px">
  <!-- Wallpaper grid -->
  <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(0,224,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,224,255,.03) 1px,transparent 1px);background-size:30px 30px;pointer-events:none"></div>
  <!-- Topbar -->
  <div style="position:sticky;top:0;z-index:10;background:rgba(6,10,16,.9);backdrop-filter:blur(12px);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,224,255,.1)">
    <div style="font-family:JetBrains Mono,monospace;font-size:12px;color:var(--accent)">DEVOS <span style="color:var(--muted)">v3.0</span></div>
    <div id="os-clock" style="font-family:JetBrains Mono,monospace;font-size:12px;color:var(--text)"></div>
    <div class="row" style="gap:8px;font-size:12px"><span style="color:var(--accent3)">●</span><span style="color:var(--muted)">WiFi</span><span style="color:var(--accent)">88%🔋</span></div>
  </div>
  <!-- Desktop icons -->
  <div style="padding:16px;display:grid;grid-template-columns:repeat(auto-fill,72px);gap:12px;min-height:320px" id="os-icons"></div>
  <!-- Window backdrop -->
  <div id="os-backdrop" onclick="closeWin()" style="display:none;position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.3);backdrop-filter:blur(2px)"></div>
  <!-- Window -->
  <div id="os-window" style="display:none;position:absolute;top:54px;left:12px;right:12px;background:rgba(10,16,28,.98);border:1px solid rgba(0,224,255,.25);border-radius:14px;overflow:hidden;z-index:20;box-shadow:0 8px 40px rgba(0,0,0,.6);transition:transform .2s,opacity .2s">
    <!-- Window titlebar -->
    <div style="padding:10px 14px;background:rgba(0,229,255,.06);border-bottom:1px solid rgba(0,224,255,.12);display:flex;align-items:center;justify-content:space-between;user-select:none">
      <span id="os-win-title" style="font-size:13px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--accent)"></span>
      <div style="display:flex;gap:6px;align-items:center">
        <!-- Minimize -->
        <button onclick="minimizeWin()" title="Minimize" style="width:14px;height:14px;border-radius:50%;background:#f59e0b;border:none;cursor:pointer;font-size:0;transition:opacity .15s" onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'"></button>
        <!-- Maximize -->
        <button onclick="maximizeWin()" title="Maximize" id="os-max-btn" style="width:14px;height:14px;border-radius:50%;background:#10b981;border:none;cursor:pointer;font-size:0;transition:opacity .15s" onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'"></button>
        <!-- Close -->
        <button onclick="closeWin()" title="Close (ESC)" style="width:14px;height:14px;border-radius:50%;background:#ef4444;border:none;cursor:pointer;font-size:0;transition:opacity .15s;margin-left:4px" onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'"></button>
      </div>
    </div>
    <div id="os-win-content" style="padding:16px;max-height:380px;overflow-y:auto;overflow-x:hidden"></div>
  </div>
  <!-- Dock -->
  <div style="position:relative;z-index:18;padding:10px 16px;border-top:1px solid rgba(0,224,255,.08);background:rgba(6,10,16,.8);backdrop-filter:blur(8px);display:flex;gap:8px;justify-content:center" id="os-dock"></div>
</div></div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
