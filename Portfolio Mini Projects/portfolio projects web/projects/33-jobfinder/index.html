<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Job Finder | DevOS</title>
  <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">JOBS_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">
<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">💼</span><h1>Job Finder</h1></div>
  <p>Search jobs with filters, save favourites and track applications.</p>
</div>


<h1>💼 Job Finder</h1>
<p>Search and filter job listings with save and apply features.</p>
<div style="margin-top:16px"><div class="card" style="margin-bottom:12px">
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <input id="job-q" placeholder="Job title, skills..." style="flex:2;min-width:140px">
    <select id="job-type" style="flex:1;min-width:120px"><option value="">All Types</option><option>Full-time</option><option>Part-time</option><option>Remote</option><option>Contract</option></select>
    <button class="btn btn-primary" onclick="filterJobs()">Search</button>
  </div>
</div>
<div id="job-list"></div></div>
<script>const jobs=[{id:1,title:'Senior Frontend Dev',company:'TechCorp',type:'Remote',salary:'$120K-$160K',skills:['React','TypeScript','Node.js'],posted:'2d',saved:false},{id:2,title:'UI/UX Designer',company:'DesignLab',type:'Full-time',salary:'$90K-$120K',skills:['Figma','CSS','User Research'],posted:'1d',saved:false},{id:3,title:'Full Stack Engineer',company:'StartupX',type:'Remote',salary:'$100K-$140K',skills:['Vue.js','Python','PostgreSQL'],posted:'3d',saved:true},{id:4,title:'React Native Dev',company:'AppFactory',type:'Contract',salary:'$80/hr',skills:['React Native','iOS','Android'],posted:'5d',saved:false},{id:5,title:'DevOps Engineer',company:'CloudBase',type:'Full-time',salary:'$130K-$170K',skills:['AWS','Docker','Kubernetes'],posted:'1d',saved:false},{id:6,title:'CSS/HTML Specialist',company:'WebAgency',type:'Part-time',salary:'$50K-$70K',skills:['HTML','CSS','Animation'],posted:'4d',saved:false}];
function filterJobs(){const q=document.getElementById('job-q').value.toLowerCase();const t=document.getElementById('job-type').value;const list=jobs.filter(j=>(!q||(j.title+j.company+j.skills.join()).toLowerCase().includes(q))&&(!t||j.type===t));renderJobs(list);}
function renderJobs(list=jobs){document.getElementById('job-list').innerHTML=list.map((j,i)=>`<div class="card" style="margin-bottom:10px"><div class="row" style="justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><h2 style="font-size:15px;margin-bottom:3px">${j.title}</h2><div style="font-size:12px;color:var(--muted)">${j.company}</div></div><button onclick="jobs[${i}].saved=!jobs[${i}].saved;renderJobs()" style="background:none;border:none;font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent">${j.saved?'🔖':'🔖'}</button></div><div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">${j.skills.map(s=>`<span class="chip">${s}</span>`).join('')}</div><div class="row" style="justify-content:space-between;align-items:center"><div class="row" style="gap:8px"><span style="font-size:11px;background:rgba(0,224,255,.08);color:var(--accent);padding:3px 10px;border-radius:20px;border:1px solid var(--border)">${j.type}</span><span style="font-size:11px;color:var(--accent3);font-family:'JetBrains Mono',monospace">${j.salary}</span></div><div class="row" style="gap:8px;align-items:center"><span style="font-size:11px;color:var(--muted)">${j.posted} ago</span><button class="btn btn-primary" onclick="applyJob('${j.title}')" style="font-size:12px;padding:6px 14px;min-height:34px">Apply</button></div></div></div>`).join('');}
function applyJob(t){toast('✅ Applied to: '+t);}
renderJobs();</script>


</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
