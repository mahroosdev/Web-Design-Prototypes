<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Task Manager | DevOS</title>
  <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">TASK_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">

<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">✅</span><h1>Task Manager</h1><span class="badge badge-success" id="task-badge">0 tasks</span></div>
  <p>Manage tasks with priorities, due dates, categories, drag-to-reorder and local persistence.</p>
</div>
<div class="card animate-in" style="margin-bottom:14px">
  <div class="form-group"><label>Task</label><input id="t-in" placeholder="What needs to be done?" onkeydown="if(event.key==='Enter')addTask()"></div>
  <div class="row" style="gap:8px;margin-bottom:12px">
    <div class="col"><label>Priority</label>
      <select id="t-pri"><option value="high">🔴 High</option><option value="med" selected>🟡 Medium</option><option value="low">🟢 Low</option></select></div>
    <div class="col"><label>Category</label>
      <select id="t-cat"><option value="work">💼 Work</option><option value="personal">🏠 Personal</option><option value="health">💪 Health</option><option value="learn">📚 Learn</option></select></div>
    <div class="col"><label>Due Date</label><input type="date" id="t-due"></div>
  </div>
  <button class="btn btn-primary btn-full" onclick="addTask()">+ Add Task</button>
</div>
<div class="row align" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">
  <button class="chip active" id="f-all" onclick="setFilter('all',this)">All</button>
  <button class="chip" id="f-active" onclick="setFilter('active',this)">Active</button>
  <button class="chip" id="f-done" onclick="setFilter('done',this)">Done</button>
  <div style="margin-left:auto;display:flex;gap:6px">
    <button class="btn btn-xs btn-ghost" onclick="sortTasks('pri')">Sort: Priority</button>
    <button class="btn btn-xs btn-danger" onclick="clearDone()">Clear Done</button>
  </div>
</div>
<div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
  <div class="stat-card"><div class="stat-val" id="s-total" style="color:var(--accent)">0</div><div class="stat-lbl">Total</div></div>
  <div class="stat-card"><div class="stat-val" id="s-active" style="color:var(--accent2)">0</div><div class="stat-lbl">Active</div></div>
  <div class="stat-card"><div class="stat-val" id="s-done" style="color:var(--accent3)">0</div><div class="stat-lbl">Done</div></div>
  <div class="stat-card"><div class="stat-val" id="s-overdue" style="color:var(--accent4)">0</div><div class="stat-lbl">Overdue</div></div>
</div>
<div id="task-list"></div>

</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
