<h1>🌃 Cyberpunk UI Kit</h1>
<p>Futuristic cyberpunk-themed UI components and animations.</p>
<div style="margin-top:16px"><div style="background:linear-gradient(135deg,#0a0015,#000510);border:1px solid #ff00ff33;border-radius:16px;padding:24px;margin-bottom:14px;position:relative;overflow:hidden">
  <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ff00ff,#00ffff,transparent)"></div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#ff00ff;letter-spacing:.3em;margin-bottom:12px">NEURAL INTERFACE v2.0</div>
  <h1 style="font-size:clamp(24px,7vw,42px);font-weight:800;background:linear-gradient(90deg,#ff00ff,#00ffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px">CYBER PUNK</h1>
  <p style="color:#8892a4;font-size:12px;margin-bottom:18px">The city never sleeps. Neither do we.</p>
  <div class="row" style="gap:10px">
    <button onclick="toast('Jacking in...')" style="padding:12px 20px;background:linear-gradient(135deg,#ff00ff22,#ff00ff44);border:1px solid #ff00ff66;color:#ff00ff;font-family:JetBrains Mono,monospace;font-size:12px;border-radius:6px;cursor:pointer;letter-spacing:.1em">JACK IN</button>
    <button onclick="toast('Hacking...')" style="padding:12px 20px;background:linear-gradient(135deg,#00ffff22,#00ffff44);border:1px solid #00ffff66;color:#00ffff;font-family:JetBrains Mono,monospace;font-size:12px;border-radius:6px;cursor:pointer;letter-spacing:.1em">HACK</button>
  </div>
</div>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">
  <div style="background:#0a0015;border:1px solid #ff00ff33;border-radius:12px;padding:16px;text-align:center"><div style="font-family:JetBrains Mono,monospace;font-size:10px;color:#ff00ff;margin-bottom:6px">CREDITS</div><div style="font-size:28px;font-weight:800;color:#ff00ff" id="cy-creds">0</div></div>
  <div style="background:#000510;border:1px solid #00ffff33;border-radius:12px;padding:16px;text-align:center"><div style="font-family:JetBrains Mono,monospace;font-size:10px;color:#00ffff;margin-bottom:6px">NETRUNNER</div><div style="font-size:28px;font-weight:800;color:#00ffff">LVL 47</div></div>
</div>
<div style="background:#050010;border:1px solid #ff00ff22;border-radius:12px;padding:16px;font-family:JetBrains Mono,monospace;font-size:11px;color:#00ff41;max-height:160px;overflow-y:auto" id="cy-log"></div></div>
<script>const logs=['> SYSTEM BOOT... OK','> NEURAL LINK ESTABLISHED','> SCANNING PERIMETER...','> 47 THREATS DETECTED','> FIREWALL BYPASSED [SUCCESS]','> DOWNLOADING SHARD DATA...','> ENCRYPTION CRACKED','> ACCESS GRANTED TO MAINFRAME','> EXTRACTING CREDITS...','> COVER BLOWN - INITIATING ESCAPE PROTOCOL','> JACKING OUT...'];
let li=0;
function cnt(id,target,dur=1200){const el=document.getElementById(id);if(!el)return;let v=0,step=target/(dur/16);const t=setInterval(()=>{v=Math.min(v+step,target);el.textContent=Math.floor(v).toLocaleString();if(v>=target)clearInterval(t);},16);}
cnt('cy-creds',89420);
const logEl=document.getElementById('cy-log');
function addLog(){if(li<logs.length){logEl.innerHTML+=`<div>${logs[li++]}</div>`;logEl.scrollTop=9999;}else{li=0;logEl.innerHTML='';}}
setInterval(addLog,600);addLog();</script>


</div>

  <script src="script.js"></script>
