<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>

    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>

<div class="wrap">
<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">📈</span><h1>Analytics Tool</h1></div>
  <p>Web analytics with sessions, funnels, cohorts and export.</p>

<h1>📈 Analytics Tool</h1>
<p>Web analytics with sessions, sources, pages and conversions.</p>
<div style="margin-top:16px"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">
  <div class="card" style="text-align:center"><div style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:4px">SESSIONS</div><div style="font-size:28px;font-weight:800;color:var(--accent)" id="an-sessions">0</div></div>
  <div class="card" style="text-align:center"><div style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:4px">PAGEVIEWS</div><div style="font-size:28px;font-weight:800;color:var(--accent2)" id="an-views">0</div></div>
  <div class="card" style="text-align:center"><div style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:4px">BOUNCE RATE</div><div style="font-size:28px;font-weight:800;color:var(--accent4)">42%</div></div>
  <div class="card" style="text-align:center"><div style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:4px">CONVERSIONS</div><div style="font-size:28px;font-weight:800;color:var(--accent3)">3.2%</div></div>
</div>
<div class="card" style="margin-bottom:12px">
  <h2 style="font-size:14px;margin-bottom:12px">Traffic Sources</h2>
  <div id="an-sources"></div>
</div>
<div class="card">
  <h2 style="font-size:14px;margin-bottom:12px">Live Visitors</h2>
  <div id="an-live" style="font-family:'JetBrains Mono',monospace;font-size:12px;max-height:200px;overflow-y:auto"></div>
</div></div>
<script>const sources=[{name:'Organic Search',pct:42,color:'var(--accent)'},{name:'Direct',pct:28,color:'var(--accent2)'},{name:'Social Media',pct:18,color:'var(--accent4)'},{name:'Referral',pct:12,color:'var(--accent3)'}];
const pages=['/home','/projects','/about','/contact','/blog'];
let liveFeed=[];
function cnt(id,target,dur=1200){const el=document.getElementById(id);if(!el)return;let v=0,step=target/(dur/16);const t=setInterval(()=>{v=Math.min(v+step,target);el.textContent=Math.floor(v).toLocaleString();if(v>=target)clearInterval(t);},16);}
document.getElementById('an-sources').innerHTML=sources.map(s=>`<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between;margin-bottom:4px;font-size:12px"><span>${s.name}</span><span style="color:${s.color};font-family:'JetBrains Mono',monospace">${s.pct}%</span></div><div style="background:var(--card2);border-radius:4px;height:6px;overflow:hidden"><div style="height:100%;width:${s.pct}%;background:${s.color};border-radius:4px;transition:width 1s ease"></div></div></div>`).join('');
cnt('an-sessions',8420);cnt('an-views',24130);
function addLive(){const visitor={page:pages[Math.floor(Math.random()*pages.length)],loc:['Kuwait','UAE','KSA','UK','USA'][Math.floor(Math.random()*5)],time:new Date().toLocaleTimeString()};liveFeed.unshift(visitor);if(liveFeed.length>8)liveFeed.pop();document.getElementById('an-live').innerHTML=liveFeed.map(v=>`<div style="padding:6px 0;border-bottom:1px solid rgba(0,224,255,.05);color:var(--muted)"><span style="color:var(--accent3)">●</span> ${v.loc} → <span style="color:var(--accent)">${v.page}</span> <span style="float:right">${v.time}</span></div>`).join('');}
setInterval(addLive,1500);addLive();</script>


</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
