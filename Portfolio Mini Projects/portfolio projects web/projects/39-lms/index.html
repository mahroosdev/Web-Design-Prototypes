<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Learning Platform | DevOS</title>
  <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">LMS_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">
<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">🎓</span><h1>Learning Platform</h1></div>
  <p>Course player with lessons, quizzes, progress and certificates.</p>
</div>


<h1>🎓 Learning Management</h1>
<p>Online course platform with lessons, progress tracking and quizzes.</p>
<div style="margin-top:16px"><div class="card" style="margin-bottom:12px">
  <div class="row" style="gap:10px;align-items:center;margin-bottom:8px">
    <div style="width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:24px">🎓</div>
    <div><div style="font-size:15px;font-weight:600">Welcome back, Alex!</div><div style="font-size:12px;color:var(--muted)">3 courses in progress</div></div>
  </div>
  <div style="background:var(--card2);border-radius:6px;height:8px;overflow:hidden;margin-bottom:4px"><div style="height:100%;width:68%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px"></div></div>
  <div style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace">Overall Progress: 68%</div>
</div>
<div id="lms-courses"></div></div>
<script>const courses=[{title:'JavaScript Mastery',icon:'⚡',progress:85,lessons:24,done:20,color:'var(--accent)'},{title:'React & Next.js',icon:'⚛',progress:60,lessons:32,done:19,color:'var(--accent2)'},{title:'CSS Animation Pro',icon:'🎨',progress:45,lessons:18,done:8,color:'var(--accent4)'},{title:'Node.js Backend',icon:'🔧',progress:20,lessons:28,done:5,color:'var(--accent3)'}];
document.getElementById('lms-courses').innerHTML=courses.map((c,i)=>`<div class="card" style="margin-bottom:10px;cursor:pointer;transition:border-color .2s" onclick="openCourse(${i})" onmouseover="this.style.borderColor='rgba(0,224,255,.25)'" onmouseout="this.style.borderColor='var(--border)'"><div class="row" style="gap:12px;align-items:center;margin-bottom:12px"><div style="width:48px;height:48px;border-radius:12px;background:${c.color}22;border:1px solid ${c.color}44;display:flex;align-items:center;justify-content:center;font-size:24px">${c.icon}</div><div style="flex:1"><div style="font-size:14px;font-weight:600">${c.title}</div><div style="font-size:11px;color:var(--muted)">${c.done}/${c.lessons} lessons</div></div><span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:${c.color}">${c.progress}%</span></div><div style="background:var(--card2);border-radius:4px;height:5px;overflow:hidden"><div style="height:100%;width:${c.progress}%;background:${c.color};border-radius:4px;transition:width .8s ease"></div></div></div>`).join('');
function openCourse(i){const c=courses[i];toast(`📚 Opening: ${c.title}`);}</script>


</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
