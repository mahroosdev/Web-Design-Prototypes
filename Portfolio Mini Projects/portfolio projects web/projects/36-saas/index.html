<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>SaaS Dashboard | DevOS</title>
  <link rel="stylesheet" href="style.css">
</head>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="index.html">← BACK</a>
    <span class="topbar-logo">SAAS2_OS</span>
  </div>
  <div class="topbar-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">🌙</button>
  </div>
</div>
<div id="toast"></div>
<div class="wrap">
<div class="page-header animate-in">
  <div class="row align" style="gap:10px;margin-bottom:8px"><span style="font-size:28px">⚙</span><h1>SaaS Dashboard</h1></div>
  <p>Team management with billing, roles, usage metrics and settings.</p>
</div>


<h1>⚙ SaaS Dashboard</h1>
<p>Team management SaaS with users, billing and settings.</p>
<div style="margin-top:16px"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">
  <div class="card"><div style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:6px">ACTIVE SEATS</div><div style="font-size:28px;font-weight:700;color:var(--accent)">8 / 10</div></div>
  <div class="card"><div style="font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:6px">MONTHLY BILL</div><div style="font-size:28px;font-weight:700;color:var(--accent2)">$79</div></div>
</div>
<div class="card" style="margin-bottom:12px">
  <div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="font-size:15px">Team Members</h2><button class="btn btn-primary" style="font-size:12px;padding:7px 14px;min-height:34px" onclick="inviteMember()">+ Invite</button></div>
  <div id="saas-team"></div>
</div>
<div class="card">
  <h2 style="font-size:15px;margin-bottom:12px">Plan & Billing</h2>
  <div style="background:rgba(0,224,255,.06);border:1px solid rgba(0,224,255,.2);border-radius:12px;padding:16px;margin-bottom:10px"><div class="row" style="justify-content:space-between;align-items:center"><div><div style="font-weight:600">Pro Plan</div><div style="font-size:12px;color:var(--muted)">10 seats · Unlimited projects</div></div><div style="font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:18px">$79/mo</div></div></div>
  <button class="btn btn-outline" style="width:100%;font-size:13px" onclick="toast('Opening billing portal...')">Manage Billing</button>
</div></div>
<script>const team=[{name:'Alex Dev',role:'Admin',email:'alex@devos.io',avatar:'👨‍💻',status:'active'},{name:'Sarah UI',role:'Designer',email:'sarah@devos.io',avatar:'🎨',status:'active'},{name:'Mike Backend',role:'Developer',email:'mike@devos.io',avatar:'💻',status:'active'},{name:'Lena PM',role:'Manager',email:'lena@devos.io',avatar:'📋',status:'away'}];
function renderTeam(){document.getElementById('saas-team').innerHTML=team.map((m,i)=>`<div class="row" style="align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,224,255,.06)"><div style="width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px;position:relative">${m.avatar}<div style="width:10px;height:10px;border-radius:50%;background:${m.status==='active'?'var(--accent3)':'#fbbf24'};position:absolute;bottom:0;right:0;border:2px solid var(--bg)"></div></div><div style="flex:1"><div style="font-size:13px;font-weight:600">${m.name}</div><div style="font-size:11px;color:var(--muted)">${m.email}</div></div><select onchange="team[${i}].role=this.value;toast('Role updated')" style="font-size:11px;width:100px;padding:5px 8px"><option ${m.role==='Admin'?'selected':''}>Admin</option><option ${m.role==='Designer'?'selected':''}>Designer</option><option ${m.role==='Developer'?'selected':''}>Developer</option><option ${m.role==='Manager'?'selected':''}>Manager</option></select><button onclick="team.splice(${i},1);renderTeam()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px">✕</button></div>`).join('');}
function inviteMember(){toast('📧 Invite link copied to clipboard!');}
renderTeam();</script>


</div>
  <script src="../shared-back.js"></script>
  <script src="script.js"></script>
</body>
</html>
